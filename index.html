<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#04060d">
<title>Eternal Trails</title>
<style>
html,body{margin:0;height:100%;background:#04060d;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block}
#start{position:fixed;inset:0;background:transparent;cursor:pointer;z-index:5}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="start" aria-label="Tap to start"></div>
<script>
(function(){
'use strict';
/* ================= constants ================= */
var MAXN=2500, NB=72;               // balls to finish / colour buckets
var T_GOAL=34;                      // seconds (after launch) when the pacing curve reaches MAXN
var T_P=1.15;                       // curve shape
var T0=0.6;                         // intro before launch
var STEP=1/120;
var BASE_SPEED=560;
var BALL_R=6.5;
var RING_R=8.8;


var COOL=0.08;                      // per-ball cooldown after it spawned something
var SPAWN_CAP=64;                   // max spawns per rendered frame
var A=470;                          // half width of the arena (logical px, stage is 1080 wide)
var B=650, CY=900, H=1920, SC=1;    // set by layout()
var RY=325;                         // ring offset from the centre

/* ================= rng ================= */
var seed=(function(){var m=/[?&]seed=(\d+)/.exec(location.search);return m?+m[1]:(Math.random()*4294967296)>>>0;})();
function rnd(){seed=(seed+0x6D2B79F5)|0;var t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;}

/* ================= state ================= */
var cv=document.getElementById('cv'), ctx=cv.getContext('2d',{alpha:false});
var trailC=document.createElement('canvas'), tctx=trailC.getContext('2d');
var bgC=document.createElement('canvas');
var sprites=[], cols=[], colsHead=[];
var x=new Float32Array(MAXN),y=new Float32Array(MAXN),vx=new Float32Array(MAXN),vy=new Float32Array(MAXN);
var px=new Float32Array(MAXN),py=new Float32Array(MAXN),spd=new Float32Array(MAXN),lastHit=new Float32Array(MAXN);
var ins=new Uint8Array(MAXN);
var spawnK=new Uint8Array(128), spawnP=new Int32Array(128);
var N=1, simT=0, tt=0, state='idle', endT=0, finalTime=0, spawnsFrame=0, pend=0;
var ringPulse=[0,0], wallTicks=0, pingsPending=0, pingVel=0;
var A2=0,B2=0,iA2=0,iB2=0, drawTrailsFlag=true, acc=0, lastTs=0, running=false;
var rings=[{x:0,y:-RY},{x:0,y:RY}];

for(var b=0;b<NB;b++){
  var hue=((b*29)%NB)*(360/NB);
  cols.push('hsl('+hue.toFixed(0)+',96%,60%)');
  colsHead.push(hue);
}

function targetN(t){
  if(t<=0) return 1;
  var q=Math.pow(t/T_GOAL,T_P); if(q>1.2) q=1.2;
  return Math.exp(Math.log(MAXN)*q);
}

/* ================= layout ================= */
var stars=[];
function layout(){
  var iw=innerWidth, ih=innerHeight;
  H=Math.round(Math.max(1600,Math.min(2400,1080*ih/iw)));
  var cw=iw, ch=iw*H/1080;
  if(ch>ih){ch=ih;cw=ih*1080/H;}
  cv.style.width=cw+'px'; cv.style.height=ch+'px';
  var dpr=Math.min(window.devicePixelRatio||1,3);
  var pw=Math.max(300,Math.min(1080,Math.round(cw*dpr)));
  SC=pw/1080;
  cv.width=pw; cv.height=Math.round(H*SC);
  trailC.width=cv.width; trailC.height=cv.height;
  bgC.width=cv.width; bgC.height=cv.height;
  CY=H*0.47; B=Math.min(H*0.34,740); RY=B*0.5;
  rings[0].y=-RY; rings[1].y=RY;
  var a=A-BALL_R,b=B-BALL_R; A2=a*a;B2=b*b;iA2=1/A2;iB2=1/B2;
  tctx.setTransform(SC,0,0,SC,SC*540,SC*CY);
  tctx.lineCap='round'; tctx.lineJoin='round'; tctx.lineWidth=1.15;
  tctx.shadowBlur=0; tctx.globalAlpha=0.52;
  buildBg(); buildSprites();
  resetSim();
}

function buildBg(){
  var g=bgC.getContext('2d'); g.setTransform(1,0,0,1,0,0);
  g.fillStyle='#04060d'; g.fillRect(0,0,bgC.width,bgC.height);
  g.setTransform(SC,0,0,SC,0,0);
  var vg=g.createRadialGradient(540,CY,100,540,CY,H*0.75);
  vg.addColorStop(0,'#0a1020'); vg.addColorStop(1,'#03050a');
  g.fillStyle=vg; g.fillRect(0,0,1080,H);
  // dust
  var s0=seed; seed=1234567;
  for(var i=0;i<90;i++){ g.fillStyle='rgba(150,190,255,'+(0.05+rnd()*0.12).toFixed(3)+')'; var r=0.8+rnd()*1.4; g.fillRect(rnd()*1080,rnd()*H,r,r); }
  seed=s0;
  // arena floor
  g.save(); g.translate(540,CY);
  var ag=g.createRadialGradient(0,0,20,0,0,B);
  ag.addColorStop(0,'#0c1428'); ag.addColorStop(1,'#060a16');
  g.fillStyle=ag; g.beginPath(); g.ellipse(0,0,A,B,0,0,Math.PI*2); g.fill();
  g.strokeStyle='rgba(120,200,255,0.05)'; g.lineWidth=2;
  for(var k=1;k<=4;k++){ g.beginPath(); g.ellipse(0,0,A*k/5,B*k/5,0,0,Math.PI*2); g.stroke(); }
  g.restore();
}

function buildSprites(){
  sprites=[];
  var S=Math.max(10,Math.round(28*SC));
  for(var b=0;b<NB;b++){
    var c=document.createElement('canvas'); c.width=c.height=S; var g=c.getContext('2d');
    var m=S/2, u=S/28, hue=colsHead[b];
    var gr=g.createRadialGradient(m,m,0,m,m,m);
    gr.addColorStop(0,'hsla('+hue+',85%,60%,0.08)'); gr.addColorStop(1,'hsla('+hue+',85%,60%,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(m,m,m,0,7); g.fill();
    g.fillStyle='hsl('+hue+',100%,62%)'; g.beginPath(); g.arc(m,m,6.5*u,0,7); g.fill();
    g.fillStyle='#fff'; g.beginPath(); g.arc(m,m,3.0*u,0,7); g.fill();
    sprites.push(c);
  }
}

/* ================= simulation ================= */
function resetSim(){
  N=1; simT=0; tt=0; endT=0; spawnsFrame=0; pend=0; acc=0;
  ringPulse[0]=ringPulse[1]=0;
  tctx.save(); tctx.setTransform(1,0,0,1,0,0); tctx.clearRect(0,0,trailC.width,trailC.height); tctx.restore();
  // Aim the first ball directly through the upper ring.
  // A randomized launch angle could make it miss the very small opening.
  x[0]=0; y[0]=0; spd[0]=BASE_SPEED;
  var ang=Math.atan2(rings[0].y-y[0], rings[0].x-x[0]);
  vx[0]=Math.cos(ang)*BASE_SPEED; vy[0]=Math.sin(ang)*BASE_SPEED;
  px[0]=x[0]; py[0]=y[0]; ins[0]=0; lastHit[0]=-9;
  state=running?'play':'idle';
}

function step(dt){
  simT+=dt;
  if(simT<T0) return;
  tt=simT-T0;
  var target=targetN(tt);
  var free=tt>T_GOAL+3;
  var n0=N, i, k;
  var r0y=rings[0].y, r1y=rings[1].y;
  pend=0;
  for(i=0;i<n0;i++){
    var X=x[i],Y=y[i],VX=vx[i],VY=vy[i],s=spd[i];
    px[i]=X; py[i]=Y;
    // Straight-line movement: no attraction or steering.
    var vlen=Math.sqrt(VX*VX+VY*VY);
    if(vlen>0){ VX=VX/vlen*s; VY=VY/vlen*s; }
    X+=VX*dt; Y+=VY*dt;

    // Small stationary multiplier rings. Passing through the opening
    // keeps the original ball moving and creates exactly one new ball.
    var bi=ins[i];
    for(k=0;k<2;k++){
      var ry=k?r1y:r0y;
      var dx=X, dy=Y-ry;
      var d2=dx*dx+dy*dy;
      var bit=1<<k;

      if(d2<RING_R*RING_R){
        if(!(bi&bit)){
          bi|=bit;
          if(N+pend+1<=MAXN && spawnsFrame+pend+1<=SPAWN_CAP){
            spawnK[pend]=k; spawnP[pend]=i; pend++;
            ringPulse[k]=1;
            lastHit[i]=simT;
          }
        }
      }else if(d2>(RING_R+BALL_R+5)*(RING_R+BALL_R+5)){
        bi&=~bit;
      }
    }
    ins[i]=bi;
    // elliptical wall: angle of incidence = angle of reflection
    var f=X*X*iA2+Y*Y*iB2;
    if(f>1){
      var wx=X*iA2, wy=Y*iB2, wl=Math.sqrt(wx*wx+wy*wy); wx/=wl; wy/=wl;
      var vn=VX*wx+VY*wy;
      if(vn>0){ VX-=2*vn*wx; VY-=2*vn*wy; }
      var kk=0.9995/Math.sqrt(f); X*=kk; Y*=kk;
      if(N<=6) wallTicks++;
    }
    x[i]=X;y[i]=Y;vx[i]=VX;vy[i]=VY;
  }
  // permanent trails (batched: one stroke per colour bucket)
  if(drawTrailsFlag){
    var nb=n0<NB?n0:NB;
    for(var b=0;b<nb;b++){
      tctx.strokeStyle=cols[b]; tctx.globalAlpha=0.52; tctx.shadowBlur=0; tctx.beginPath();
      for(i=b;i<n0;i+=NB){ tctx.moveTo(px[i],py[i]); tctx.lineTo(x[i],y[i]); }
      tctx.stroke();
    }
  }
  // One new ball emerges beside the ball that passed through the ring.
  for(var j=0;j<pend;j++){
    var id=N++;
    var parent=spawnP[j];
    var kk2=spawnK[j];
    var sign=(rnd()<0.5)?-1:1;
    var baseA=Math.atan2(vy[parent],vx[parent]);
    var a=baseA+sign*0.12;
    var sp=BASE_SPEED;
    var sideX=-Math.sin(baseA)*sign*(BALL_R*1.35);
    var sideY=Math.cos(baseA)*sign*(BALL_R*1.35);
    x[id]=x[parent]+sideX;
    y[id]=y[parent]+sideY;
    px[id]=x[id]; py[id]=y[id]; spd[id]=sp;
    vx[id]=Math.cos(a)*sp; vy[id]=Math.sin(a)*sp;
    ins[id]=1<<kk2; lastHit[id]=simT;
  }
  if(pend){ spawnsFrame+=pend; pingsPending+=pend; }
  if(N>=MAXN && state==='play') endNow();
}

function endNow(){
  state='end'; endT=0; finalTime=tt;
  audioFinale();
}

/* ================= audio: soft ambient melody ================= */
var AC=null, master=null, comp=null, rev=null, revG=null;
var padG=null, padFilt=null, padOsc=[], padSub=null;
var melodyTimer=0, melodyIndex=0, lastChord=-1;
var SCALE=[57,60,62,64,67,69,72,74,76,79,81,84];
var CHORDS=[[57,60,64,45],[53,57,60,41],[55,60,64,48],[52,55,59,43]];
// A calm, original four-chord ambient progression with a sparse bell-like melody.
var MELODY=[
  [76,72,69,72,79,76,72,69],
  [74,69,65,69,76,74,69,65],
  [76,72,67,72,79,76,72,67],
  [74,71,67,71,79,74,71,67]
];
function mtof(m){return 440*Math.pow(2,(m-69)/12);}
function makeIR(sec){
  var sr=AC.sampleRate, len=Math.floor(sr*sec), buf=AC.createBuffer(2,len,sr);
  for(var c=0;c<2;c++){
    var d=buf.getChannelData(c);
    for(var i=0;i<len;i++){var t=i/len;d[i]=(Math.random()*2-1)*Math.pow(1-t,3.2);}
  }
  return buf;
}
function initAudio(){
  if(AC) return;
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  AC=new C({latencyHint:'playback'});
  master=AC.createGain(); master.gain.value=0.48;
  comp=AC.createDynamicsCompressor();
  comp.threshold.value=-22; comp.knee.value=24; comp.ratio.value=2.2;
  comp.attack.value=0.02; comp.release.value=0.35;
  master.connect(comp); comp.connect(AC.destination);

  rev=AC.createConvolver(); rev.buffer=makeIR(2.2);
  revG=AC.createGain(); revG.gain.value=0.22;
  rev.connect(revG); revG.connect(master);

  padG=AC.createGain(); padG.gain.value=0.105;
  padFilt=AC.createBiquadFilter(); padFilt.type='lowpass';
  padFilt.frequency.value=1100; padFilt.Q.value=0.35;
  padFilt.connect(padG); padG.connect(master); padG.connect(rev);

  for(var i=0;i<3;i++){
    var o=AC.createOscillator(), g=AC.createGain();
    o.type=i===1?'triangle':'sine';
    o.detune.value=(i-1)*5;
    o.frequency.value=220;
    g.gain.value=i===1?0.20:0.28;
    o.connect(g); g.connect(padFilt); o.start();
    padOsc.push(o);
  }
  padSub=AC.createOscillator(); padSub.type='sine';
  padSub.frequency.value=mtof(45);
  var sg=AC.createGain(); sg.gain.value=0.20;
  padSub.connect(sg); sg.connect(padG); padSub.start();
}
function playMelodyNote(note, when){
  if(!AC) return;
  var f=mtof(note);
  var o=AC.createOscillator(), g=AC.createGain();
  var o2=AC.createOscillator(), g2=AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(f,when);
  o2.type='triangle'; o2.frequency.setValueAtTime(f*2,when);
  g.gain.setValueAtTime(0.0001,when);
  g.gain.linearRampToValueAtTime(0.055,when+0.025);
  g.gain.exponentialRampToValueAtTime(0.0001,when+1.05);
  g2.gain.setValueAtTime(0.0001,when);
  g2.gain.linearRampToValueAtTime(0.009,when+0.02);
  g2.gain.exponentialRampToValueAtTime(0.0001,when+0.55);
  o.connect(g); o2.connect(g2);
  g.connect(master); g.connect(rev); g2.connect(master); g2.connect(rev);
  o.start(when); o2.start(when);
  o.stop(when+1.1); o2.stop(when+0.6);
}
function audioUpdate(){
  if(!AC) return;
  var t=AC.currentTime;
  var playing=state==='play'&&simT>=T0;
  var ci=Math.floor(Math.max(0,tt)/9)%4;
  if(ci!==lastChord){
    lastChord=ci;
    var ch=CHORDS[ci];
    for(var i=0;i<3;i++){
      padOsc[i].frequency.setTargetAtTime(mtof(ch[i]+(i===2?12:0)),t,1.2);
    }
    padSub.frequency.setTargetAtTime(mtof(ch[3]),t,1.4);
  }
  var targetGain=state==='end'?0.035:0.105;
  padG.gain.setTargetAtTime(targetGain,t,1.0);
  padFilt.frequency.setTargetAtTime(850+(playing?250:0),t,1.2);

  // Eight gentle notes per chord; no noise, risers, impact sounds or harsh pings.
  if(t>=melodyTimer){
    var chordIndex=Math.floor(Math.max(0,tt)/9)%4;
    var note=MELODY[chordIndex][melodyIndex%8];
    playMelodyNote(note,t+0.015);
    melodyIndex++;
    melodyTimer=t+0.72;
  }
}
function audioFinale(){
  if(!AC) return;
  // Let the ambient music soften naturally at the end; no boom or noise burst.
  padG.gain.setTargetAtTime(0.035,AC.currentTime,0.8);
}
/* ================= rendering ================= */
function txt(s,X,Y,size,col,alpha,weight){
  ctx.globalAlpha=alpha; ctx.font=(weight||800)+' '+size+'px -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif';
  ctx.lineWidth=size*0.14; ctx.strokeStyle='rgba(0,0,0,0.55)'; ctx.strokeText(s,X,Y);
  ctx.fillStyle=col; ctx.fillText(s,X,Y); ctx.globalAlpha=1;
}
function fmt(n){var s=''+n,o='';while(s.length>3){o=','+s.slice(-3)+o;s=s.slice(0,-3);}return s+o;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

function render(dtr){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(bgC,0,0); ctx.drawImage(trailC,0,0);
  ctx.setTransform(SC,0,0,SC,SC*540,SC*CY);
  // arena border (soft cyan)
  ctx.beginPath(); ctx.ellipse(0,0,A,B,0,0,6.2832);
  ctx.strokeStyle='rgba(40,200,255,0.025)'; ctx.lineWidth=8; ctx.stroke();
  ctx.strokeStyle='rgba(60,220,255,0.08)'; ctx.lineWidth=3.5; ctx.stroke();
  ctx.strokeStyle='rgba(143,244,255,0.48)'; ctx.lineWidth=2; ctx.stroke();
  // Two small, stationary multiplier rings.
  for(var k=0;k<2;k++){
    var ry=rings[k].y, pu=ringPulse[k];
    ringPulse[k]=pu>0?Math.max(0,pu-dtr*4):0;
    ctx.save();
    ctx.translate(0,ry);
    ctx.lineWidth=2.2;
    ctx.strokeStyle='rgba(220,184,74,0.88)';
    ctx.beginPath();
    ctx.arc(0,0,RING_R,0,Math.PI*2);
    ctx.stroke();
    ctx.lineWidth=1;
    ctx.strokeStyle='rgba(255,242,190,0.55)';
    ctx.beginPath();
    ctx.arc(0,0,RING_R-2.2,0,Math.PI*2);
    ctx.stroke();
    if(pu>0){
      ctx.globalAlpha=pu*0.45;
      ctx.lineWidth=1.5;
      ctx.strokeStyle='#ffe58a';
      ctx.beginPath();
      ctx.arc(0,0,RING_R+2+(1-pu)*3,0,Math.PI*2);
      ctx.stroke();
      ctx.globalAlpha=1;
    }
    ctx.restore();
  }
  // balls
  var n=N;
  for(var i=0;i<n;i++){ ctx.drawImage(sprites[i%NB],x[i]-14,y[i]-14,28,28); }
  // The only on-screen text.
  ctx.setTransform(SC,0,0,SC,0,0);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  txt('EVERY TOUCH = +1 BALL',540,130,54,'#dcb84a',1,900);
  // Subtle visual finale, without an end card or additional text.
  if(state==='end'){
    var e=endT, fl=0;
    if(e<0.1) fl=e/0.1;
    else if(e<0.3) fl=1;
    else fl=Math.max(0,1-(e-0.3)/1.5);
    fl=fl*fl*(3-2*fl);
    if(fl>0){ ctx.fillStyle='rgba(255,255,255,'+fl.toFixed(3)+')'; ctx.fillRect(0,0,1080,H); }
  }
  ctx.globalAlpha=1;
}

/* ================= main loop ================= */
function frame(ts){
  requestAnimationFrame(frame);
  var dt=(ts-lastTs)/1000; lastTs=ts; if(!(dt>0)) dt=1/60; if(dt>0.05) dt=0.05;
  if(state==='play'){
    acc+=dt; if(acc>STEP*5) acc=STEP*5;
    spawnsFrame=0;
    var guard=0;
    while(acc>=STEP && guard<5 && state==='play'){ step(STEP); acc-=STEP; guard++; }
  } else if(state==='end'){
    endT+=dt;
    if(endT>7.1){ resetSim(); state='play'; }
  }
  audioUpdate();
  render(dt);
}

function begin(){
  running=true; resetSim(); state='play';
  var st=document.getElementById('start'); st.style.display='none';
  initAudio(); if(AC&&AC.state!=='running') AC.resume();
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(function(){}); }catch(e){}
}
document.getElementById('start').addEventListener('click',begin);
document.addEventListener('visibilitychange',function(){ if(AC){ if(document.hidden) AC.suspend(); else if(running) AC.resume(); } lastTs=performance.now(); });
var rsT=0; addEventListener('resize',function(){ clearTimeout(rsT); rsT=setTimeout(function(){ layout(); },250); });

layout();
requestAnimationFrame(function(ts){lastTs=ts;frame(ts);});

/* debug hooks for tests */
window.__tr={
  info:function(){return {N:N,simT:simT,tt:tt,state:state,H:H,SC:SC,target:targetN(tt)};},
  begin:begin,
  seed:function(s){seed=s>>>0;},
  run:function(sec,draw){ drawTrailsFlag=draw!==false; var n=Math.round(sec/STEP),i=0; for(;i<n&&state==='play';i++){ if(i%2===0) spawnsFrame=0; step(STEP); } drawTrailsFlag=true; return N; },
  runTo:function(n,draw){ drawTrailsFlag=draw!==false; var i=0; while(state==='play'&&N<n&&i<200000){ if(i%2===0) spawnsFrame=0; step(STEP); i++; } drawTrailsFlag=true; return {N:N,tt:tt}; },
  maxFrameSpawn:function(){return spawnsFrame;},
  setT:function(t){ endT=t; }
};
})();
</script>
</body>
</html>
