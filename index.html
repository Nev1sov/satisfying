<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0f14">
<title>Polygon Study</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0f14;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:block}
#intro{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;color:#edf2f5;background:radial-gradient(ellipse at 50% 42%,#17242e 0%,#0a0f14 68%);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
#intro .eyebrow{font-size:13px;letter-spacing:.32em;font-weight:700;color:#8fa4b1;margin-bottom:22px}
#intro h1{font-size:clamp(31px,8vw,52px);line-height:1.08;letter-spacing:.12em;margin:0 0 18px;font-weight:750}
#intro p{max-width:310px;font-size:14px;line-height:1.7;letter-spacing:.07em;color:#9aabb5;margin:0 0 38px}
#go{appearance:none;border:1px solid #a8c1ca;background:transparent;color:#edf4f6;padding:17px 42px;border-radius:2px;font-size:14px;font-weight:700;letter-spacing:.22em}
#intro .hint{margin-top:24px;font-size:11px;letter-spacing:.08em;color:#697b86}
</style>
</head>
<body>
<div id="intro">
  <div class="eyebrow">A VISUAL GEOMETRY EXPERIMENT</div>
  <h1>POLYGON<br>STUDY</h1>
  <p>ONE BALL. ONE NEW VERTEX WITH EVERY CORNER HIT.</p>
  <button id="go">BEGIN</button>
  <div class="hint">HEADPHONES RECOMMENDED</div>
</div>
<canvas id="view"></canvas>
<script>
(()=>{
'use strict';

// ------------------------------------------------------------
// Canvas / composition
// ------------------------------------------------------------
const W=1080,H=1920,CX=540,CY=1010;
const RX=330,RY=590;
const MAX_SIDES=20;
const BALL_R=18,SPEED=585;
const BASE_ANGLE=-Math.PI/2,TAU=Math.PI*2;
const STEP=1/240;
const MORPH_RATE=5.8;
const CORNER_COOLDOWN=.72;
const START_DELAY=.75;
const canvas=document.getElementById('view');
const ctx=canvas.getContext('2d',{alpha:false});
let dpr=1,scale=1,bg=null;
const font='-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);

const FIGURE_NAMES={
  4:'RHOMBUS',5:'PENTAGON',6:'HEXAGON',7:'HEPTAGON',8:'OCTAGON',
  9:'NONAGON',10:'DECAGON',11:'HENDECAGON',12:'DODECAGON',
  13:'TRIDECAGON',14:'TETRADECAGON',15:'PENTADECAGON',16:'HEXADECAGON',
  17:'HEPTADECAGON',18:'OCTADECAGON',19:'ENNEADECAGON',20:'ICOSAGON'
};

let angles=[],targets=[],vx=[],vy=[];
let ball=null,state=null,time=0,started=false,lastFrame=0,audio=null;

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  const s=Math.min(window.innerWidth/W,window.innerHeight/H);
  const cw=Math.round(W*s),ch=Math.round(H*s);
  canvas.style.width=cw+'px'; canvas.style.height=ch+'px';
  canvas.width=Math.round(cw*dpr); canvas.height=Math.round(ch*dpr);
  scale=canvas.width/W;
  makeBackground();
  draw();
}

function makeBackground(){
  bg=document.createElement('canvas'); bg.width=canvas.width; bg.height=canvas.height;
  const g=bg.getContext('2d'); g.setTransform(scale,0,0,scale,0,0);
  g.fillStyle='#0a0f14';g.fillRect(0,0,W,H);
  // Quiet technical grid.
  g.lineWidth=1;g.strokeStyle='rgba(138,164,179,.055)';
  for(let x=0;x<=W;x+=72){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();}
  for(let y=0;y<=H;y+=72){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
  // Central reference axes.
  g.strokeStyle='rgba(142,171,186,.11)';g.lineWidth=1.5;
  g.beginPath();g.moveTo(CX,210);g.lineTo(CX,1780);g.moveTo(115,CY);g.lineTo(965,CY);g.stroke();
  // Small registration marks along the vertical axis.
  g.strokeStyle='rgba(150,176,188,.12)';g.lineWidth=2;
  for(let y=CY-600;y<=CY+600;y+=60){g.beginPath();g.moveTo(CX-9,y);g.lineTo(CX+9,y);g.stroke();}
  // Reference ellipse, deliberately faint.
  g.save();g.setLineDash([5,13]);g.strokeStyle='rgba(143,174,190,.17)';g.lineWidth=2;
  g.beginPath();g.ellipse(CX,CY,RX,RY,0,0,TAU);g.stroke();g.restore();
  // Center mark.
  g.fillStyle='rgba(166,194,205,.45)';g.beginPath();g.arc(CX,CY,3,0,TAU);g.fill();
}

function rebuildVertices(){
  const n=angles.length;
  vx.length=n;vy.length=n;
  for(let i=0;i<n;i++){
    vx[i]=CX+RX*Math.cos(angles[i]);
    vy[i]=CY+RY*Math.sin(angles[i]);
  }
}

function reset(){
  angles=[];targets=[];
  for(let i=0;i<4;i++){
    const a=BASE_ANGLE+i*TAU/4;
    angles.push(a);targets.push(a);
  }
  rebuildVertices();
  const a=.713;
  ball={x:CX-34,y:CY+45,vx:Math.cos(a)*SPEED,vy:Math.sin(a)*SPEED,bounces:0};
  state={mode:'wait',wait:START_DELAY,cooldown:0,added:0,highlight:-1,highlightTime:0,
         lastVertexTime:-10,doneAt:0,finishedAt:0,flash:0,displayScale:1};
  time=0;
  if(audio)audio.restart();
}

function addVertex(hitIndex){
  const n=angles.length;
  if(n>=MAX_SIDES||state.cooldown>0)return false;

  // Split one of the two edges meeting the touched vertex.
  // Alternating sides prevents the new vertices from accumulating on one arc.
  const gapIndex=(state.added%2===0)?hitIndex:(hitIndex-1+n)%n;
  const left=angles[gapIndex];
  const right=(gapIndex===n-1)?angles[0]+TAU:angles[gapIndex+1];
  const newAngle=(left+right)*.5;
  const insertAt=gapIndex+1;
  angles.splice(insertAt,0,newAngle);

  const nextN=n+1;
  targets.length=nextN;
  for(let i=0;i<nextN;i++)targets[i]=BASE_ANGLE+i*TAU/nextN;

  state.added++;
  state.cooldown=CORNER_COOLDOWN;
  state.highlight=insertAt;
  state.highlightTime=0;
  state.flash=.12;
  rebuildVertices();
  if(audio)audio.vertex(nextN);
  if(nextN>=MAX_SIDES){state.doneAt=time;}
  return true;
}

function cornerContact(edgeIndex,along,len){
  const zone=clamp(len*.205,25,106);
  if(along<=zone)return addVertex(edgeIndex);
  const next=(edgeIndex+1)%angles.length;
  if(len-along<=zone)return addVertex(next);
  return false;
}

function stepBall(dt){
  if(state.mode!=='play')return;
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  const n=angles.length;
  for(let i=0;i<n;i++){
    const j=(i+1)%n;
    const dx=vx[j]-vx[i],dy=vy[j]-vy[i];
    const len=Math.hypot(dx,dy);
    if(len<1e-6)continue;
    const ex=dx/len,ey=dy/len;
    let nx=-ey,ny=ex;
    if(nx*(CX-vx[i])+ny*(CY-vy[i])<0){nx=-nx;ny=-ny;}
    const dist=(ball.x-vx[i])*nx+(ball.y-vy[i])*ny;
    if(dist<BALL_R){
      const penetration=BALL_R-dist;
      ball.x+=nx*penetration;ball.y+=ny*penetration;
      const vn=ball.vx*nx+ball.vy*ny;
      if(vn<0){
        ball.vx-=2*vn*nx;ball.vy-=2*vn*ny;
        ball.bounces++;
        if(audio)audio.bounce(ball.bounces,angles.length);
        const along=(ball.x-vx[i])*ex+(ball.y-vy[i])*ey;
        if(cornerContact(i,along,len))return;
        return;
      }
    }
  }
  // Keep speed exactly constant despite floating-point drift.
  const speed=Math.hypot(ball.vx,ball.vy)||1;
  ball.vx*=SPEED/speed;ball.vy*=SPEED/speed;
}

function update(dt){
  time+=dt;
  state.cooldown=Math.max(0,state.cooldown-dt);
  state.highlightTime+=dt;
  state.flash=Math.max(0,state.flash-dt);

  // Every vertex eases toward its new equal-angular position after a split.
  const blend=1-Math.exp(-MORPH_RATE*dt);
  for(let i=0;i<angles.length;i++)angles[i]+=(targets[i]-angles[i])*blend;
  rebuildVertices();

  if(state.mode==='wait'){
    state.wait-=dt;
    if(state.wait<=0)state.mode='play';
  }else if(state.mode==='play'){
    let remaining=dt,steps=0;
    while(remaining>1e-8&&steps<16){
      const h=Math.min(STEP,remaining);
      state.cooldown=Math.max(0,state.cooldown-h);
      stepBall(h);
      remaining-=h;steps++;
      if(state.doneAt&&time-state.doneAt>1.4){state.mode='finished';state.finishedAt=time;break;}
    }
  }
}

// ------------------------------------------------------------
// Sound: a restrained ambient bed, soft impacts and a bell on each new vertex.
// ------------------------------------------------------------
function createAudio(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return null;
  const ac=new AC();
  const master=ac.createGain();master.gain.value=.55;
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-18;comp.knee.value=16;comp.ratio.value=3.5;comp.attack.value=.008;comp.release.value=.25;
  master.connect(comp);comp.connect(ac.destination);
  const reverb=ac.createConvolver();
  const len=Math.floor(ac.sampleRate*.9),imp=ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){
    const data=imp.getChannelData(c);
    for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)*.32;
  }
  reverb.buffer=imp;const wet=ac.createGain();wet.gain.value=.24;reverb.connect(wet);wet.connect(master);
  const dry=ac.createGain();dry.gain.value=.9;dry.connect(master);
  const music=ac.createGain();music.gain.value=.2;music.connect(dry);music.connect(reverb);
  const sfx=ac.createGain();sfx.gain.value=.75;sfx.connect(dry);sfx.connect(reverb);
  function tone(t,f,dur,type,vol,dest,attack=.006,decay=dur){
    const osc=ac.createOscillator(),gain=ac.createGain();
    osc.type=type;osc.frequency.setValueAtTime(f,t);
    gain.gain.setValueAtTime(.0001,t);gain.gain.linearRampToValueAtTime(vol,t+attack);
    gain.gain.exponentialRampToValueAtTime(.0001,t+Math.max(attack+.01,decay));
    osc.connect(gain);gain.connect(dest||sfx);osc.start(t);osc.stop(t+dur+.03);
  }
  const midi=m=>440*Math.pow(2,(m-69)/12);
  // Slow, low-volume harmonic bed.
  const pad=[48,55,60,64];
  const padOsc=[];
  pad.forEach((m,i)=>{
    const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();
    o.type=i===1?'triangle':'sine';o.frequency.value=midi(m);
    f.type='lowpass';f.frequency.value=720;
    g.gain.value=i===0?.018:.009;
    o.connect(f);f.connect(g);g.connect(music);o.start();padOsc.push(o);
  });
  let step=0,next=ac.currentTime+.2,level=0,target=0;
  const melody=[72,76,79,76,74,79,84,79,72,76,81,76,74,79,83,79];
  const scheduler=setInterval(()=>{
    if(ac.state!=='running')return;
    const now=ac.currentTime;
    while(next<now+.22){
      const m=melody[step%melody.length];
      if(level>.04)tone(next,midi(m),.52,'sine',.008+.018*level,music,.01,.5);
      if(step%4===0)tone(next,midi([48,43,45,40][Math.floor(step/4)%4]),1.6,'sine',.022,music,.08,1.55);
      next+=.42;step++;
    }
    level+=(target-level)*.07;
  },60);
  function bell(t,f,vol=.09){
    tone(t,f,1.05,'sine',vol,sfx,.002,.95);
    tone(t,f*2.756,.48,'sine',vol*.24,sfx,.002,.43);
    tone(t,f*5.4,.28,'sine',vol*.10,sfx,.002,.25);
  }
  return{
    bounce(count,n){
      const t=ac.currentTime,notes=[587.33,659.25,739.99,880,987.77];
      const f=notes[(count+n)%notes.length];
      tone(t,f,.085,'triangle',.035,sfx,.002,.075);
    },
    vertex(n){
      const t=ac.currentTime;
      const f=midi(67+((n-4)%8)+12);
      bell(t,f,.105);
      tone(t,420+n*18,.18,'sine',.045,sfx,.003,.16);
      target=clamp((n-4)/(MAX_SIDES-4),0,1);
    },
    finale(){
      const t=ac.currentTime;
      [60,64,67,72,76,79].forEach((m,i)=>bell(t+i*.075,midi(m),.075));
      tone(t,110,2.2,'sine',.11,sfx,.02,2.1);
    },
    restart(){step=0;next=ac.currentTime+.2;level=0;target=0;},
    resume(){if(ac.state!=='running')ac.resume();},
    dispose(){clearInterval(scheduler);ac.close();}
  };
}

// ------------------------------------------------------------
// Drawing
// ------------------------------------------------------------
function text(str,x,y,size,color,weight=600,spacing='0px'){
  ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`${weight} ${size}px ${font}`;
  ctx.fillText(str,x,y);
}

function drawShape(){
  const n=angles.length;
  ctx.beginPath();
  for(let i=0;i<n;i++)i?ctx.lineTo(vx[i],vy[i]):ctx.moveTo(vx[i],vy[i]);
  ctx.closePath();
  ctx.fillStyle='rgba(24,39,49,.21)';ctx.fill();
  ctx.lineJoin='round';ctx.lineCap='round';
  ctx.strokeStyle='rgba(124,157,173,.14)';ctx.lineWidth=12;ctx.stroke();
  ctx.strokeStyle='#b9c9d1';ctx.lineWidth=3.2;ctx.stroke();

  // Small, consistent vertex markers; only the newest one is accented.
  for(let i=0;i<n;i++){
    const newest=i===state.highlight&&state.highlightTime<1.05;
    ctx.fillStyle=newest?'#b7e5e9':'#91a6b2';
    ctx.beginPath();ctx.arc(vx[i],vy[i],newest?6.5:4.2,0,TAU);ctx.fill();
    if(newest){
      const p=clamp(state.highlightTime/1.05,0,1);
      ctx.strokeStyle=`rgba(164,225,231,${(1-p)*.7})`;
      ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(vx[i],vy[i],11+24*easeOut(p),0,TAU);ctx.stroke();
    }
  }
}

function drawBall(){
  // One clean sphere, with no trail and no glow.
  const grad=ctx.createRadialGradient(ball.x-BALL_R*.34,ball.y-BALL_R*.38,1,ball.x,ball.y,BALL_R);
  grad.addColorStop(0,'#ffffff');grad.addColorStop(.56,'#e7edf0');grad.addColorStop(1,'#9aaab2');
  ctx.fillStyle=grad;ctx.beginPath();ctx.arc(ball.x,ball.y,BALL_R,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=1.2;ctx.stroke();
}

function drawHud(){
  const n=angles.length,name=FIGURE_NAMES[n]||'POLYGON';
  text('GEOMETRY STUDY',CX,116,25,'#78909c',700);
  text(`FIGURE ${String(n-3).padStart(2,'0')} / ${MAX_SIDES-3}`,CX,166,21,'#607782',600);
  ctx.font=`700 66px ${font}`;
  const width=ctx.measureText(name).width;
  const size=Math.min(66,780/(width||1)*66);
  text(name,CX,252,size,'#edf3f5',750);
  text(`${n} SIDES  ·  ${n} VERTICES`,CX,310,27,'#9aadb6',600);

  // Minimal progress rail: one mark for each figure in the sequence.
  const x0=270,x1=810,y=1732,total=MAX_SIDES-4;
  ctx.strokeStyle='rgba(133,160,173,.25)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();
  for(let i=0;i<=total;i++){
    const x=lerp(x0,x1,i/total);
    ctx.fillStyle=i<=n-4?'#a9d5dc':'#43545e';
    ctx.beginPath();ctx.arc(x,y,i===n-4?6:3.5,0,TAU);ctx.fill();
  }
  text('ONE BALL  ·  ONE NEW VERTEX PER HIT',CX,1792,22,'#738792',600);

  if(state.doneAt){
    const fade=easeOut((time-state.doneAt-1.1)/.5);
    if(fade>0){
      ctx.fillStyle=`rgba(7,12,16,${.90*fade})`;ctx.fillRect(0,0,W,H);
      ctx.save();ctx.globalAlpha=fade;
      text('SERIES COMPLETE',CX,692,28,'#91a9b4',700);
      text('ICOSAGON',CX,824,88,'#edf4f5',750);
      text('20 SIDES  ·  20 VERTICES',CX,900,31,'#a8bac2',600);
      text('ONE BALL  ·  16 NEW VERTICES',CX,1010,25,'#8298a3',600);
      text('TAP TO RESTART',CX,1235,24,'#a9d5dc',700);
      ctx.restore();
    }
  }
}

function draw(){
  if(!bg)return;
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(bg,0,0);
  ctx.setTransform(scale,0,0,scale,0,0);
  drawShape();
  drawBall();
  drawHud();
}

function frame(now){
  requestAnimationFrame(frame);
  if(!started){lastFrame=now;return;}
  const dt=Math.min(.05,Math.max(0,(now-lastFrame)/1000));lastFrame=now;
  update(dt);draw();
}

// ------------------------------------------------------------
// Start / restart
// ------------------------------------------------------------
// Initialize simulation state before the first render. The renderer reads
// state and ball, so calling resize() first would abort the script here.
reset();
resize();
draw();
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,180));
requestAnimationFrame(frame);

document.getElementById('go').addEventListener('click',()=>{
  try{audio=createAudio();if(audio)audio.resume();}catch(e){audio=null;}
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}
  try{const root=document.documentElement;(root.requestFullscreen||root.webkitRequestFullscreen||function(){}).call(root);}catch(e){}
  document.getElementById('intro').style.display='none';
  reset();started=true;lastFrame=performance.now();
});

window.addEventListener('pointerdown',()=>{
  if(started&&state&&state.mode==='finished'){
    reset();if(audio)audio.restart();lastFrame=performance.now();
  }
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&audio)audio.resume();});

// Small test hook for deterministic checks in a browser console.
window.__polygonStudy={
  simulate(seconds){
    reset();started=true;
    const end=seconds||60,dt=1/60;let elapsed=0;
    while(elapsed<end&&state.mode!=='finished'){
      update(dt);elapsed+=dt;
    }
    return{vertices:angles.length,ballCount:ball?1:0,mode:state.mode,bounces:ball.bounces,added:state.added};
  },
  snapshot(){return{vertices:angles.length,ballCount:ball?1:0,mode:state.mode};}
};
})();
</script>
</body>
</html>
