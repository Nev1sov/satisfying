<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>100M Drop Test</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;font-family:"Avenir Next","Helvetica Neue",Inter,system-ui,Arial,sans-serif}
#wrap{position:fixed;inset:0;display:grid;place-items:center}
canvas{display:block;background:#000}
#start{position:fixed;inset:0;z-index:10;background:rgba(3,5,16,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;color:#fff;transition:opacity .35s}
#start.hide{opacity:0;pointer-events:none}
#start h1{font-size:clamp(30px,8vw,54px);font-weight:900;letter-spacing:.02em;line-height:1.05}
#start h1 span{color:#35c8ff}
#start p{font-size:15px;color:#9aa4c8;max-width:340px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:360px}
.chip{padding:10px 16px;border-radius:999px;border:1.5px solid #34406b;background:#10162d;color:#c9d2ff;font-weight:800;font-size:14px;letter-spacing:.06em;cursor:pointer}
.chip.on{background:#35c8ff;border-color:#35c8ff;color:#04101f}
#go{margin-top:6px;padding:18px 44px;font-size:22px;font-weight:900;letter-spacing:.1em;color:#04101f;background:#35c8ff;border:none;border-radius:16px;cursor:pointer;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.lbl{font-size:12px;letter-spacing:.2em;color:#6f7aa5;font-weight:800}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="start">
  <h1>100M <span>DROP TEST</span></h1>
  <p>Same ball. Same 100 m drop. Three planets. How many times will it bounce?</p>
  <div class="lbl">PLANET</div>
  <div class="chips" id="chips"></div>
  <button id="go">TAP TO START</button>
  <p style="font-size:12px">Start screen recording first, then tap START.<br>Turn the silent switch off for sound.</p>
</div>
<script>
(() => {
'use strict';
/* =====================================================================
   SETTINGS  –  change anything here
   ===================================================================== */
const DROP_HEIGHT   = 100;     // metres
const BALL_MASS     = 3;       // kg (used for the ENERGY counter)
const E_MIN = 0.70, E_MAX = 0.80;  // bounciness is random in this range every take (so every video differs)
const STOP_BELOW    = 1;       // m: when the next bounce would be lower than this, the ball stops
const INTRO_TIME    = 3.4;     // s: hook + 3-2-1 countdown before the drop
const END_HOLD      = 5.5;     // s: result card stays on screen, then the next planet starts
const SLOWMO_HITS   = 3;       // slow motion on the first N impacts
const SLOWMO_TIME   = 0.5;     // s of slow motion
const SLOWMO_SCALE  = 0.25;    // game speed during slow motion
const SQUASH_TIME   = 0.1;     // s the ball stays squashed (game time)
// texts (all English)
const TXT = {
  TITLE:'100M DROP TEST! 😱', HOOK1:'HOW MANY BOUNCES', HOOK2:'WILL IT MAKE?', HOOK3:'GUESS BEFORE IT LANDS 👇',
  ASK:'HOW MANY BOUNCES? GUESS 👇', END1:'BOUNCES ENDED!', END2:'TOTAL BOUNCES:', END3:'DID YOU GUESS RIGHT? 😏', CTA:'SUBSCRIBE FOR MORE!'
};
// g = gravity, air = how loud the wind whistle is (Moon has no air!), speed = video playback speed (low gravity is slow, so we speed it up)
const PLANETS = [
  { name:'EARTH', emoji:'🌍', g:9.8,  air:1.0,  speed:1.0, acc:'#35c8ff', bg:['#040a22','#0b2250'], ground:'#0a2a58', hue:200, sat:100, root:110.0, shift:0,  stars:0 },
  { name:'MOON',  emoji:'🌕', g:1.62, air:0.0,  speed:2.2, acc:'#cfd6ff', bg:['#03030a','#16161f'], ground:'#34343f', hue:235, sat:45,  root:82.4,  shift:-3, stars:70 },
  { name:'MARS',  emoji:'🔴', g:3.71, air:0.35, speed:1.5, acc:'#ff7a3c', bg:['#160604','#4c1b0d'], ground:'#52230f', hue:18,  sat:100, root:73.4,  shift:2,  stars:36 },
];
/* ===================================================================== */

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const TAU = Math.PI * 2, W = 1080, H = 1920;
const FF = '"Avenir Next","Helvetica Neue",Inter,"Segoe UI",Arial,sans-serif';
// layout of the 1080x1920 stage
const GY = 1420, PT = 640, PLAY_H = GY - PT, SX = 124, BX = 612, BR = 34;

let settings = { mode: 'auto' };
try { Object.assign(settings, JSON.parse(localStorage.getItem('dropTest100') || '{}')); } catch (e) {}
const saveSettings = () => { try { localStorage.setItem('dropTest100', JSON.stringify(settings)); } catch (e) {} };
const MODES = ['auto', 0, 1, 2];
function buildChips() {
  $('chips').innerHTML = '';
  MODES.forEach(m => { const b = document.createElement('button'); b.className = 'chip' + (settings.mode === m ? ' on' : ''); b.textContent = m === 'auto' ? 'AUTO: EARTH → MOON → MARS' : PLANETS[m].emoji + ' ' + PLANETS[m].name; b.onclick = () => { settings.mode = m; saveSettings(); buildChips(); }; $('chips').appendChild(b); });
}
buildChips();

/* ---------- canvas ---------- */
const cv = $('cv'), ctx = cv.getContext('2d'); let K = 1, bgCache = null, bgFor = -1;
function layout() {
  const vw = window.visualViewport ? visualViewport.width : innerWidth, vh = window.visualViewport ? visualViewport.height : innerHeight;
  const s = Math.min(vw / W, vh / H), dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr); K = cv.width / W; bgFor = -1;
}
let rz = null; const onResize = () => { clearTimeout(rz); rz = setTimeout(layout, 100); };
addEventListener('resize', onResize); addEventListener('orientationchange', onResize); if (window.visualViewport) visualViewport.addEventListener('resize', onResize);

/* ---------- sprites / background ---------- */
const ballSprites = {};
function ballSprite(P) {
  if (ballSprites[P.name]) return ballSprites[P.name];
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), h = P.hue, s = P.sat;
  const gl = g.createRadialGradient(128, 128, 60, 128, 128, 128); gl.addColorStop(0, `hsla(${h},${s}%,60%,.42)`); gl.addColorStop(1, `hsla(${h},${s}%,60%,0)`); g.fillStyle = gl; g.fillRect(0, 0, 256, 256);
  const b = g.createRadialGradient(100, 96, 8, 128, 128, 66); b.addColorStop(0, `hsl(${h},${Math.min(s, 60)}%,92%)`); b.addColorStop(.45, `hsl(${h},${s}%,58%)`); b.addColorStop(1, `hsl(${h},${s}%,34%)`);
  g.fillStyle = b; g.beginPath(); g.arc(128, 128, 64, 0, TAU); g.fill(); g.lineWidth = 3; g.strokeStyle = `hsla(${h},${s}%,88%,.7)`; g.stroke();
  return ballSprites[P.name] = c;
}
function buildBG(P, idx) {
  const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; const g = c.getContext('2d'); g.setTransform(K, 0, 0, K, 0, 0);
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, P.bg[0]); gr.addColorStop(1, P.bg[1]); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.fillStyle = '#fff'; let sd = 7 + idx * 31; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < P.stars; i++) { g.globalAlpha = 0.15 + rnd() * 0.5; const s = 1 + rnd() * 2.4; g.fillRect(rnd() * W, rnd() * GY, s, s); }
  g.globalAlpha = 1; g.strokeStyle = 'rgba(255,255,255,.055)'; g.lineWidth = 1.5; g.beginPath();
  for (let x = 0; x <= W; x += 90) { g.moveTo(x, 0); g.lineTo(x, H); } for (let y = 0; y <= H; y += 90) { g.moveTo(0, y); g.lineTo(W, y); } g.stroke();
  bgCache = c; bgFor = idx;
}

/* ---------- audio ---------- */
let ac = null, master, revSend, noiseBuf, wOsc, wOsc2, wGain, nGain, nFilt, padG = null, padOsc = [];
function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext; ac = new AC({ latencyHint: 'interactive' });
  try { navigator.audioSession.type = 'playback'; } catch (e) {}
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 5; comp.attack.value = 0.003; comp.release.value = 0.18;
  master = ac.createGain(); master.gain.value = 0.9; master.connect(comp); comp.connect(ac.destination);
  const len = (ac.sampleRate * 1.5) | 0, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.8); }
  const rev = ac.createConvolver(); rev.buffer = ir; revSend = ac.createGain(); revSend.gain.value = 0.2; revSend.connect(rev); rev.connect(master);
  noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); { const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  // continuous wind whistle (pitch + volume follow the speed)
  wOsc = ac.createOscillator(); wOsc.type = 'sine'; wOsc2 = ac.createOscillator(); wOsc2.type = 'triangle'; wGain = ac.createGain(); wGain.gain.value = 0.0001; const w2 = ac.createGain(); w2.gain.value = 0.35;
  wOsc.connect(wGain); wOsc2.connect(w2); w2.connect(wGain); wGain.connect(master); wOsc.start(); wOsc2.start();
  const ns = ac.createBufferSource(); ns.buffer = noiseBuf; ns.loop = true; nFilt = ac.createBiquadFilter(); nFilt.type = 'bandpass'; nFilt.Q.value = 1.6; nGain = ac.createGain(); nGain.gain.value = 0.0001; ns.connect(nFilt); nFilt.connect(nGain); nGain.connect(master); ns.start();
  const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource(); s.buffer = b; s.connect(ac.destination); s.start(0); if (ac.state === 'suspended') ac.resume();
}
const midi = m => 440 * Math.pow(2, (m - 69) / 12);
const PENTA = [57, 60, 62, 64, 67, 69, 72, 74, 76, 79, 81, 84, 86, 88, 91, 93];
function noiseSrc(t, len) { const s = ac.createBufferSource(); s.buffer = noiseBuf; s.start(t, Math.random() * 0.8); s.stop(t + len + 0.05); return s; }
function bell(f, t, vol) {
  [1, 2.01, 3.5].forEach((m, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = i ? 'sine' : 'triangle'; o.frequency.value = f * m; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol / (1 + i * 1.6), t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.95 / (1 + i * 0.5)); o.connect(g); g.connect(master); g.connect(revSend); o.start(t); o.stop(t + 1.05); });
}
function boom(f, P) {
  const t = ac.currentTime + 0.004, v = 0.3 + 0.7 * f;
  const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(175, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.32); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.95 * v, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42); o.connect(g); g.connect(master); g.connect(revSend); o.start(t); o.stop(t + 0.5);
  const s = noiseSrc(t, 0.25), lp = ac.createBiquadFilter(), ng = ac.createGain(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(1400, t); lp.frequency.exponentialRampToValueAtTime(120, t + 0.22); ng.gain.setValueAtTime(0.0001, t); ng.gain.exponentialRampToValueAtTime(0.7 * v, t + 0.004); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.24); s.connect(lp); lp.connect(ng); ng.connect(master);
  const c = noiseSrc(t, 0.05), hp = ac.createBiquadFilter(), cg = ac.createGain(); hp.type = 'highpass'; hp.frequency.value = 3000; cg.gain.setValueAtTime(0.0001, t); cg.gain.exponentialRampToValueAtTime(0.25 * f, t + 0.002); cg.gain.exponentialRampToValueAtTime(0.0001, t + 0.045); c.connect(hp); hp.connect(cg); cg.connect(master);
}
function whoosh(t, len, f0, f1, vol, rising) {
  const s = noiseSrc(t, len), bp = ac.createBiquadFilter(), g = ac.createGain(); bp.type = 'bandpass'; bp.Q.value = 1.2; bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t + len);
  g.gain.setValueAtTime(0.0001, t); if (rising) { g.gain.exponentialRampToValueAtTime(vol, t + len * 0.95); g.gain.linearRampToValueAtTime(0.0001, t + len + 0.03); } else { g.gain.exponentialRampToValueAtTime(vol, t + len * 0.2); g.gain.exponentialRampToValueAtTime(0.0001, t + len); }
  s.connect(bp); bp.connect(g); g.connect(master);
}
function blip(f, vol) { const t = ac.currentTime + 0.003, o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22); o.connect(g); g.connect(master); g.connect(revSend); o.start(t); o.stop(t + 0.3); }
function padStart(P) {
  padStop(0.05); padG = ac.createGain(); padG.gain.value = 0.0001; const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520; lp.connect(padG); padG.connect(master); const t = ac.currentTime;
  [1, 1.5, 2.003].forEach((m, i) => { const o = ac.createOscillator(); o.type = i === 1 ? 'triangle' : 'sawtooth'; o.frequency.value = P.root * m; const g = ac.createGain(); g.gain.value = i === 1 ? 0.6 : 0.4; o.connect(g); g.connect(lp); o.start(t); padOsc.push(o); });
  padG.gain.setValueAtTime(0.0001, t); padG.gain.linearRampToValueAtTime(0.05, t + 2.5);
}
function padStop(len) { if (!padG) return; const t = ac.currentTime, g = padG, os = padOsc; g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(Math.max(0.0001, g.gain.value), t); g.gain.linearRampToValueAtTime(0.0001, t + len); os.forEach(o => { try { o.stop(t + len + 0.05); } catch (e) {} }); padG = null; padOsc = []; }
function wind(frac, air, ts) {
  if (!ac) return; const t = ac.currentTime, f = (280 + frac * 2300) * (0.7 + 0.3 * ts), v = air * Math.pow(clamp(frac, 0, 1.3), 1.6);
  wOsc.frequency.setTargetAtTime(f, t, 0.04); wOsc2.frequency.setTargetAtTime(f * 2.01, t, 0.04); wGain.gain.setTargetAtTime(Math.max(0.0001, v * 0.11), t, 0.05);
  nFilt.frequency.setTargetAtTime(f * 1.3, t, 0.04); nGain.gain.setTargetAtTime(Math.max(0.0001, v * 0.14), t, 0.05);
}
function sting(P) {
  const t = ac.currentTime + 0.02, sh = P.shift; boom(0.6, P);
  [0, 3, 7].forEach((o, i) => bell(midi(69 + sh + o - 0), t + 0.05 + i * 0.012, 0.22));
  [0, 2, 4, 5, 7, 9, 11].forEach((o, i) => bell(midi(PENTA[Math.min(PENTA.length - 1, 5 + i)] + sh + 12), t + 0.3 + i * 0.075, 0.12));
}

/* ---------- run state ---------- */
let R = null, cycle = 0, last = 0, stars = [], doneLog = [];
const streaks = Array.from({ length: 26 }, () => ({ x: Math.random() * W, y: Math.random() * H, l: 60 + Math.random() * 160, w: 2 + Math.random() * 3 }));
function pickPlanet() { return settings.mode === 'auto' ? cycle % PLANETS.length : settings.mode; }
function startRun() {
  const idx = pickPlanet(), P = PLANETS[idx]; cycle++;
  R = { idx, P, g: P.g, e: E_MIN + Math.random() * (E_MAX - E_MIN), h: DROP_HEIGHT, v: 0, t: 0, phase: 'intro', pt: 0, clock: 0, bounces: 0, hits: 0, vFirst: Math.sqrt(2 * P.g * DROP_HEIGHT),
    view: DROP_HEIGHT * 1.1, viewT: DROP_HEIGHT * 1.1, lv: Math.log(DROP_HEIGHT * 1.1), ts: 1, slowLeft: 0, sqT: 9, sqAmp: 0, rest: false, restT: 0, endT: 0, shake: 0, flash: 0,
    trail: [], trailAcc: 0, parts: [], rings: [], floats: [], toast: null, toasts: {}, cd: 4, realT: 0, startedAt: performance.now(), vMaxShown: 0, firstSpeed: 0 };
  if (bgFor !== idx) buildBG(P, idx);
  if (ac) { const t = ac.currentTime + 0.05; whoosh(t, INTRO_TIME - 0.1, 250, 4200, 0.16, true); wind(0, 0, 1); }
}
function dropNow() {
  R.phase = 'run'; R.pt = 0; if (!ac) return; const t = ac.currentTime + 0.01; whoosh(t, 0.55, 3500, 400, 0.22, false); boom(0.25, R.P); padStart(R.P);
}
function impact() {
  const P = R.P, vi = -R.v, f = clamp(vi / R.vFirst, 0.05, 1.2); R.h = 0; R.hits++;
  const vr = vi * R.e, apex = vr * vr / (2 * R.g), kmh = Math.round(vi * 3.6);
  if (R.hits === 1) R.firstSpeed = kmh;
  const stop = apex < STOP_BELOW;
  if (stop) { R.v = 0; R.rest = true; R.restT = 0; } else { R.v = vr; R.bounces++; R.viewT = Math.max(3.2, apex * 1.15); }
  R.sqT = 0; R.sqAmp = clamp(0.22 + 0.5 * f, 0.2, 0.62);
  if (R.hits <= SLOWMO_HITS) R.slowLeft = SLOWMO_TIME;
  R.shake = Math.max(R.shake, 0.25 + 0.9 * f); R.flash = R.hits <= SLOWMO_HITS ? 0.12 + 0.4 * f : 0.05 + 0.18 * f;
  const n = Math.round(10 + 40 * f);
  for (let i = 0; i < n && R.parts.length < 200; i++) { const a = -Math.PI * (0.04 + 0.92 * Math.random()), sp = (220 + Math.random() * 700) * (0.4 + f); R.parts.push({ x: BX + (Math.random() - 0.5) * 30, y: GY - 4, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, age: 0, life: 0.5 + Math.random() * 0.7, s: 3 + Math.random() * 4, c: Math.random() < 0.35 ? '#fff' : P.acc, dust: false }); }
  if (P.air < 1) for (let i = 0; i < 9 && R.parts.length < 200; i++) { const dir = Math.random() < 0.5 ? -1 : 1; R.parts.push({ x: BX + dir * 20, y: GY - 6, vx: dir * (120 + Math.random() * 360) * (0.4 + f), vy: -30 - Math.random() * 120, age: 0, life: 0.9 + Math.random() * 0.6, s: 16 + Math.random() * 22, c: P.name === 'MARS' ? '#c86a3a' : '#a9a9b8', dust: true }); }
  R.rings.push({ age: 0, life: 0.55, mx: 120 + 900 * f }); if (f > 0.5) R.rings.push({ age: -0.08, life: 0.6, mx: 80 + 600 * f });
  R.floats.push({ age: 0, a: R.hits === 1 ? 'IMPACT!' : stop ? 'AND IT STOPS…' : 'BOUNCE #' + R.bounces, b: R.hits === 1 ? kmh + ' km/h' : stop ? '' : '↑ ' + (apex >= 10 ? Math.round(apex) : apex.toFixed(1)) + ' m' });
  if (R.hits === 1) R.toast = { age: 0, text: 'BOOM! 💥' };
  else if (R.bounces === 5 && !R.toasts.five) { R.toasts.five = 1; R.toast = { age: 0, text: 'STILL GOING… 👀' }; }
  else if (!stop && apex < 3 && !R.toasts.last) { R.toasts.last = 1; R.toast = { age: 0, text: 'LAST BOUNCES… 😳' }; }
  if (ac) {
    boom(f, P); const idx = Math.min(PENTA.length - 1, R.hits - 1); bell(midi(PENTA[idx] + P.shift), ac.currentTime + 0.012, 0.2 + 0.1 * f);
    if (R.bounces >= 3 || stop) bell(midi(PENTA[idx] + P.shift + 12), ac.currentTime + 0.1, 0.1);
  }
}
function endPhase() {
  R.phase = 'end'; R.endT = 0; R.realT = (performance.now() - R.startedAt) / 1000; doneLog.push({ planet: R.P.name, bounces: R.bounces, e: +R.e.toFixed(3), real: +R.realT.toFixed(1), simT: +R.t.toFixed(1) });
  if (ac) { padStop(1.8); wind(0, 0, 1); sting(R.P); }
}

/* ---------- update ---------- */
function update(dt) {
  R.clock += dt; const P = R.P;
  R.lv += (Math.log(R.viewT) - R.lv) * (1 - Math.exp(-dt * 2.6)); R.view = Math.exp(R.lv);
  R.shake *= Math.pow(0.012, dt); R.flash *= Math.pow(0.002, dt);
  for (let i = R.parts.length - 1; i >= 0; i--) { const p = R.parts[i]; p.age += dt; if (p.age >= p.life) { R.parts.splice(i, 1); continue; } p.vx *= Math.pow(p.dust ? 0.2 : 0.35, dt); p.vy = p.vy * Math.pow(p.dust ? 0.2 : 0.5, dt) + (p.dust ? 0 : 1700) * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  for (let i = R.rings.length - 1; i >= 0; i--) { const r = R.rings[i]; r.age += dt; if (r.age >= r.life) R.rings.splice(i, 1); }
  for (let i = R.floats.length - 1; i >= 0; i--) { const f = R.floats[i]; f.age += dt; if (f.age > 1.2) R.floats.splice(i, 1); }
  if (R.toast) { R.toast.age += dt; if (R.toast.age > 1.4) R.toast = null; }
  if (R.phase === 'intro') {
    R.pt += dt; const n = Math.ceil(INTRO_TIME - 0.25 - R.pt + 0.0001); const c = clamp(n, 0, 3);

  R.slowLeft -= dt; const tsT = R.slowLeft > 0 ? SLOWMO_SCALE : 1; R.ts += (tsT - R.ts) * Math.min(1, dt * 14);
  if (!R.rest) {

  } else { R.restT += dt; R.sqT += dt * 0.6; R.trail.length = 0; if (R.restT > 0.95) endPhase(); }
}

/* ---------- drawing ---------- */
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function txt(s, x, y, size, color, o) {

  if (o.stroke) { ctx.lineWidth = o.stroke; ctx.strokeStyle = o.strokeColor || '#000'; ctx.strokeText(s, x, y); }

}
function niceStep(view) { for (const s of [0.5, 1, 2, 5, 10, 20, 25, 50]) if (view / s <= 8.5) return s; return 50; }
function draw() {
  const P = R.P, ppm = PLAY_H / R.view, acc = P.acc;
  ctx.setTransform(K, 0, 0, K, 0, 0); ctx.globalAlpha = 1;
  if (bgFor !== R.idx) buildBG(P, R.idx);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bgCache, 0, 0); ctx.setTransform(K, 0, 0, K, 0, 0);
  // ---------- world (shakes) ----------
  ctx.save(); if (R.shake > 0.02) ctx.translate((Math.random() - 0.5) * 30 * R.shake, (Math.random() - 0.5) * 30 * R.shake);
  // speed streaks

  if (R.phase === 'run' && !R.rest && big > 500) {
    const a = clamp((big - 500) / 1800, 0, 0.55); ctx.strokeStyle = acc; ctx.lineCap = 'round';
    for (const s of streaks) { s.y += spx * 0.016 * 1.2; if (s.y < PT - 100) s.y += PLAY_H + 200; if (s.y > GY + 100) s.y -= PLAY_H + 200; ctx.globalAlpha = a * (0.4 + (s.w - 2) / 5); ctx.lineWidth = s.w; const l = s.l * clamp(big / 2500, 0.3, 1.5); ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x, s.y + (spx > 0 ? -l : l)); ctx.stroke(); }

  }

  ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(SX, GY); ctx.lineTo(SX, PT - 10); ctx.stroke();
  for (let m = 0; m <= R.view + 0.001; m += step) {
    const y = GY - m * ppm; if (y < PT - 12) break;
    ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(SX, y); ctx.lineTo(W - 30, y); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(SX - 14, y); ctx.lineTo(SX + 14, y); ctx.stroke();
    txt((step < 1 ? m.toFixed(1) : Math.round(m)) + 'm', SX - 22, y, 30, 'rgba(255,255,255,.85)', { align: 'right', weight: 800 });
  }
  // ground
  const gg = ctx.createLinearGradient(0, GY, 0, H); gg.addColorStop(0, P.ground); gg.addColorStop(1, '#000'); ctx.fillStyle = gg; ctx.fillRect(-40, GY, W + 80, H - GY + 40);
  ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 2; ctx.beginPath(); for (let i = 1; i < 6; i++) { const y = GY + i * i * 8 + 10; ctx.moveTo(-40, y); ctx.lineTo(W + 40, y); } ctx.stroke();
  ctx.strokeStyle = acc; ctx.globalAlpha = 0.18; ctx.lineWidth = 22; ctx.beginPath(); ctx.moveTo(-40, GY + 2); ctx.lineTo(W + 40, GY + 2); ctx.stroke(); ctx.globalAlpha = 1; ctx.lineWidth = 6; ctx.stroke();
  // shock rings
  for (const r of R.rings) { if (r.age < 0) continue; const k = r.age / r.life, rx = 30 + k * r.mx; ctx.globalAlpha = (1 - k) * 0.8; ctx.strokeStyle = '#fff'; ctx.lineWidth = 6 * (1 - k) + 1; ctx.beginPath(); ctx.ellipse(BX, GY, rx, rx * 0.12, 0, 0, TAU); ctx.stroke(); } ctx.globalAlpha = 1;
  // trail

  for (let i = 0; i < R.trail.length; i++) { const k = (i + 1) / (R.trail.length + 1), y = GY - R.trail[i] * ppm - BR; ctx.globalAlpha = 0.28 * k; const sc = 0.55 + 0.4 * k; ctx.drawImage(spr, BX - S * sc / 2, y - S * sc / 2, S * sc, S * sc); } ctx.globalAlpha = 1;
  // ball

  const by = GY - hh * ppm; let sx = 1, sy = 1;
  const u = R.sqT / SQUASH_TIME; if (u < 1) { const sh = u < 0.3 ? u / 0.3 : Math.pow(Math.max(0, (1 - u) / 0.7), 1.5); sy = 1 - R.sqAmp * sh; sx = 1 + R.sqAmp * 0.95 * sh; }
  else if (R.phase === 'run' && !R.rest && big > 800) { const st = Math.min(0.22, (big - 800) / 12000); sy = 1 + st; sx = 1 / sy; }
  ctx.save(); ctx.translate(BX, by); ctx.scale(sx, sy); ctx.drawImage(spr, -S / 2, -BR - S / 2, S, S); ctx.restore();
  // marker on the scale
  const my = by - BR; ctx.fillStyle = acc; ctx.beginPath(); ctx.moveTo(SX + 8, my); ctx.lineTo(SX + 36, my - 14); ctx.lineTo(SX + 36, my + 14); ctx.closePath(); ctx.fill();
  // particles
  for (const p of R.parts) { const k = 1 - p.age / p.life; ctx.globalAlpha = p.dust ? k * 0.35 : Math.min(1, k * 1.6); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.s * (p.dust ? 1.4 - 0.4 * k : 0.5 + 0.5 * k), 0, TAU); ctx.fill(); } ctx.globalAlpha = 1;
  // impact floaters
  for (const f of R.floats) { const k = f.age / 1.2, sc = f.age < 0.12 ? 0.6 + 3.3 * f.age : 1; ctx.save(); ctx.translate(BX + 195, GY - 110 - k * 150); ctx.scale(sc, sc); ctx.globalAlpha = k < 0.65 ? 1 : (1 - k) / 0.35;
    txt(f.a, 0, 0, 62, '#fff', { stroke: 12 }); if (f.b) txt(f.b, 0, 62, 44, acc, { stroke: 10 }); ctx.restore(); } ctx.globalAlpha = 1;
  ctx.restore();
  // ---------- HUD (does not shake) ----------
  txt(TXT.TITLE, W / 2, 112, 80, '#fff', { stroke: 14, strokeColor: 'rgba(0,0,0,.65)' });
  // planet tabs
  const pw = 300, gap = 22, x0 = (W - (pw * 3 + gap * 2)) / 2, pulse = 0.5 + 0.5 * Math.sin(R.clock * 5);
  PLANETS.forEach((p, i) => {
    const x = x0 + i * (pw + gap), on = i === R.idx; ctx.save();
    if (on) { ctx.shadowColor = p.acc; ctx.shadowBlur = 26 + 18 * pulse; ctx.fillStyle = p.acc; rr(ctx, x, 176, pw, 76, 38); ctx.fill(); ctx.shadowBlur = 0; txt(p.emoji + ' ' + p.name, x + pw / 2, 215, 40, '#06101c', {}); }
    else { ctx.fillStyle = 'rgba(255,255,255,.05)'; rr(ctx, x, 176, pw, 76, 38); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 2.5; ctx.stroke(); txt(p.emoji + ' ' + p.name, x + pw / 2, 215, 40, '#fff', { alpha: 0.5 }); }
    ctx.restore(); txt(on ? 'NOW' : 'COMING SOON', x + pw / 2, 280, 24, on ? p.acc : '#fff', { alpha: on ? 0.55 + 0.45 * pulse : 0.4, weight: 800 });
  });
  txt(`${P.name} · GRAVITY ${P.g} m/s² · ${BALL_MASS} KG BALL` + (P.speed !== 1 ? ` · VIDEO ×${P.speed}` : ''), W / 2, 326, 29, 'rgba(255,255,255,.7)', { weight: 700 });
  // stats
  const hv = R.h >= 0 ? R.h : 0, sp = Math.round(Math.abs(R.v) * 3.6), en = Math.round(BALL_MASS * (R.g * hv + R.v * R.v / 2)), fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const tiles = [['HEIGHT', hv.toFixed(1), 'm'], ['SPEED', String(sp), 'km/h'], ['TIME', R.t.toFixed(1), 's'], ['ENERGY', fmt(en), 'J']];
  tiles.forEach((tl, i) => {
    const x = 40 + (i % 2) * 508, y = 352 + Math.floor(i / 2) * 134, w = 492, h = 120;
    ctx.fillStyle = 'rgba(255,255,255,.07)'; rr(ctx, x, y, w, h, 22); ctx.fill(); ctx.strokeStyle = acc; ctx.globalAlpha = 0.35; ctx.lineWidth = 2.5; ctx.stroke(); ctx.globalAlpha = 1;
    txt(tl[0], x + 26, y + 30, 27, acc, { align: 'left', weight: 800 });
    ctx.font = `900 62px ${FF}`; const vw = ctx.measureText(tl[1]).width; txt(tl[1], x + 26, y + 80, 62, '#fff', { align: 'left' }); txt(tl[2], x + 36 + vw, y + 90, 32, 'rgba(255,255,255,.65)', { align: 'left', weight: 800 });
  });
  // always-on question (kept in the Shorts safe zone)
  if (R.phase !== 'end') txt(TXT.ASK, W / 2, 1500, 44, '#ffe14a', { alpha: 0.75 + 0.25 * pulse, stroke: 10, strokeColor: 'rgba(0,0,0,.6)' });
  // hook + countdown
  if (R.phase === 'intro') {
    const k = 1 + 0.035 * Math.sin(R.clock * 6), fade = clamp((INTRO_TIME - R.pt) / 0.35, 0, 1);
    ctx.save(); ctx.globalAlpha = fade; ctx.translate(W / 2, 960); ctx.scale(k, k);
    txt(TXT.HOOK1, 0, -70, 92, '#fff', { stroke: 18 }); txt(TXT.HOOK2, 0, 36, 92, acc, { stroke: 18 }); txt(TXT.HOOK3, 0, 130, 46, '#ffe14a', { stroke: 12 }); ctx.restore();
    const cdT = R.pt - 0.25; if (cdT > 0 && R.cd <= 3) { const n = R.cd, ph = (cdT % 1), sc = 1 + 0.6 * Math.pow(1 - ph, 3); ctx.save(); ctx.translate(W / 2, 1230); ctx.scale(sc, sc); ctx.globalAlpha = fade * (0.35 + 0.65 * (1 - ph * 0.6)); txt(String(n), 0, 0, 210, '#fff', { stroke: 22 }); ctx.restore(); }
  }
  // toast
  if (R.toast) { const k = R.toast.age / 1.4, sc = R.toast.age < 0.15 ? 0.5 + 3.3 * R.toast.age : 1; ctx.save(); ctx.translate(W / 2, 800); ctx.scale(sc, sc); ctx.globalAlpha = k < 0.7 ? 1 : (1 - k) / 0.3; txt(R.toast.text, 0, 0, 86, '#fff', { stroke: 16 }); ctx.restore(); }

  if (R.phase === 'end') {
    const e = R.endT, a = clamp(e / 0.35, 0, 1), nxt = PLANETS[(R.idx + 1) % PLANETS.length];
    ctx.fillStyle = `rgba(3,5,16,${0.86 * a})`; rr(ctx, 40, PT - 10, W - 80, GY - PT + 100, 36); ctx.fill();
    ctx.globalAlpha = a; txt(TXT.END1, W / 2, 770, 92, acc, { stroke: 14 }); txt(TXT.END2, W / 2, 880, 56, '#fff', { stroke: 10 });
    const pop = e < 0.5 ? 1 + 0.35 * Math.pow(1 - e / 0.5, 2) : 1; ctx.save(); ctx.translate(W / 2, 1060); ctx.scale(pop, pop); txt(String(R.bounces), 0, 0, 270, '#fff', { stroke: 22 }); ctx.restore();
    txt(`FIRST IMPACT: ${R.firstSpeed} km/h · ${R.P.name}`, W / 2, 1210, 36, 'rgba(255,255,255,.7)', { weight: 700 });
    txt(TXT.END3, W / 2, 1290, 54, '#ffe14a', { stroke: 10 });
    if (e > 0.7) { const b = clamp((e - 0.7) / 0.3, 0, 1); ctx.globalAlpha = b; txt(`NEXT: ${nxt.emoji} ${nxt.name}`, W / 2, 1370, 52, nxt.acc, { stroke: 10 }); ctx.globalAlpha = 1; }
    ctx.globalAlpha = 1; if (e > 1.1) { const s = 1 + 0.05 * Math.sin(R.clock * 7); ctx.save(); ctx.translate(W / 2, 1478); ctx.scale(s, s); ctx.fillStyle = acc; rr(ctx, -330, -46, 660, 92, 46); ctx.fill(); txt(TXT.CTA, 0, 2, 46, '#06101c', {}); ctx.restore(); }
  }
  // impact flash
  if (R.flash > 0.01) { ctx.globalAlpha = Math.min(0.6, R.flash); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}
function drawIdle() { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#04050f'; ctx.fillRect(0, 0, cv.width, cv.height); }

/* ---------- loop / start ---------- */

function begin() {

}
$('go').addEventListener('click', begin);
document.addEventListener('visibilitychange', () => { if (!document.hidden && ac && ac.state === 'suspended') ac.resume(); });
layout(); requestAnimationFrame(frame);
window.__dt = { get R() { return R; }, get log() { return doneLog; }, get ac() { return ac; } };
})();
