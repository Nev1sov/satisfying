<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#03040f">
<title>NEON CHARACTER RACE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  position:fixed;inset:0;width:100%;height:100%;overflow:hidden;
  background:#000;color:#fff;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
#stage{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  overflow:hidden;background:#03040f;--u:1px;
}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}

#hud{
  position:absolute;left:0;right:0;top:0;height:13%;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  pointer-events:none;z-index:10;
  background:linear-gradient(to bottom,rgba(3,4,15,.96) 0%,rgba(3,4,15,.5) 70%,transparent);
  padding-bottom:5px;
}
#title{
  font-size:calc(var(--u)*24);font-weight:900;letter-spacing:.16em;
  text-shadow:0 0 calc(var(--u)*14) rgba(120,160,255,.9);
}
#status{
  font-size:calc(var(--u)*15);font-weight:700;letter-spacing:.1em;
  opacity:.5;margin-top:2px;
}

#rank{
  position:absolute;left:0;right:0;top:11.8%;height:calc(var(--u)*46);
  display:flex;justify-content:center;gap:calc(var(--u)*4);
  pointer-events:none;z-index:12;opacity:0;transition:opacity .4s;
}
.racing #rank{opacity:1}
.rchip{
  height:100%;padding:0 calc(var(--u)*9);
  display:flex;align-items:center;gap:calc(var(--u)*5);
  border-radius:999px;background:rgba(15,18,40,.85);
  border:calc(var(--u)*2) solid rgba(255,255,255,.12);
  transition:transform .4s cubic-bezier(.3,1.4,.5,1),box-shadow .25s;
}
.rchip i,.rchip img{
  width:calc(var(--u)*22);height:calc(var(--u)*22);border-radius:50%;
  object-fit:cover;background:var(--c);
  box-shadow:0 0 calc(var(--u)*8) var(--c);
}
.rchip b{font-size:calc(var(--u)*14);font-weight:800}
.rchip.lead{
  transform:scale(1.1);
  box-shadow:0 0 calc(var(--u)*13) var(--c);
  border-color:var(--c);
}
.rchip.lead b{color:var(--c)}

#toast{
  position:absolute;left:0;right:0;top:19%;text-align:center;
  font-size:calc(var(--u)*30);font-weight:900;letter-spacing:.04em;
  color:var(--c,#fff);opacity:0;pointer-events:none;z-index:20;
  text-shadow:0 0 calc(var(--u)*18) var(--c),0 3px 0 rgba(0,0,0,.7);
}
#toast.show{animation:toastAnim 1.7s ease-out forwards}
@keyframes toastAnim{
  0%{opacity:0;transform:scale(.65) translateY(10px)}
  14%{opacity:1;transform:scale(1.1)}
  25%{transform:scale(1)}
  78%{opacity:1}
  100%{opacity:0;transform:translateY(-16px)}
}

#intro,#end{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none;
  opacity:0;transition:opacity .5s;z-index:15;
  background:radial-gradient(ellipse at center,rgba(3,5,20,.82),transparent 70%);
}
#intro.show,#end.show{opacity:1}
#introBig{
  font-size:calc(var(--u)*48);font-weight:900;letter-spacing:.06em;
  text-align:center;line-height:1.1;
  text-shadow:0 0 calc(var(--u)*24) rgba(110,160,255,1);
}
#introSub{
  margin-top:calc(var(--u)*11);font-size:calc(var(--u)*20);
  font-weight:800;color:#ffd76a;letter-spacing:.08em;
}
#endBig{
  font-size:calc(var(--u)*44);font-weight:900;letter-spacing:.04em;
  text-shadow:0 0 calc(var(--u)*22) var(--c,#88f);
}
#endCta{
  margin-top:calc(var(--u)*20);font-size:calc(var(--u)*20);font-weight:800;
  padding:calc(var(--u)*9) calc(var(--u)*26);border-radius:999px;
  background:rgba(255,255,255,.13);border:calc(var(--u)*2) solid rgba(255,255,255,.45);
}

#start{
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
  align-items:center;padding:14px 12px 22px;overflow-y:auto;
  background:radial-gradient(ellipse at 50% 12%,rgba(45,30,130,.55),rgba(2,3,12,.97) 65%);
  transition:opacity .4s;-webkit-overflow-scrolling:touch;
}
#start.hide{opacity:0;pointer-events:none}
.logo{
  font-size:26px;font-weight:900;letter-spacing:.1em;line-height:1.15;
  text-shadow:0 0 20px rgba(110,160,255,.95);text-align:center;margin-bottom:5px;
}
.grp{display:flex;flex-direction:column;gap:5px;align-items:center;margin-bottom:9px}
.grp small{font-size:10px;letter-spacing:.22em;opacity:.5;font-weight:700}
.chips{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.chip{
  padding:6px 11px;border-radius:999px;font-size:12px;font-weight:800;
  background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.18);cursor:pointer;
}
.chip.on{
  background:rgba(255,255,255,.92);color:#0a0a1f;border-color:#fff;
  box-shadow:0 0 12px rgba(140,170,255,.6);
}

#charList{
  width:100%;max-width:380px;display:flex;flex-direction:column;gap:7px;
  margin:6px 0 12px;
}
.char-row{
  display:flex;align-items:center;gap:9px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:13px;padding:7px 9px;
}
.char-preview{
  width:44px;height:44px;border-radius:50%;object-fit:cover;
  background:var(--c);flex-shrink:0;
  box-shadow:0 0 11px var(--c);border:2px solid rgba(255,255,255,.3);
}
.char-info{flex:1;min-width:0}
.char-name{font-size:13px;font-weight:800;letter-spacing:.03em}
.char-actions{display:flex;gap:5px}
.btn-up,.btn-clear{
  padding:5px 9px;border-radius:7px;font-size:11px;font-weight:700;
  border:none;cursor:pointer;white-space:nowrap;
}
.btn-up{background:linear-gradient(180deg,#7ab8ff,#5a8fff);color:#06102a}
.btn-clear{background:rgba(255,255,255,.1);color:#ccc;display:none}
.char-row.has-img .btn-clear{display:block}

#go{
  margin-top:3px;padding:13px 34px;border-radius:13px;border:none;cursor:pointer;
  font-size:15px;font-weight:900;letter-spacing:.13em;color:#06091f;
  background:linear-gradient(180deg,#b8e4ff,#6aa8ff 55%,#9a7bff);
  box-shadow:0 0 24px rgba(100,150,255,.7);
  animation:pulse 1.25s ease-in-out infinite alternate;
}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.04)}}
.tips{font-size:11px;line-height:1.5;opacity:.5;max-width:300px;text-align:center;margin-top:7px}
input[type=file]{display:none}
</style>
</head>
<body>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div id="title">NEON CHARACTER RACE</div>
    <div id="status">GET READY</div>
  </div>
  <div id="rank"></div>
  <div id="toast"></div>
  <div id="intro">
    <div id="introBig">CHARACTER<br>RACE</div>
    <div id="introSub">WHO WILL WIN?</div>
  </div>
  <div id="end">
    <div id="endBig"></div>
    <div id="endCta">FOLLOW FOR MORE</div>
  </div>
</div>

<div id="start">
  <div class="logo">NEON<br>CHARACTER RACE</div>
  <div class="grp"><small>DURATION</small><div class="chips" id="durChips"></div></div>
  <div class="grp"><small>RACERS</small><div class="chips" id="nChips"></div></div>
  <div class="grp"><small>THEME</small><div class="chips" id="themeChips"></div></div>
  <div id="charList"></div>
  <button id="go">TAP TO START</button>
  <div class="tips">🔊 Volume up · silent mode off<br>🎥 Start screen recording first<br>Загрузи лица персонажей</div>
</div>

<script>
(() => {
'use strict';

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const Q=new URLSearchParams(location.search);
let saved={};
try{saved=JSON.parse(localStorage.getItem('neonCharRace2')||'{}')||{};}catch(e){}

const settings={
  dur:+Q.get('d')||saved.dur||55,
  n:+Q.get('n')||saved.n||4,
  theme:saved.theme===undefined?-1:saved.theme
};
function saveSettings(){
  try{localStorage.setItem('neonCharRace2',JSON.stringify({dur:settings.dur,n:settings.n,theme:settings.theme}));}catch(e){}
}

const PAL=[
  {name:'RED',h:355},{name:'BLUE',h:215},{name:'YELLOW',h:52},{name:'GREEN',h:135},
  {name:'PURPLE',h:282},{name:'ORANGE',h:24},{name:'CYAN',h:185},{name:'PINK',h:320}
];
const THEMES=[
  {name:'AURORA',lo:170,hi:290,bg:['#04061a','#0a0430'],glow:'rgba(130,100,255,.9)'},
  {name:'SUNSET',lo:300,hi:380,bg:['#14040f','#260709'],glow:'rgba(255,100,90,.9)'},
  {name:'OCEAN',lo:165,hi:240,bg:['#010a14','#03203a'],glow:'rgba(40,200,255,.9)'},
  {name:'NIGHT',lo:200,hi:330,bg:['#05050f','#0e0720'],glow:'rgba(200,120,255,.85)'}
];

const LW=1000;
const DT=1/120;
const BALL_R=38;          // <<< значительно больше
const G0=1520;

const $=id=>document.getElementById(id);
const stage=$('stage'),cv=$('cv'),ctx=cv.getContext('2d',{alpha:false});
const rankEl=$('rank'),toastEl=$('toast'),introEl=$('intro'),endEl=$('end');
const statusEl=$('status'),charList=$('charList');

const charImages={};

function buildCharList(){
  charList.innerHTML='';
  const n=clamp(settings.n,2,8);
  for(let i=0;i<n;i++){
    const p=PAL[i];
    const row=document.createElement('div');
    row.className='char-row'+(charImages[i]?' has-img':'');
    row.dataset.id=i;

    const preview=document.createElement(charImages[i]?'img':'div');
    preview.className='char-preview';
    preview.style.setProperty('--c',`hsl(${p.h},100%,55%)`);
    if(charImages[i]) preview.src=charImages[i].url;

    const info=document.createElement('div');
    info.className='char-info';
    info.innerHTML=`<div class="char-name">${p.name}</div>`;

    const actions=document.createElement('div');
    actions.className='char-actions';

    const btnUp=document.createElement('button');
    btnUp.className='btn-up';
    btnUp.textContent=charImages[i]?'Сменить':'Загрузить фото';
    btnUp.onclick=()=>triggerUpload(i);

    const btnClear=document.createElement('button');
    btnClear.className='btn-clear';
    btnClear.textContent='✕';
    btnClear.onclick=()=>{
      if(charImages[i]){URL.revokeObjectURL(charImages[i].url);delete charImages[i];buildCharList();}
    };

    actions.append(btnUp,btnClear);
    row.append(preview,info,actions);
    charList.appendChild(row);
  }
}

function triggerUpload(id){
  const input=document.createElement('input');
  input.type='file';
  input.accept='image/*';
  input.onchange=e=>{
    const file=e.target.files[0];
    if(!file)return;
    if(charImages[id])URL.revokeObjectURL(charImages[id].url);
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{charImages[id]={url,img};buildCharList();};
    img.src=url;
  };
  input.click();
}

function buildChips(){
  const mk=(id,items,isOn,onClick)=>{
    const box=$(id);box.innerHTML='';
    items.forEach((it,i)=>{
      const c=document.createElement('div');
      c.className='chip'+(isOn(i,it)?' on':'');
      c.textContent=it.label;
      c.onclick=()=>{onClick(i,it);saveSettings();buildChips();buildCharList();};
      box.appendChild(c);
    });
  };
  mk('durChips',[{label:'40s',v:40},{label:'55s',v:55},{label:'75s',v:75}],
    (i,it)=>Math.abs(settings.dur-it.v)<8,(i,it)=>{settings.dur=it.v});
  mk('nChips',[2,3,4,5,6,7,8].map(v=>({label:v,v})),
    (i,it)=>settings.n===it.v,(i,it)=>{settings.n=it.v});
  mk('themeChips',[{label:'AUTO'}].concat(THEMES.map(t=>({label:t.name}))),
    (i)=>settings.theme===i-1,(i)=>{settings.theme=i-1});
}
buildChips();
buildCharList();

let SW=0,SH=0,SC=1,LH=1900,dpr=1,theme=THEMES[0];
function layout(){
  const vv=window.visualViewport;
  const vw=Math.floor(vv?vv.width:innerWidth);
  const vh=Math.floor(vv?vv.height:innerHeight);
  SW=vw;SH=vh;
  if(vw/vh>0.62){SH=vh;SW=Math.round(vh*9/16);}
  stage.style.width=SW+'px';
  stage.style.height=SH+'px';
  dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.round(SW*dpr);
  cv.height=Math.round(SH*dpr);
  SC=SW/LW;
  LH=SH/SC;
  stage.style.setProperty('--u',SC+'px');
}
addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(layout,90);});
if(window.visualViewport)visualViewport.addEventListener('resize',layout);

let ac=null,master,melodyBus,drumBus;
function initAudio(){
  if(ac){if(ac.state==='suspended')ac.resume();return;}
  ac=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
  const comp=ac.createDynamicsCompressor();
  comp.threshold.value=-16;comp.knee.value=18;comp.ratio.value=3.8;
  master=ac.createGain();master.gain.value=0.88;
  master.connect(comp);comp.connect(ac.destination);
  melodyBus=ac.createGain();melodyBus.gain.value=0.75;melodyBus.connect(master);
  drumBus=ac.createGain();drumBus.gain.value=0.6;drumBus.connect(master);
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function pluck(t,midi,vel=0.6){
  if(!ac)return;
  const f=mtof(midi),o=ac.createOscillator(),g=ac.createGain();
  o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.22*vel,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.55);
  o.connect(g);g.connect(melodyBus);
  o.start(t);o.stop(t+0.6);
}
function kick(t,v=0.7){
  if(!ac)return;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(150,t);
  o.frequency.exponentialRampToValueAtTime(45,t+0.11);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.85*v,t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.28);
  o.connect(g);g.connect(drumBus);
  o.start(t);o.stop(t+0.32);
}

let run=null,racers=[],W=null;
let simPos=0,camY=0,camZ=1,bgPulse=0;
let leaderId=-1,lastToast=-9,winner=null,finished=0;
const Y0=320,Y_TOP=620,SEC_H=920;

const sprites=[];
function makeSprites(){
  for(let i=0;i<60;i++){
    const c=document.createElement('canvas');c.width=c.height=64;
    const g=c.getContext('2d'),h=i*6;
    const gr=g.createRadialGradient(32,32,0,32,32,32);
    gr.addColorStop(0,`hsla(${h},100%,72%,1)`);
    gr.addColorStop(0.25,`hsla(${h},100%,55%,.55)`);
    gr.addColorStop(0.6,`hsla(${h},100%,48%,.12)`);
    gr.addColorStop(1,`hsla(${h},100%,48%,0)`);
    g.fillStyle=gr;g.fillRect(0,0,64,64);
    sprites.push(c);
  }
}
makeSprites();
const spr=h=>sprites[Math.round((((h%360)+360)%360)/6)%60];

function addCirc(o,x,y,r,e,hue,kind){o.circ.push({x,y,r,e,hue,kind:kind||'peg',lit:0,cool:0});}
function addSeg(o,x1,y1,x2,y2,hue,t=9){o.segs.push({type:'static',x1,y1,x2,y2,t,e:0.42,hue,lit:0,cool:0});}

const BUILD={
  pegs(o,y,hue){
    for(let r=0;r<6;r++){
      const off=r%2?0:55;
      for(let i=0;off+i*110<=1000.1;i++) addCirc(o,off+i*110,y+55+r*105,10,0.52,hue,'peg');
    }
  },
  zigzag(o,y,hue){
    for(let k=0;k<4;k++){
      const yy=y+60+k*170;
      if(k%2===0) addSeg(o,0,yy,700,yy+100,hue);
      else addSeg(o,1000,yy,300,yy+100,hue);
    }
  },
  spinners(o,y,hue){
    for(let k=0;k<3;k++){
      for(const sx of [230,770]){
        const dir=(sx===230?1:-1)*(k%2?-1:1);
        const cy=y+140+k*280;
        o.segs.push({type:'spin',cx:sx,cy,L:150,w:dir*(1.25+Math.random()*0.55),ph:Math.random()*6.28,t:9,e:0.55,hue,lit:0,cool:0,x1:0,y1:0,x2:0,y2:0});
        addCirc(o,sx,cy,12,0.48,hue,'hub');
      }
    }
  },
  bumpers(o,y,hue){
    const P=[[190,100],[500,80],[810,110],[150,310],[370,290],[630,320],[860,300],[250,540],[510,520],[770,560],[170,760],[420,750],[690,780],[880,720]];
    P.forEach(([x,yy],i)=>addCirc(o,x+(Math.random()-0.5)*35,y+yy+(Math.random()-0.5)*25,i%3===0?34:24,1.05,hue,'bump'));
  },
  funnel(o,y,hue){
    for(const base of [40,500]){
      const yy=y+base;
      addSeg(o,0,yy,500-85,yy+190,hue);
      addSeg(o,1000,yy,500+85,yy+190,hue);
      for(let r=0;r<3;r++) for(let i=0;i<4+(r%2);i++) addCirc(o,500+(i-(3+r%2)/2)*135,yy+250+r*60,10,0.52,hue,'peg');
    }
  },
  lanes(o,y,hue){
    addSeg(o,500,y+120,500,y+620,hue,11);
    addCirc(o,500,y+120,20,0.65,hue,'bump');
    addCirc(o,500,y+620,10,0.48,hue,'hub');
    addSeg(o,500,y+40,140,y+20,hue);
    addSeg(o,500,y+40,860,y+20,hue);
    for(const cx of [250,750]) for(let r=0;r<3;r++) addCirc(o,cx+(r%2?80:-80),y+200+r*110,12,0.52,hue,'peg');
    addSeg(o,0,y+700,390,y+840,hue);
    addSeg(o,1000,y+700,610,y+840,hue);
  },
  // === НОВЫЕ ПРЕПЯТСТВИЯ ===
  pendulums(o,y,hue){
    for(let k=0;k<3;k++){
      const cx=200+k*300;
      const cy=y+180+k*40;
      o.segs.push({type:'pendulum',cx,cy,L:160,w:1.1+Math.random()*0.4,ph:Math.random()*6.28,t:8,e:0.5,hue,lit:0,cool:0,x1:0,y1:0,x2:0,y2:0});
      addCirc(o,cx,cy,9,0.4,hue,'hub');
    }
  },
  gates(o,y,hue){
    for(let k=0;k<4;k++){
      const yy=y+80+k*180;
      const gap=180+Math.random()*40;
      const mid=300+Math.random()*400;
      addSeg(o,0,yy,mid-gap/2,yy,hue,8);
      addSeg(o,mid+gap/2,yy,1000,yy,hue,8);
      addCirc(o,mid-gap/2,yy,8,0.5,hue,'peg');
      addCirc(o,mid+gap/2,yy,8,0.5,hue,'peg');
    }
  },
  boosters(o,y,hue){
    for(let k=0;k<5;k++){
      const x=120+k*190;
      const yy=y+100+k*140;
      addCirc(o,x,yy,28,1.4,hue,'boost');
    }
  },
  wave(o,y,hue){
    for(let k=0;k<6;k++){
      const yy=y+70+k*130;
      const amp=90+Math.random()*40;
      addSeg(o,0,yy,500,yy+amp*(k%2?1:-1),hue);
      addSeg(o,500,yy+amp*(k%2?1:-1),1000,yy,hue);
    }
  }
};

function buildTrack(){
  const o={circ:[],segs:[],secs:[]};
  const kinds=Object.keys(BUILD);
  let y=Y_TOP,last='';
  // <<< больше секций для длинной карты
  for(let i=0;i<9;i++){
    let k,tries=0;
    do{k=kinds[Math.floor(Math.random()*kinds.length)];tries++;}
    while((k===last||o.secs.filter(s=>s.k===k).length>=2)&&tries<50);
    last=k;
    const hue=((theme.lo+(theme.hi-theme.lo)*i/8)%360+360)%360;
    BUILD[k](o,y,hue);
    o.secs.push({y,k,hue});
    y+=SEC_H;
  }
  o.Yfin=y+70;
  o.floorY=o.Yfin+400;
  addSeg(o,0,o.floorY,1000,o.floorY,((theme.lo+40)%360),14);
  addSeg(o,0,o.Yfin+210,240,o.Yfin+360,((theme.lo+40)%360));
  addSeg(o,1000,o.Yfin+210,760,o.Yfin+360,((theme.lo+40)%360));
  return o;
}

function updateDynamic(t){
  for(const s of W.segs){
    if(s.type==='spin'||s.type==='pendulum'){
      const a=s.ph+s.w*t;
      const c=Math.cos(a)*s.L,d=Math.sin(a)*s.L;
      s.x1=s.cx-c;s.y1=s.cy-d;s.x2=s.cx+c;s.y2=s.cy+d;
    }
  }
}

function circleHit(b,c){
  const dx=b.x-c.x,dy=b.y-c.y,R=b.r+c.r,d2=dx*dx+dy*dy;
  if(d2>=R*R)return;
  const d=Math.sqrt(d2)||0.01,nx=dx/d,ny=dy/d;
  b.x=c.x+nx*R;b.y=c.y+ny*R;
  const vn=b.vx*nx+b.vy*ny;
  if(vn<0){
    const e=-vn>70?c.e:0;
    b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny;
    b.vx+=(Math.random()-0.5)*18;
    if(c.kind==='bump'){b.vx+=nx*140;b.vy+=ny*140;}
    if(c.kind==='boost'){b.vx+=nx*90;b.vy+=ny*220;}
    if(-vn>100){c.lit=1;c.cool=0.06;}
  }
}
function segHit(b,s){
  const abx=s.x2-s.x1,aby=s.y2-s.y1,ll=abx*abx+aby*aby||1;
  const t=clamp(((b.x-s.x1)*abx+(b.y-s.y1)*aby)/ll,0,1);
  const px=s.x1+abx*t,py=s.y1+aby*t;
  let dx=b.x-px,dy=b.y-py;
  const R=b.r+s.t,d2=dx*dx+dy*dy;
  if(d2>=R*R)return;
  let d=Math.sqrt(d2),nx,ny;
  if(d<1e-4){nx=-aby;ny=abx;const l=Math.hypot(nx,ny)||1;nx/=l;ny/=l;}
  else{nx=dx/d;ny=dy/d;}
  b.x=px+nx*R;b.y=py+ny*R;
  const vn=b.vx*nx+b.vy*ny;
  if(vn<0){
    const e=-vn>90?s.e:0;
    b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny;
    if(-vn>110){s.lit=1;s.cool=0.06;}
  }
}

function physicsStep(){
  const raceT=simPos-run.introLen;
  updateDynamic(Math.max(0,raceT));

  const sorted=[...racers].sort((a,b)=>(a.fin&&b.fin)?a.place-b.place:a.fin?-1:b.fin?1:b.y-a.y);
  const lead=sorted[0];

  const u=clamp(raceT/run.Trace,0,1);
  const yT=Y0+(W.Yfin-Y0)*u;
  const gm=winner?1:clamp(1+(yT-lead.y)/580,0.32,2.5);

  for(const b of racers){
    if(b.fin)continue;
    const behind=clamp((lead.y-b.y)/460,0,1);
    const gi=G0*gm*(1+0.26*behind-(b===lead?0.04:0));
    b.vy+=gi*DT;
    b.vx*=1-0.085*DT;
    const sp=Math.hypot(b.vx,b.vy);
    if(sp>1380){b.vx*=1380/sp;b.vy*=1380/sp;}
    b.x+=b.vx*DT;b.y+=b.vy*DT;

    if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*0.48;}
    else if(b.x>LW-b.r){b.x=LW-b.r;b.vx=-Math.abs(b.vx)*0.48;}

    for(const c of W.circ)if(Math.abs(c.y-b.y)<c.r+b.r+8)circleHit(b,c);
    for(const s of W.segs){
      const lo=Math.min(s.y1,s.y2)-s.t-b.r-5;
      const hi=Math.max(s.y1,s.y2)+s.t+b.r+5;
      if(b.y<lo||b.y>hi)continue;
      segHit(b,s);
    }

    if(Math.hypot(b.vx,b.vy)<38){
      b.stuck=(b.stuck||0)+DT;
      if(b.stuck>0.65){
        b.stuck=0;
        b.vx+=(Math.random()<0.5?-1:1)*(150+Math.random()*90);
        b.vy-=90;
      }
    }else b.stuck=Math.max(0,(b.stuck||0)-DT*2);

    if(b.y>W.Yfin){
      b.fin=true;
      b.place=++finished;
      if(!winner)onWin(b);
    }
  }

  for(let i=0;i<racers.length;i++)
    for(let j=i+1;j<racers.length;j++){
      const a=racers[i],b=racers[j];
      const dx=a.x-b.x,dy=a.y-b.y,R=a.r+b.r,d2=dx*dx+dy*dy;
      if(d2>=R*R)continue;
      const d=Math.sqrt(d2)||0.01,nx=dx/d,ny=dy/d,ov=R-d;
      a.x+=nx*ov/2;a.y+=ny*ov/2;
      b.x-=nx*ov/2;b.y-=ny*ov/2;
      const vrel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
      if(vrel<0){
        const j2=-(1+0.82)*vrel/2;
        a.vx+=j2*nx;a.vy+=j2*ny;
        b.vx-=j2*nx;b.vy-=j2*ny;
      }
    }

  if(!winner&&raceT>1.0){
    if(lead.id!==leaderId&&simPos-lastToast>1.9){
      lastToast=simPos;
      leaderId=lead.id;
      showToast(lead.name+' TAKES THE LEAD!',`hsl(${lead.h},100%,65%)`);
      if(ac){const t=ac.currentTime;pluck(t,71,0.8);pluck(t+0.07,75,0.7);kick(t,0.55);}
    }
  }
  simPos+=DT;
}

function onWin(b){
  winner=b;
  run.stopMusic=ac?ac.currentTime+4.2:0;
  if(ac){
    const t=ac.currentTime;
    kick(t,1.1);
    pluck(t,67,0.9);pluck(t+0.08,71,0.9);pluck(t+0.16,74,0.9);pluck(t+0.24,79,1);
  }
  statusEl.textContent='FINISHED';
  setTimeout(()=>{
    $('endBig').textContent=b.name+' WINS!';
    $('endBig').style.color=`hsl(${b.h},100%,65%)`;
    endEl.classList.add('show');
  },900);
}

function draw(dt){
  const sorted=[...racers].sort((a,b)=>(a.fin&&b.fin)?a.place-b.place:a.fin?-1:b.fin?1:b.y-a.y);
  const lead=sorted[0];

  let tgtY,tgtZ=1;
  if(simPos<run.introLen)tgtY=Y0+0.12*LH;
  else if(winner){tgtY=W.Yfin-50;tgtZ=1.08;}
  else{
    let avg=0;racers.forEach(r=>avg+=r.y);avg/=racers.length;
    tgtY=lead.y*0.48+avg*0.52+0.14*LH;
    const near=clamp((lead.y-(W.Yfin-950))/700,0,1);
    tgtZ=1+0.22*near*near*(3-2*near);
  }
  const k=1-Math.pow(0.00035,dt);
  camY+=(tgtY-camY)*k;
  camZ+=(tgtZ-camZ)*(1-Math.pow(0.012,dt));
  const half=LH/2/camZ;
  camY=clamp(camY,half-120,W.floorY+50-half);

  const top=camY-half-60,bot=camY+half+60;
  const kz=dpr*SC*camZ;

  ctx.setTransform(1,0,0,1,0,0);
  const bg=ctx.createLinearGradient(0,0,0,cv.height);
  bg.addColorStop(0,theme.bg[0]);
  bg.addColorStop(1,theme.bg[1]);
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,cv.width,cv.height);

  if(bgPulse>0.01){
    const g=ctx.createRadialGradient(cv.width/2,cv.height*0.45,0,cv.width/2,cv.height*0.45,cv.height*0.55);
    g.addColorStop(0,`hsla(${((theme.lo+theme.hi)/2)%360},90%,55%,${0.13*Math.min(bgPulse,1.5)})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;
    ctx.fillRect(0,0,cv.width,cv.height);
    bgPulse*=Math.exp(-dt*5.5);
  }

  ctx.setTransform(kz,0,0,kz,cv.width/2-LW/2*kz,cv.height/2-camY*kz);

  for(const s of W.secs){
    if(s.y+SEC_H<top||s.y>bot)continue;
    const g=ctx.createLinearGradient(0,s.y,0,s.y+SEC_H);
    g.addColorStop(0,`hsla(${s.hue},100%,55%,0.055)`);
    g.addColorStop(1,`hsla(${s.hue},100%,55%,0)`);
    ctx.fillStyle=g;ctx.fillRect(0,s.y,LW,SEC_H);
  }

  ctx.lineCap='round';
  for(const s of W.segs){
    if(Math.max(s.y1,s.y2)<top-50||Math.min(s.y1,s.y2)>bot+50)continue;
    s.lit*=Math.exp(-dt*4);
    if(s.cool>0)s.cool-=dt;
    const l=s.lit;
    for(const [w,a] of [[s.t*2+11,0.14+0.24*l],[s.t*2+3,0.38+0.4*l],[Math.max(3,s.t*2-6),0.95]]){
      ctx.strokeStyle=w<=3?`hsla(${s.hue},100%,${84+10*l}%,${a})`:`hsla(${s.hue},100%,${54+24*l}%,${a})`;
      ctx.lineWidth=w;
      ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();
    }
  }

  for(const c of W.circ){
    if(c.y<top-80||c.y>bot+80)continue;
    c.lit*=Math.exp(-dt*4);
    if(c.cool>0)c.cool-=dt;
    const l=c.lit,big=c.kind==='bump'||c.kind==='boost';
    ctx.globalAlpha=(big?0.28:0.48)+0.48*l;
    const ss=c.r*(big?2.3:2.4)*(1+0.35*l);
    ctx.drawImage(spr(c.hue),c.x-ss,c.y-ss,ss*2,ss*2);
    ctx.globalAlpha=1;
    ctx.fillStyle=`hsla(${c.hue},95%,${big?45:43}%,${(big?0.38:0.52)+0.38*l})`;
    ctx.beginPath();ctx.arc(c.x,c.y,c.r*(0.8+0.17*l),0,6.283);ctx.fill();
    ctx.strokeStyle=`hsla(${c.hue},100%,88%,${0.6+0.35*l})`;
    ctx.lineWidth=big?3.2:2;ctx.stroke();
  }

  // finish
  const y=W.Yfin;
  ctx.globalCompositeOperation='source-over';
  for(let i=0;i<LW/26;i++)for(let j=0;j<2;j++){
    ctx.fillStyle=(i+j)%2?'rgba(255,255,255,0.85)':'rgba(10,10,30,0.9)';
    ctx.fillRect(i*26,y-26+j*26,26,26);
  }
  ctx.globalCompositeOperation='lighter';
  const fg=ctx.createLinearGradient(0,y-90,0,y+60);
  fg.addColorStop(0,'rgba(255,220,100,0)');
  fg.addColorStop(0.5,'rgba(255,220,100,0.28)');
  fg.addColorStop(1,'rgba(255,220,100,0)');
  ctx.fillStyle=fg;ctx.fillRect(0,y-90,LW,150);
  ctx.globalCompositeOperation='source-over';
  ctx.font='900 48px sans-serif';ctx.textAlign='center';
  ctx.fillStyle='rgba(255,235,150,0.95)';
  ctx.fillText('FINISH',LW/2,y-50);

  for(const b of racers){
    if(simPos>=run.introLen||b.fin){
      b.trail=b.trail||[];
      b.trail.push({x:b.x,y:b.y});
      if(b.trail.length>14)b.trail.shift();
    }
  }

  const intro=simPos<run.introLen;
  for(const b of [...racers].reverse()){
    if(intro){
      b.y=Y0+Math.sin(simPos*2.6+b.id)*7;
      b.x=(b.id+0.5)*LW/racers.length;
    }

    // trail
    ctx.globalCompositeOperation='lighter';
    const tr=b.trail||[];
    for(let i=1;i<tr.length;i++){
      const a=i/tr.length;
      ctx.strokeStyle=`hsla(${b.h},100%,60%,${a*0.4})`;
      ctx.lineWidth=b.r*1.3*a;
      ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(tr[i-1].x,tr[i-1].y);ctx.lineTo(tr[i].x,tr[i].y);ctx.stroke();
    }

    const rr=b.r;
    // soft glow
    ctx.globalAlpha=0.65;
    ctx.drawImage(spr(b.h),b.x-rr*2.9,b.y-rr*2.9,rr*5.8,rr*5.8);
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';

    // === BIG FACE BALL ===
    ctx.save();
    ctx.beginPath();
    ctx.arc(b.x,b.y,rr,0,Math.PI*2);
    ctx.closePath();
    ctx.clip();

    if(b.img){
      // лицо крупнее и чётче
      const size=rr*2.15;
      ctx.drawImage(b.img,b.x-size/2,b.y-size/2,size,size);
    }else{
      const gg=ctx.createRadialGradient(b.x-rr*0.25,b.y-rr*0.3,rr*0.1,b.x,b.y,rr);
      gg.addColorStop(0,`hsl(${b.h},100%,84%)`);
      gg.addColorStop(0.55,`hsl(${b.h},100%,55%)`);
      gg.addColorStop(1,`hsl(${b.h},95%,36%)`);
      ctx.fillStyle=gg;
      ctx.fill();
    }
    ctx.restore();

    // толстая цветная обводка
    ctx.strokeStyle=`hsl(${b.h},100%,62%)`;
    ctx.lineWidth=4.5;
    ctx.beginPath();
    ctx.arc(b.x,b.y,rr,0,Math.PI*2);
    ctx.stroke();

    // тонкая белая
    ctx.strokeStyle='rgba(255,255,255,.7)';
    ctx.lineWidth=1.8;
    ctx.beginPath();
    ctx.arc(b.x,b.y,rr-1.8,0,Math.PI*2);
    ctx.stroke();

    if(b===lead&&!intro&&!winner){
      ctx.font='900 26px sans-serif';ctx.textAlign='center';
      ctx.lineWidth=6;ctx.strokeStyle='rgba(0,0,10,.75)';
      ctx.fillStyle=`hsl(${b.h},100%,70%)`;
      ctx.strokeText(b.name,b.x,b.y-rr-16);
      ctx.fillText(b.name,b.x,b.y-rr-16);
    }
  }

  if(winner){
    const w=winner;
    ctx.font='900 28px sans-serif';ctx.textAlign='center';
    ctx.fillStyle='#ffd76a';
    ctx.fillText('👑',w.x,w.y-w.r-30+Math.sin(simPos*5)*3);
  }

  const order=sorted;
  const cw=LW/racers.length;
  order.forEach((r,i)=>{
    if(!r.chip)return;
    r.chip.style.width=(cw*SC)+'px';
    r.chip.style.transform=`translateX(${i*cw*SC}px)`;
    r.chip.classList.toggle('lead',i===0);
  });
}

let lastDrawT=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,Math.max(0.001,(ts-lastDrawT)/1000));
  lastDrawT=ts;
  if(!run||!ac)return;

  const now=ac.currentTime;
  const target=now-run.t0;
  if(target>0){
    let n=0;
    while(simPos<target&&n<22){
      if(simPos>=run.introLen)physicsStep();
      else simPos+=DT;
      n++;
    }
    if(simPos<target-0.2)simPos=target;
  }
  draw(dt);

  if(winner&&now>run.stopMusic+2.8&&!run.restarted){
    run.restarted=true;
    setTimeout(()=>{if(run&&run.restarted)startRun();},1500);
  }
}

function startRun(){
  theme=settings.theme>=0?THEMES[settings.theme]:THEMES[Math.floor(Math.random()*THEMES.length)];
  stage.style.setProperty('--glow',theme.glow);

  const beat=60/112;
  run={
    t0:ac.currentTime+0.35,
    introLen:beat*7,
    Trace:Math.max(18,settings.dur-8),
    energy:0.05,
    stopMusic:Infinity,
    restarted:false
  };
  simPos=0;camY=Y0+0.12*LH;camZ=1;bgPulse=0;
  leaderId=-1;lastToast=-9;winner=null;finished=0;

  W=buildTrack();
  updateDynamic(0);

  racers=[];
  const n=clamp(settings.n,2,8);
  for(let i=0;i<n;i++){
    const p=PAL[i];
    racers.push({
      id:i,name:p.name,h:p.h,
      x:(i+0.5)*LW/n,y:Y0,vx:0,vy:0,r:BALL_R,
      trail:[],fin:false,place:0,stuck:0,
      img:charImages[i]?charImages[i].img:null
    });
  }

  rankEl.innerHTML='';
  racers.forEach(r=>{
    const c=document.createElement('div');
    c.className='rchip';
    c.style.setProperty('--c',`hsl(${r.h},100%,60%)`);
    if(r.img){
      const img=document.createElement('img');
      img.src=charImages[r.id].url;
      c.appendChild(img);
    }else{
      const i=document.createElement('i');
      c.appendChild(i);
    }
    const b=document.createElement('b');
    b.textContent=r.name;
    c.appendChild(b);
    r.chip=c;
    rankEl.appendChild(c);
  });

  endEl.classList.remove('show');
  toastEl.classList.remove('show');
  introEl.classList.add('show');
  stage.classList.add('racing');
  statusEl.textContent='GET READY';

  setTimeout(()=>{
    introEl.classList.remove('show');
    statusEl.textContent='RACING';
    if(ac){kick(ac.currentTime,0.8);pluck(ac.currentTime,72,0.7);}
  },run.introLen*1000-160);
}

function showToast(text,color){
  toastEl.textContent=text;
  toastEl.style.setProperty('--c',color);
  toastEl.classList.remove('show');
  void toastEl.offsetWidth;
  toastEl.classList.add('show');
}

function begin(){
  try{initAudio();}catch(e){}
  try{
    const el=document.documentElement;
    (el.requestFullscreen||el.webkitRequestFullscreen||(()=>{})).call(el);
  }catch(e){}
  $('start').classList.add('hide');
  startRun();
  requestAnimationFrame(frame);
}

$('go').addEventListener('click',begin);
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&ac&&ac.state==='suspended')ac.resume();
});
layout();
})();
</script>
