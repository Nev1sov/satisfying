<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#04030d">
<title>Realign</title>
<style>
html, body { margin: 0; height: 100%; background: #04030d; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; cursor: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; will-change: transform; }
#hud, #title, #cta, #snd, #start { font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: #fff; }
#hud { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; white-space: nowrap; }
#num { font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; opacity: .8; }
#unit { font-weight: 700; font-size: .4em; letter-spacing: .4em; padding-left: .4em; margin-top: .3em; opacity: .35; }
#title { position: fixed; left: 0; right: 0; text-align: center; pointer-events: none; font-weight: 900; line-height: 1.12; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; text-shadow: 0 0 18px rgba(150,130,255,.85), 0 2px 0 rgba(0,0,0,.5); transition: opacity .35s; }
#title em { font-style: normal; color: #c9b6ff; }
#title.win em { color: #fff; }
#title.off, #cta { opacity: 0; }
#cta { position: fixed; left: 0; right: 0; text-align: center; pointer-events: none; font-weight: 800; letter-spacing: .3em; transition: opacity .5s; text-shadow: 0 0 14px rgba(255,255,255,.6); }
#cta.on { opacity: .75; }
#snd { position: fixed; left: 50%; bottom: 14%; transform: translateX(-50%); z-index: 8; padding: 10px 22px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.7); background: rgba(4,3,13,.7); font-size: 13px; font-weight: 800; letter-spacing: .25em; display: none; cursor: pointer; }
#snd.on { display: block; animation: bl 1s ease-in-out infinite alternate; }
#start { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(4,3,13,.84); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); text-align: center; transition: opacity .5s; cursor: pointer; }
#start.hide { opacity: 0; pointer-events: none; }
#start b { font-size: 30px; letter-spacing: .3em; padding-left: .3em; text-shadow: 0 0 24px rgba(150,130,255,.9); }
#start span { font-size: 12px; letter-spacing: .22em; opacity: .55; line-height: 1.9; }
#start i { font-style: normal; font-size: 15px; font-weight: 800; letter-spacing: .3em; padding: 14px 34px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.7); animation: bl 1.2s ease-in-out infinite alternate; }
@keyframes bl { from { opacity: .5; } to { opacity: 1; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title"></div>
<div id="cta">FOLLOW FOR MORE</div>
<div id="snd">🔊 TAP FOR SOUND</div>
<div id="hud"><div id="num">32</div><div id="unit">SEC</div></div>
<div id="start"><b>REALIGN</b><i>TAP TO START</i><span>SOUND ON · SILENT MODE OFF<br>START SCREEN RECORDING FIRST<br>ONE LOOP = 32 SECONDS</span></div>
<script>
(() => {
'use strict';
// ============================================================
// SETTINGS
// ============================================================
const N = 16;               // number of rings
const LOOP = 32;            // seconds until every dot is back on the line (one perfect loop)
const K0 = 16;              // outer ring makes K0 laps per loop, each next ring one more lap
const FADE = 0.1;           // lower = longer light trails (0.06 long, 0.2 short)
const GLOW = 14;            // on a weak phone try 6 or 0
const HUE_A = 185, HUE_B = 320; // outer ring colour -> inner ring colour (cyan -> magenta)
const BASE_MIDI = 55;       // lowest note (G3)
const SCALE = [0, 2, 4, 7, 9];  // major pentatonic: all notes sound good together
const TITLE_1 = 'THEY START ALIGNED';   // hook (also via URL: ?t1=...&t2=...)
const TITLE_2 = 'WILL THEY MEET AGAIN?';
const WIN_1 = 'ALIGNED AGAIN';
const WIN_2 = 'EVERY 32 SECONDS';
const SOUND = true;

// ============================================================
// SETUP
// ============================================================
const cv = document.getElementById('c'), ctx = cv.getContext('2d', { alpha: false });
const numEl = document.getElementById('num'), hud = document.getElementById('hud'), titleEl = document.getElementById('title'), ctaEl = document.getElementById('cta'), sndEl = document.getElementById('snd'), startEl = document.getElementById('start');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), TAU = Math.PI * 2, BG = '4,3,13';
const K = Array.from({ length: N }, (_, i) => K0 + i);
const hue = i => HUE_A + (HUE_B - HUE_A) * i / (N - 1);
const col = (i, l = 62, a = 1) => `hsla(${hue(i).toFixed(0)},95%,${l}%,${a})`;
let W = 0, H = 0, dpr = 1, CX = 0, CY = 0, R = 0, sp = 0, dotR = 0;
const ringR = i => R * (1 - i * 0.78 / (N - 1));

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.floor(innerWidth * dpr); H = Math.floor(innerHeight * dpr); cv.width = W; cv.height = H;
  CX = W / 2; CY = H * 0.46; R = Math.min(W * 0.44, H * 0.30); // arena sits high: Shorts UI covers the bottom ~20%
  sp = R * 0.78 / (N - 1); dotR = clamp(sp * 0.34, 2.2 * dpr, 6 * dpr);
  hud.style.fontSize = Math.max(12, R / dpr * 0.17) + 'px'; hud.style.top = (CY / dpr) + 'px';
  const fs = Math.max(13, Math.min(R / dpr * 0.16, innerWidth * 0.07));
  titleEl.style.fontSize = fs + 'px'; titleEl.style.bottom = (innerHeight - (CY - R) / dpr + fs * 1.3) + 'px';
  ctaEl.style.fontSize = Math.max(10, fs * 0.5) + 'px'; ctaEl.style.top = ((CY + R) / dpr + fs * 0.9) + 'px';
  ctx.fillStyle = `rgb(${BG})`; ctx.fillRect(0, 0, W, H);
}

// ============================================================
// SOUND — glass: inharmonic partials, bright short attack, tiny tick; drone swells toward the finale
// ============================================================
let ac = null, master, reverbIn, noiseBuf, pad = null;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const noteOf = i => { const j = N - 1 - i; return BASE_MIDI + 12 * Math.floor(j / 5) + SCALE[j % 5]; }; // outer ring = lowest, inner = highest

function initAudio() {
  if (!SOUND) return;
  try {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    if (ac) { if (ac.state !== 'running') ac.resume(); return; }
    ac = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' }); ac.resume();
    const sb = ac.createBufferSource(); sb.buffer = ac.createBuffer(1, 1, 22050); sb.connect(ac.destination); sb.start(0); // iOS unlock inside the tap
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.knee.value = 18;
    master = ac.createGain(); master.gain.value = 0.85; master.connect(comp); comp.connect(ac.destination);
    const len = Math.floor(ac.sampleRate * 2.6), ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    const conv = ac.createConvolver(); conv.buffer = ir; reverbIn = ac.createGain(); reverbIn.connect(conv);
    const rv = ac.createGain(); rv.gain.value = 0.45; conv.connect(rv); rv.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    const o1 = ac.createOscillator(), o2 = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain(); // drone: G2 + D3
    o1.type = 'triangle'; o2.type = 'sine'; o1.frequency.value = 98; o2.frequency.value = 147; f.type = 'lowpass'; f.frequency.value = 300; g.gain.value = 0;
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(master); o1.start(); o2.start(); pad = { f, g };
    const o = ac.createOscillator(), og = ac.createGain(); o.frequency.value = 1320; og.gain.setValueAtTime(0.0001, ac.currentTime); og.gain.exponentialRampToValueAtTime(0.14, ac.currentTime + 0.01); og.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.45);
    o.connect(og); og.connect(master); o.start(); o.stop(ac.currentTime + 0.5);
  } catch (e) { ac = null; }
}
function updatePad(p) { // p = 0..1 position inside the loop
  if (!pad || !ac || ac.state !== 'running') return;
  const T = ac.currentTime;
  pad.g.gain.setTargetAtTime(started ? 0.012 + 0.07 * p * p : 0, T, p < 0.02 ? 0.04 : 0.3); pad.f.frequency.setTargetAtTime(300 + 2600 * p * p, T, 0.2);
}
function tick(t, v) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf; const hp = ac.createBiquadFilter(), g = ac.createGain();
  hp.type = 'highpass'; hp.frequency.value = 4500; g.gain.setValueAtTime(0.09 * v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.025);
  s.connect(hp); hp.connect(g); g.connect(master); s.start(t, Math.random()); s.stop(t + 0.03);
}
const PARTIALS = [[1, 1, 1], [2.76, 0.5, 0.55], [5.4, 0.26, 0.3]]; // [ratio, gain, decay share] — glass is inharmonic
function glass(t, midi, vel, pan) {
  const f = mtof(midi), dur = clamp(1.6 - (midi - 55) / 34, 0.5, 1.4), g = ac.createGain();
  PARTIALS.forEach(([m, a, d]) => {
    if (f * m > 14000) return;
    const o = ac.createOscillator(), e = ac.createGain(), dd = dur * d + 0.05; o.type = 'sine'; o.frequency.value = f * m;
    e.gain.setValueAtTime(0.0001, t); e.gain.exponentialRampToValueAtTime((0.05 + 0.2 * vel) * a, t + 0.002); e.gain.exponentialRampToValueAtTime(0.0001, t + dd);
    o.connect(e); e.connect(g); o.start(t); o.stop(t + dd + 0.05);
  });
  let out = g; if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = pan; g.connect(p); out = p; }
  out.connect(master); const r = ac.createGain(); r.gain.value = 0.8; out.connect(r); r.connect(reverbIn);
}
function riser(t, len) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true; const bp = ac.createBiquadFilter(), g = ac.createGain(); bp.type = 'bandpass'; bp.Q.value = 2;
  bp.frequency.setValueAtTime(500, t); bp.frequency.exponentialRampToValueAtTime(9000, t + len); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.22, t + len); g.gain.linearRampToValueAtTime(0.0001, t + len + 0.05);
  s.connect(bp); bp.connect(g); g.connect(master); s.start(t); s.stop(t + len + 0.1);
}
function sound(i) { if (ac && ac.state === 'running') { const t = ac.currentTime + 0.008; glass(t, noteOf(i), 0.5 + 0.3 * (1 - i / N), (i / (N - 1) - 0.5) * 0.6); tick(t, 1); } else if (ac) ac.resume(); }
function chord() { // every dot is back on the line: all 16 notes as a fast glass arpeggio + sub boom
  if (!ac || ac.state !== 'running') return; const t = ac.currentTime + 0.01;
  for (let i = 0; i < N; i++) glass(t + i * 0.028, noteOf(i), 0.95, (i / (N - 1) - 0.5) * 0.8);
  const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(32, t + 1.4);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.6, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8); o.connect(g); g.connect(master); o.start(t); o.stop(t + 1.9);
}

// ============================================================
// STATE
// ============================================================
let started = false, tt = 0, last = 0, cyc = 0, cycles = 0, riserCyc = -1, winShown = null, burst = 0, shock = -1, numShown = '';
const cnt = new Array(N).fill(0), lit = new Array(N).fill(0), pings = [];

function setTitle(win) {
  const q = new URLSearchParams(location.search), a = win ? WIN_1 : (q.get('t1') || TITLE_1), b = win ? WIN_2 : (q.get('t2') || TITLE_2);
  titleEl.innerHTML = a + '<br><em>' + b + '</em>'; titleEl.classList.toggle('win', !!win); titleEl.classList.toggle('off', !started); ctaEl.classList.toggle('on', !!win); winShown = win;
}
function pulse(i) { lit[i] = 1; if (pings.length < 40) pings.push({ i, life: 1 }); }
function finale() { for (let i = 0; i < N; i++) { lit[i] = 1; pings.push({ i, life: 1 }); } burst = 1; shock = 0; chord(); }

// ============================================================
// DRAWING
// ============================================================
function drawRings(dt) {
  ctx.shadowBlur = 0;
  for (let i = 0; i < N; i++) { // each ring lights up when its dot crosses the line
    lit[i] *= Math.pow(0.01, dt);
    ctx.strokeStyle = col(i, 60); ctx.globalAlpha = 0.05 + 0.55 * lit[i]; ctx.lineWidth = (1 + 1.4 * lit[i]) * dpr;
    ctx.beginPath(); ctx.arc(CX, CY, ringR(i), 0, TAU); ctx.stroke();
  }
  // glass glints on the outer ring
  ctx.strokeStyle = '#fff'; ctx.lineCap = 'round'; ctx.lineWidth = 2 * dpr; ctx.globalAlpha = 0.35; ctx.beginPath(); ctx.arc(CX, CY, R - 3 * dpr, -2.75, -1.85); ctx.stroke();
  ctx.globalAlpha = 0.12; ctx.beginPath(); ctx.arc(CX, CY, R - 3 * dpr, 0.5, 1.1); ctx.stroke(); ctx.globalAlpha = 1;
}
function drawPings(dt) { // a ring of light spreads outward from every crossing
  for (let k = pings.length - 1; k >= 0; k--) {
    const p = pings[k]; p.life -= dt * 2.2; if (p.life <= 0) { pings.splice(k, 1); continue; }
    ctx.strokeStyle = col(p.i, 70); ctx.globalAlpha = p.life * 0.5; ctx.lineWidth = 1.3 * dpr;
    ctx.beginPath(); ctx.arc(CX, CY, ringR(p.i) + sp * (0.3 + 3.2 * (1 - p.life)), 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = clamp((ts - last) / 1000, 0.001, 0.05); last = ts;
  ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  ctx.fillStyle = `rgba(${BG},${FADE})`; ctx.fillRect(0, 0, W, H); // translucent fill = light trails
  if (started) tt += dt;
  const c = Math.floor(tt / LOOP), p = (tt - c * LOOP) / LOOP, ph = new Array(N);
  let align = 0;
  for (let i = 0; i < N; i++) { const x = K[i] * tt / LOOP; ph[i] = x - Math.floor(x); align += Math.cos(TAU * ph[i]); }
  align /= N; // 1 = all dots on one line
  if (started) {
    if (c !== cyc) { cyc = c; cycles++; for (let i = 0; i < N; i++) cnt[i] = Math.floor(K[i] * tt / LOOP); finale(); }
    else for (let i = 0; i < N; i++) { const n = Math.floor(K[i] * tt / LOOP); if (n !== cnt[i]) { cnt[i] = n; pulse(i); sound(i); } }
    if (riserCyc !== c && p > 1 - 2.6 / LOOP) { riserCyc = c; if (ac && ac.state === 'running') riser(ac.currentTime + 0.02, 2.6 * (1 - 0.0)); }
  }
  burst *= Math.pow(0.004, dt);
  drawRings(dt);
  // the line they must all cross; it glows as the dots approach alignment
  const near = Math.pow(Math.max(0, (align - 0.55) / 0.45), 2), la = clamp(0.1 + 0.75 * near + 0.4 * burst, 0, 1);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.3 * dpr; ctx.globalAlpha = la; ctx.shadowColor = '#fff'; ctx.shadowBlur = 10 * dpr * la;
  ctx.beginPath(); ctx.moveTo(CX, CY - ringR(N - 1) * 0.55); ctx.lineTo(CX, CY - R - 12 * dpr); ctx.stroke(); ctx.shadowBlur = 0;
  // ribbon through all dots: shows the spiral arm; it snaps straight at the finale
  ctx.strokeStyle = 'rgba(190,170,255,1)'; ctx.globalAlpha = 0.1 + 0.25 * near; ctx.lineWidth = 1 * dpr; ctx.lineJoin = 'round'; ctx.beginPath();
  for (let i = 0; i < N; i++) { const a = -Math.PI / 2 + TAU * ph[i], r = ringR(i), x = CX + Math.cos(a) * r, y = CY + Math.sin(a) * r; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke(); ctx.globalAlpha = 1;
  // dots
  for (let i = 0; i < N; i++) {
    const a = -Math.PI / 2 + TAU * ph[i], r = ringR(i), x = CX + Math.cos(a) * r, y = CY + Math.sin(a) * r, d = dotR * (1 + 0.7 * lit[i]);
    ctx.shadowColor = col(i); ctx.shadowBlur = GLOW * dpr * (1 + lit[i]); ctx.fillStyle = col(i, 64); ctx.beginPath(); ctx.arc(x, y, d, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(x, y, d * 0.42, 0, TAU); ctx.fill();
  }
  drawPings(dt);
  if (shock >= 0) { shock += dt * R * 3.2; const a = 1 - shock / (R * 2.3); if (a <= 0) shock = -1; else { ctx.strokeStyle = '#fff'; ctx.globalAlpha = a * 0.8; ctx.lineWidth = (2 + 6 * a) * dpr; ctx.beginPath(); ctx.arc(CX, CY, shock, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1; } }
  if (burst > 0.01) { ctx.globalAlpha = burst * 0.35; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  cv.style.transform = `scale(${(1 + 0.018 * burst).toFixed(4)})`;
  // countdown in the centre + win text for the first 2.4 s after each realignment
  const s = String(started ? Math.max(1, Math.ceil(LOOP - p * LOOP)) : LOOP); if (s !== numShown) { numShown = s; numEl.textContent = s; }
  numEl.style.color = `hsl(${(HUE_A + (HUE_B - HUE_A) * p).toFixed(0)},90%,70%)`;
  const win = started && cycles > 0 && p * LOOP < 2.4; if (win !== winShown) setTitle(win);
  updatePad(p);
}

function begin() {
  if (started) return; started = true; initAudio();
  try { const el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el); } catch (e) {}
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
  startEl.classList.add('hide'); tt = 0; cyc = 0; cycles = 0; riserCyc = -1; cnt.fill(0); setTitle(false);
  finale(); // the loop opens on the full chord: all dots start on the line
}
startEl.addEventListener('click', begin);
startEl.addEventListener('touchend', e => { e.preventDefault(); begin(); }, { passive: false });
function wake() {
  if (!SOUND) return;
  try { if (!ac) initAudio(); else if (ac.state !== 'running') { ac.resume(); const sb = ac.createBufferSource(); sb.buffer = ac.createBuffer(1, 1, 22050); sb.connect(ac.destination); sb.start(0); } } catch (e) {}
}
['touchend', 'click', 'mouseup', 'keydown'].forEach(ev => addEventListener(ev, wake, true));
sndEl.addEventListener('click', wake);
setInterval(() => { sndEl.classList.toggle('on', started && SOUND && (!ac || ac.state !== 'running')); }, 600);
document.addEventListener('visibilitychange', () => { if (!document.hidden && ac && ac.state !== 'running') ac.resume(); });
addEventListener('resize', resize);
resize(); setTitle(false); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
