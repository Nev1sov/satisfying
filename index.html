<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Double Pendulum</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;font-family:"Avenir Next","Helvetica Neue",Inter,system-ui,Arial,sans-serif}
#wrap{position:fixed;inset:0;display:grid;place-items:center}canvas{display:block}
#start{position:fixed;inset:0;z-index:10;background:rgba(7,9,13,.985);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;text-align:center;color:#edf1f5;transition:opacity .55s ease}
#start.hide{opacity:0;pointer-events:none}
#start h1{font-size:clamp(26px,7vw,42px);font-weight:500;letter-spacing:.24em;line-height:1.2}
#go{padding:15px 34px;font-size:12px;font-weight:600;letter-spacing:.22em;color:#e9eef2;background:transparent;border:1px solid rgba(220,230,240,.42);border-radius:2px;cursor:pointer}
#go:active{background:rgba(220,230,240,.12)}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="start"><h1>50 PENDULUMS</h1><button id="go">START</button></div>
<script>
(() => {
'use strict';
/* ================= SETTINGS ================= */
const GH = 48;                    // 48 intermediate + 2 reference pendulums = 50 total
const EPS_DEG = 0.001;            // starting angle difference between A and B
const TH1 = 2.4, TH2 = 2.9;       // starting angles (rad). With these, the difference grows x10 about every 1 s
const SPEED = 0.7;                // 1 = real time, lower = slow motion (the whole story is ~10 s at 0.7)
const TEND = 26, INTRO = 2.6, END_HOLD = 7;   // seconds: run length, hook length, end card length
const TXT = { T1: 'INITIAL CONDITIONS', T2: 'DIVERGENCE OF MOTION', T3: 'Δθ = 0.001°', TITLE: '50-PENDULUM CHAOTIC SYSTEM', E1: 'SMALL PERTURBATION.', E2: 'LARGE DIVERGENCE.', E3: 'SENSITIVE DEPENDENCE ON INITIAL CONDITIONS', CTA: 'OBSERVE THE SYSTEM' };
/* ============================================ */

const $ = id => document.getElementById(id), clamp = (v, a, b) => Math.min(b, Math.max(a, v)), lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2, W = 1080, H = 1920, FF = '"Avenir Next","Helvetica Neue",Inter,"Segoe UI",Arial,sans-serif';
const G = 9.81, L = 205, PX = 540, PY = 880, N = GH + 2, EPS = EPS_DEG * Math.PI / 180, HMAX = 1 / 240;
const CA = '#d7e0e8', CB = '#a7b2bd', MU = '#788794';
const TRACE = Array.from({length:N}, (_,i) => `hsl(${(i * 137.508 + 18) % 360} 68% 66%)`);
const cv = $('cv'), ctx = cv.getContext('2d', { alpha: false }); let K = 1, bgc, pers, pg, gradG;

function layout() {
  const vv = window.visualViewport, vw = vv ? vv.width : innerWidth, vh = vv ? vv.height : innerHeight, s = Math.min(vw / W, vh / H), dpr = Math.min(devicePixelRatio || 1, 2);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr); K = cv.width / W;
  const mk = () => { const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; const g = c.getContext('2d'); g.setTransform(K, 0, 0, K, 0, 0); return [c, g]; };
  let [c, g] = mk();
  const gr = g.createLinearGradient(0, 0, W * .18, H);
  gr.addColorStop(0, '#080b10'); gr.addColorStop(.52, '#10151c'); gr.addColorStop(1, '#07090d');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const v = g.createRadialGradient(PX, 850, 120, PX, 850, 1180);
  v.addColorStop(0, 'rgba(25,34,44,.12)'); v.addColorStop(1, 'rgba(0,0,0,.42)');
  g.fillStyle = v; g.fillRect(0, 0, W, H); bgc = c;
  [pers, pg] = mk(); pg.lineCap = 'round'; pg.lineJoin = 'round';
  gradG = ctx.createLinearGradient(140, 0, 1020, 0); gradG.addColorStop(0, CA); gradG.addColorStop(1, CB);
}
let rz; const onR = () => { clearTimeout(rz); rz = setTimeout(layout, 100); }; addEventListener('resize', onR); addEventListener('orientationchange', onR);

/* ---------- physics: exact double pendulum (Lagrangian), RK4 with fixed small steps, no allocations ---------- */
const ST = new Float64Array(N * 4), K1 = new Float64Array(4), K2 = new Float64Array(4), K3 = new Float64Array(4), K4 = new Float64Array(4);
function der(a, b, w1, w2, o) { const d = a - b, c = Math.cos(d), den = 2 - Math.cos(2 * d), sd = Math.sin(d); o[0] = w1; o[1] = w2; o[2] = (-3 * G * Math.sin(a) - G * Math.sin(a - 2 * b) - 2 * sd * (w2 * w2 + w1 * w1 * c)) / den; o[3] = (2 * sd * (2 * w1 * w1 + 2 * G * Math.cos(a) + w2 * w2 * c)) / den; }
function rk4(i, h) {
  const o = i * 4, a = ST[o], b = ST[o + 1], w1 = ST[o + 2], w2 = ST[o + 3], h2 = h / 2;
  der(a, b, w1, w2, K1); der(a + h2 * K1[0], b + h2 * K1[1], w1 + h2 * K1[2], w2 + h2 * K1[3], K2); der(a + h2 * K2[0], b + h2 * K2[1], w1 + h2 * K2[2], w2 + h2 * K2[3], K3); der(a + h * K3[0], b + h * K3[1], w1 + h * K3[2], w2 + h * K3[3], K4);
  for (let j = 0; j < 4; j++) ST[o + j] += h / 6 * (K1[j] + 2 * K2[j] + 2 * K3[j] + K4[j]);
}
const wrap = x => { x = (x + Math.PI) % TAU; if (x < 0) x += TAU; return x - Math.PI; };
const TL = 900, TR = new Float32Array(N * TL * 2), head = new Int32Array(N), cnt = new Int32Array(N);
const tipX = i => { const o = i * 4; return PX + L * (Math.sin(ST[o]) + Math.sin(ST[o + 1])); }, tipY = i => { const o = i * 4; return PY + L * (Math.cos(ST[o]) + Math.cos(ST[o + 1])); };
function pushTail(i) { const k = (i * TL + head[i]) * 2; TR[k] = tipX(i); TR[k + 1] = tipY(i); head[i] = (head[i] + 1) % TL; if (cnt[i] < TL) cnt[i]++; }
function resetSim() { for (let i = 0; i < N; i++) { const o = i * 4; ST[o] = TH1 + (i === 0 ? 0 : i === 1 ? EPS : EPS * (i - 1) / (GH + 1)); ST[o + 1] = TH2; ST[o + 2] = 0; ST[o + 3] = 0; head[i] = 0; cnt[i] = 0; } for (let i = 0; i < N; i++) pushTail(i); }
const sepDeg = () => Math.hypot(wrap(ST[0] - ST[4]), wrap(ST[1] - ST[5])) * 180 / Math.PI;

/* ---------- audio: the two pendulums are two voices; they play in unison until chaos splits them ---------- */
let ac, master, rev, noise, pad, V = [null, null]; const SEMI = [0, 3, 5, 7, 10];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12), noteM = i => 50 + SEMI[i % 5] + 12 * Math.floor(i / 5);
function initAudio() {
  ac = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' }); try { navigator.audioSession.type = 'playback'; } catch (e) {}
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 5; comp.attack.value = 0.003; comp.release.value = 0.2; master = ac.createGain(); master.gain.value = 0.9; master.connect(comp); comp.connect(ac.destination);
  const len = (ac.sampleRate * 2.6) | 0, ir = ac.createBuffer(2, len, ac.sampleRate); for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5); }
  const cn = ac.createConvolver(); cn.buffer = ir; rev = ac.createGain(); rev.gain.value = 0.35; rev.connect(cn); cn.connect(master);
  noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); { const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 300; const pg_ = ac.createGain(); pg_.gain.value = 0.0001; lp.connect(pg_); pg_.connect(master); pg_.connect(rev);
  [73.4, 110, 146.8].forEach((f, i) => { const o = ac.createOscillator(); o.type = i ? 'triangle' : 'sine'; o.frequency.value = f * (1 + i * 0.002); o.connect(lp); o.start(); }); pad = { lp, g: pg_ };
  for (let k = 0; k < 2; k++) { const o = ac.createOscillator(), o2 = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain(), p = ac.createStereoPanner ? ac.createStereoPanner() : null; o.type = 'triangle'; o2.type = 'sine'; f.type = 'lowpass'; f.frequency.value = 1700; g.gain.value = 0.0001; o.connect(f); o2.connect(f); f.connect(g); if (p) { p.pan.value = k ? 0.35 : -0.35; g.connect(p); p.connect(master); p.connect(rev); } else { g.connect(master); } o.start(); o2.start(); V[k] = { o, o2, g, idx: -1 }; }
  const s = ac.createBufferSource(); s.buffer = ac.createBuffer(1, 1, 22050); s.connect(ac.destination); s.start(0); if (ac.state === 'suspended') ac.resume();
}
function osc(type, f0, f1, t, dur, vol, wet) { const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.7); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.008, dur / 4)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g); g.connect(master); if (wet) g.connect(rev); o.start(t); o.stop(t + dur + 0.05); }
function pluck(m, v, pan) {
  const t = ac.currentTime + 0.01, f = mtof(m), o = ac.createOscillator(), o2 = ac.createOscillator(), lp = ac.createBiquadFilter(), g = ac.createGain(); o.type = 'sawtooth'; o2.type = 'sine'; o.frequency.value = f; o2.frequency.value = f / 2;
  lp.type = 'lowpass'; lp.Q.value = 2; lp.frequency.setValueAtTime(3200, t); lp.frequency.exponentialRampToValueAtTime(420, t + 0.25); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
  o.connect(lp); o2.connect(lp); lp.connect(g); let out = g; if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = pan; g.connect(p); out = p; } out.connect(master); out.connect(rev); o.start(t); o.stop(t + 0.55); o2.start(t); o2.stop(t + 0.55);
}
const bell = (m, d, v) => { const t = ac.currentTime + (d || 0.01), f = mtof(m); osc('triangle', f, f, t, 1.6, v, 1); osc('sine', f * 2.01, f * 2.01, t, 0.8, v * 0.35, 1); osc('sine', f * 3.5, f * 3.5, t, 0.3, v * 0.15, 1); };
function updateVoices(prog) {
  if (!ac) return; const t = ac.currentTime; pad.g.gain.setTargetAtTime(S.phase === 'run' ? 0.03 + 0.1 * prog : 0.025, t, 0.2); pad.lp.frequency.setTargetAtTime(260 + 2600 * prog * prog, t, 0.2);
  for (let k = 0; k < 2; k++) { const o = k * 4, b = ST[o + 1], idx = clamp(Math.floor((Math.sin(b) * 0.5 + 0.5) * 11.99), 0, 11), v = V[k], sp = clamp(Math.hypot(ST[o + 2], ST[o + 3]) / 12, 0, 1); if (idx !== v.idx) { v.idx = idx; const f = mtof(noteM(idx) + 12); v.o.frequency.setTargetAtTime(f, t, 0.035); v.o2.frequency.setTargetAtTime(f * 2.005, t, 0.035); } v.g.gain.setTargetAtTime(S.phase === 'run' ? 0.012 + 0.03 * sp : 0.0001, t, 0.05); }
}

/* ---------- state ---------- */
let S = null, last = 0, ema = 1 / 60, dtS = 1 / 60, quality = 2, slowT = 0; const THR = [0.01, 0.1, 1, 10, 60], NOTES = ['STILL IDENTICAL', 'NO ONE CAN TELL', 'THEY START TO SPLIT', 'THE SPLIT IS VISIBLE', 'COMPLETELY DIFFERENT'], MUL = ['×10', '×100', '×1,000', '×10,000', '×60,000'];
const PT = new Float32Array(2 * 24), prevSign = [0, 0], lastPl = [0, 0], gT = new Float32Array(900), gV = new Float32Array(900);
const HA = [], HB = [], GC = [];
for (let c = 0; c < 14; c++) { const a = 0.035 + 0.28 * Math.pow(c / 13, 1.35); HA.push(`rgba(225,232,236,${a})`); HB.push(`rgba(155,170,180,${a})`); }
for (let k = 0; k < GH; k++) GC.push([TRACE[k + 2], TRACE[k + 2]]);
function startRun() { S = { phase: 'intro', pt: 0, T: 0, clock: 0, th: [0, 0, 0, 0, 0], t001: -1, t1: -1, gN: 0, gLast: -1, toast: null, finalSep: 0, flash: 0 }; resetSim(); pg.clearRect(0, 0, W, H); prevSign[0] = prevSign[1] = 0; }
const fmtDeg = d => d < 0.1 ? d.toFixed(4) : d < 1 ? d.toFixed(3) : d < 10 ? d.toFixed(2) : d < 100 ? d.toFixed(1) : Math.round(d).toString();
function update(dt) {
  S.clock += dt; S.pt += dt; S.flash *= Math.pow(0.01, dt); if (S.toast && (S.toast.age += dt) > S.toast.dur) S.toast = null; let prog = 0;
  if (S.phase === 'intro') { if (S.pt >= INTRO) { S.phase = 'run'; S.pt = 0; S.flash = 1; if (ac) { osc('sine', 120, 38, ac.currentTime, 0.7, 0.8, 1); const s = ac.createBufferSource(), b = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime; s.buffer = noise; b.type = 'bandpass'; b.frequency.setValueAtTime(300, t); b.frequency.exponentialRampToValueAtTime(5000, t + 0.6); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.5); g.gain.linearRampToValueAtTime(0.0001, t + 0.62); s.connect(b); b.connect(g); g.connect(master); s.start(t); s.stop(t + 0.7); } } }
  else {
    if (S.phase === 'run') S.T += dt; const sim = dt * SPEED, n = Math.max(1, Math.ceil(sim / HMAX)), h = sim / n; let np = 0;
    for (let k = 0; k < n; k++) {
      for (let i = 0; i < N; i++) { rk4(i, h); pushTail(i); }
      if (np < 24) { PT[np * 2] = tipX(0); PT[np * 2 + 1] = tipY(0); np++; }
      if (ac && S.phase === 'run') for (let q = 0; q < 2; q++) { const o = q * 4, sg = Math.sin(ST[o]) >= 0 ? 1 : -1; if (prevSign[q] && sg !== prevSign[q] && S.T - lastPl[q] > 0.07) { lastPl[q] = S.T; const w = Math.abs(ST[o + 3]), idx = clamp(Math.floor(w * 0.9), 0, 9); pluck(noteM(idx) + 12, 0.05 + 0.05 * clamp(w / 12, 0, 1), q ? 0.45 : -0.45); } prevSign[q] = sg; }
    }
    // Every pendulum paints its own persistent, individually colored trajectory.
    pg.globalCompositeOperation = 'source-over';
    for (let q = 0; q < N; q++) {
      pg.strokeStyle = TRACE[q]; pg.globalAlpha = q < 2 ? .88 : .66;
      pg.lineWidth = q < 2 ? 2.8 : 2.15; pg.beginPath();
      const o = (head[q] - np + TL * 4) % TL;
      for (let j = 0; j < np; j++) {
        const kk = (q * TL + (o + j) % TL) * 2;
        j ? pg.lineTo(TR[kk], TR[kk + 1]) : pg.moveTo(TR[kk], TR[kk + 1]);
      }
      pg.stroke();
    }
    pg.globalAlpha = 1;
    const d = sepDeg(); prog = clamp(Math.log10(Math.max(d, 0.001) / 0.001) / 5, 0, 1);
    for (let i = 0; i < 5; i++) if (!S.th[i] && d >= THR[i]) { S.th[i] = 1; if (i === 0) S.t001 = S.T * SPEED; if (i === 2) S.t1 = S.T * SPEED; if (ac) { bell([74, 77, 79, 81, 84][i], 0.01, 0.2); if (i > 1) bell([62, 69, 74, 77, 81][i] , 0.05, 0.1); } if (i === 4) S.flash = 0.6; }
    if (S.T - S.gLast >= 0.05 && S.gN < 900) { gT[S.gN] = S.T; gV[S.gN] = d; S.gN++; S.gLast = S.T; }
    if (S.phase === 'run' && S.T >= TEND) { S.phase = 'end'; S.pt = 0; S.finalSep = d; S.flash = 0.8; if (ac) [62, 69, 74, 77, 81, 86].forEach((m, i) => bell(m, 0.05 + i * 0.09, 0.16)); }

  }

}

/* ---------- drawing ---------- */
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function txt(s, x, y, size, color, o) {
  o = o || {}; ctx.font = `${o.w || 900} ${size}px ${FF}`; if (o.maxW) { const w = ctx.measureText(s).width; if (w > o.maxW) { size *= o.maxW / w; ctx.font = `${o.w || 900} ${size}px ${FF}`; } }
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle'; ctx.globalAlpha = o.a == null ? 1 : o.a; ctx.lineJoin = 'round';
  if (o.stroke) { ctx.lineWidth = o.stroke; ctx.strokeStyle = 'rgba(2,5,16,.9)'; ctx.strokeText(s, x, y); } ctx.fillStyle = color; ctx.fillText(s, x, y); ctx.globalAlpha = 1;
}
function tail(i, n, chunks, styles) {
  n = Math.min(n, cnt[i]); if (n < 2) return; const base = head[i] - n, per = (n - 1) / chunks;
  for (let c = 0; c < chunks; c++) { const a = Math.floor(c * per), b = Math.floor((c + 1) * per); ctx.strokeStyle = styles[Math.floor(c * styles.length / chunks)]; ctx.beginPath(); for (let j = a; j <= b; j++) { const k = (i * TL + ((base + j) % TL + TL) % TL) * 2; j === a ? ctx.moveTo(TR[k], TR[k + 1]) : ctx.lineTo(TR[k], TR[k + 1]); } ctx.stroke(); }
}
function arms(i, col, wd) { const o = i * 4, x1 = PX + L * Math.sin(ST[o]), y1 = PY + L * Math.cos(ST[o]), x2 = x1 + L * Math.sin(ST[o + 1]), y2 = y1 + L * Math.cos(ST[o + 1]); ctx.strokeStyle = col; ctx.lineWidth = wd; ctx.beginPath(); ctx.moveTo(PX, PY); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); return [x1, y1, x2, y2]; }
function bobs(p, col) { ctx.fillStyle = '#202a31'; ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(p[0], p[1], 10, 0, TAU); ctx.fill(); ctx.stroke(); ctx.shadowColor = col; ctx.shadowBlur = 0; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(p[2], p[3], 15, 0, TAU); ctx.fill(); ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p[2], p[3], 5.5, 0, TAU); ctx.fill(); }
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bgc, 0, 0);
  ctx.setTransform(K, 0, 0, K, 0, 0); ctx.drawImage(pers, 0, 0, W, H);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  // Fine, restrained rods make the 50 individual systems readable without clutter.
  for (let i = 0; i < N; i++) {
    const o = i * 4;
    const x1 = PX + L * Math.sin(ST[o]), y1 = PY + L * Math.cos(ST[o]);
    const x2 = x1 + L * Math.sin(ST[o + 1]), y2 = y1 + L * Math.cos(ST[o + 1]);
    ctx.globalAlpha = i < 2 ? .58 : .20;
    ctx.strokeStyle = TRACE[i]; ctx.lineWidth = i < 2 ? 2.2 : 1.25;
    ctx.beginPath(); ctx.moveTo(PX, PY); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.globalAlpha = i < 2 ? .95 : .78;
    ctx.fillStyle = TRACE[i]; ctx.beginPath(); ctx.arc(x2, y2, i < 2 ? 5.2 : 3.2, 0, TAU); ctx.fill();

  ctx.fillStyle = '#dce3e9'; ctx.beginPath(); ctx.arc(PX, PY, 4.5, 0, TAU); ctx.fill();
}

function frame(ts) {
  requestAnimationFrame(frame); let dt = clamp((ts - last) / 1000, 0.001, 0.05); last = ts; ema = lerp(ema, dt, 0.05); dtS = lerp(dtS, dt, 0.35);
  if (ema > 0.022) { slowT += dt; if (slowT > 1 && quality > 1) quality = 1; } else slowT = Math.max(0, slowT - dt * 0.5);
  if (!S) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#04050f'; ctx.fillRect(0, 0, cv.width, cv.height); return; } update(dtS); draw();
}
function begin() {
  try { initAudio(); } catch (e) { console.error(e); } try { const el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el); } catch (e) {} try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
  $('start').classList.add('hide'); startRun();
}
$('go').addEventListener('click', begin); document.addEventListener('visibilitychange', () => { if (!document.hidden && ac && ac.state === 'suspended') ac.resume(); });
layout(); startRun(); requestAnimationFrame(frame);
})();
</script>
