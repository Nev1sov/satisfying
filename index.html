<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#02030c">
<title>Speed Ball</title>
<style>
  html, body { margin: 0; height: 100%; background: #02030c; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; cursor: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; color: #fff; font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; white-space: nowrap; }
  #num { font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  #unit { font-weight: 700; font-size: .5em; letter-spacing: .5em; padding-left: .5em; margin-top: .35em; opacity: .42; }   /* KM/H — полупрозрачный */
  #note { font-weight: 700; letter-spacing: .3em; padding-left: .3em; margin-top: 1.1em; opacity: 0; transition: opacity .6s; font-size: .36em; }
  #hud.light #note { opacity: .5; }
  #hud.light #num { animation: pulse .45s ease-in-out infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.04); } }
  #start { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(2,3,12,.82); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); color: #fff; font-family: -apple-system, "Segoe UI", Arial, sans-serif; text-align: center; transition: opacity .5s; cursor: pointer; }
  #start.hide { opacity: 0; pointer-events: none; }
  #start b { font-size: 30px; letter-spacing: .3em; padding-left: .3em; text-shadow: 0 0 24px rgba(110,150,255,.9); }
  #start span { font-size: 12px; letter-spacing: .22em; opacity: .55; line-height: 1.9; }
  #start i { font-style: normal; font-size: 15px; font-weight: 800; letter-spacing: .3em; padding: 14px 34px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.7); animation: bl 1.2s ease-in-out infinite alternate; }
  @keyframes bl { from { opacity: .5; } to { opacity: 1; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="num">50</div><div id="unit">KM/H</div><div id="note">SPEED OF LIGHT</div></div>
<div id="start"><b>SPEED BALL</b><i>TAP TO START</i><span>SOUND ON · SILENT MODE OFF<br>START SCREEN RECORDING FIRST</span></div>

<script>
(() => {
'use strict';

// ============================================================
//  SETTINGS — change the values here
// ============================================================
const START_SPEED    = 50;       // ← STARTING SPEED, km/h (try 20, 100, 300 ...)
const MULTIPLIER     = 1.06;     // ← SPEED MULTIPLIER on EVERY wall hit
                                 //   1.03 = slower & longer, 1.06 = default, 1.10 = fast, 1.25 = very fast
const MAX_SPEED      = 1000000;  // "speed of light": the ball turns pure white and goes crazy
const RESTART_DELAY  = 3.0;      // seconds of the "light speed" finale before the game restarts

// How km/h turns into on-screen speed:  px/s = START_PX * R * (km/h / START_SPEED) ^ SPEED_EXPONENT
// 1.0 = strictly proportional (honest, but near the end it is thousands of hits per second)
// 0.4 = gentle: you can still see and hear the acceleration. With these defaults the build-up takes ~27 s.
// Want it faster?  raise START_PX (e.g. 4.0)  or  raise SPEED_EXPONENT (e.g. 0.5).
const SPEED_EXPONENT = 0.4;
const START_PX       = 3.0;      // starting speed in "arena radii per second"
const LIGHT_SPEED    = 6;        // finale: on-screen speed multiplier (how insane the ball flies at light speed)

const TRAIL_FADE     = 0.2;      // frame fade: lower = longer trail (0.1 very long, 0.4 short)
const LIGHT_FADE     = 0.07;     // fade in the finale: lower = the light phantom lasts longer
const GLOW           = 20;       // glow strength (shadowBlur). On a weak phone try 8 or 0
const SOUND          = true;     // pleasant "pluck" on every wall hit
const MAX_HITS_FRAME = 400;      // safety cap: hits simulated per frame (phone never freezes)

// ============================================================
//  SETUP
// ============================================================
const cv = document.getElementById('c'), ctx = cv.getContext('2d', { alpha: false });
const hud = document.getElementById('hud'), numEl = document.getElementById('num'), noteEl = document.getElementById('note'), startEl = document.getElementById('start');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TAU = Math.PI * 2, LOG_RANGE = Math.log(MAX_SPEED / START_SPEED);
const BG = '2,3,12';

let W = 0, H = 0, dpr = 1, CX = 0, CY = 0, R = 0, ballR = 0, RR = 0, V0 = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);                   // >2 is pointless on a phone and costs GPU
  W = Math.floor(innerWidth * dpr); H = Math.floor(innerHeight * dpr);
  cv.width = W; cv.height = H;
  CX = W / 2; CY = H / 2; R = Math.min(W, H) * 0.47;                 // big arena
  ballR = Math.max(3.5 * dpr, R * 0.026);
  RR = R - ballR - 2 * dpr;                                          // the ball CENTER lives on this radius
  V0 = START_PX * R;
  hud.style.fontSize = Math.max(14, R / dpr * 0.2) + 'px';
  fitNumber();
  ctx.fillStyle = `rgb(${BG})`; ctx.fillRect(0, 0, W, H);
}

// ============================================================
//  COLOR: blue → green → yellow → red → white
// ============================================================
const STOPS = [[220, 100, 56], [130, 100, 50], [55, 100, 50], [0, 100, 54], [0, 0, 100]];   // [hue, sat, light]
function colorAt(t) {
  const x = clamp(t, 0, 1) * 4, i = Math.min(3, Math.floor(x)), f = x - i, a = STOPS[i], b = STOPS[i + 1];
  return `hsl(${(a[0] + (b[0] - a[0]) * f).toFixed(0)},${(a[1] + (b[1] - a[1]) * f).toFixed(0)}%,${(a[2] + (b[2] - a[2]) * f).toFixed(0)}%)`;
}
const progress = () => Math.log(Math.max(kmh, START_SPEED) / START_SPEED) / LOG_RANGE;

// ============================================================
//  SOUND — soft pentatonic "plucks" that climb as the ball speeds up
// ============================================================
let ac = null, master, reverbIn, noiseBuf, lastNote = -1, hitCount = 0, riserDone = false;
const SCALE = [0, 2, 4, 7, 9];                                       // major pentatonic: every note sounds good together
function unlockSilentMode() {                                        // iOS: Web Audio is muted by the silent switch unless a media element is "playing"
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  try {
    const n = 800, buf = new ArrayBuffer(44 + n), v = new DataView(buf), w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
    for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
    const a = document.createElement('audio'); a.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })); a.loop = true; a.setAttribute('playsinline', ''); a.volume = 0.01; const pr = a.play(); if (pr && pr.catch) pr.catch(() => {});
  } catch (e) {}
}
function initAudio() {
  if (!SOUND) return;
  try {
    unlockSilentMode();
    if (ac) { if (ac.state !== 'running') ac.resume(); return; }
    ac = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    ac.resume();                                                     // must be called inside the tap, otherwise iOS keeps the context suspended
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.knee.value = 18;
    master = ac.createGain(); master.gain.value = 0.85; master.connect(comp); comp.connect(ac.destination);
    const len = Math.floor(ac.sampleRate * 2.4), ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    const conv = ac.createConvolver(); conv.buffer = ir; reverbIn = ac.createGain(); reverbIn.connect(conv);
    const rv = ac.createGain(); rv.gain.value = 0.38; conv.connect(rv); rv.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    // confirmation "ding" + a tick of silence to fully wake the audio output
    const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(0.0001, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.18, ac.currentTime + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.35); o.connect(g); g.connect(master); o.start(); o.stop(ac.currentTime + 0.4);
  } catch (e) { ac = null; }
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function bell(t, midi, vel, pan) {
  const f = mtof(midi), dur = clamp(1.5 - (midi - 55) / 40, 0.35, 1.3);
  const o1 = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), g2 = ac.createGain();
  o1.type = 'sine'; o2.type = 'triangle'; o1.frequency.value = f; o2.frequency.value = f * 2.005;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.06 + 0.3 * vel, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  g2.gain.value = 0.22; o1.connect(g); o2.connect(g2); g2.connect(g);
  let out = g; if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = pan; g.connect(p); out = p; }
  out.connect(master); const r = ac.createGain(); r.gain.value = 0.7; out.connect(r); r.connect(reverbIn);
  o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
}
function thump(t, v) {
  const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.13);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5 * v, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3); o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.35);
}
function riser(t, len) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true; const bp = ac.createBiquadFilter(), g = ac.createGain(); bp.type = 'bandpass'; bp.Q.value = 2;
  bp.frequency.setValueAtTime(400, t); bp.frequency.exponentialRampToValueAtTime(9000, t + len); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.3, t + len); g.gain.linearRampToValueAtTime(0.0001, t + len + 0.05);
  s.connect(bp); bp.connect(g); g.connect(master); s.start(t); s.stop(t + len + 0.1);
}
function lightChord(t) {
  [57, 64, 69, 73, 76, 81, 88].forEach((m, i) => bell(t + i * 0.04, m, 0.9, (i % 3 - 1) * 0.4));
  const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(32, t + 1.4);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.7, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.0); o.connect(g); g.connect(master); o.start(t); o.stop(t + 2.1);
}
function hitSound(px01) {                                            // called on every wall hit (throttled)
  hitCount++;
  if (!ac) return;
  if (ac.state !== 'running') { ac.resume(); return; }
  const now = ac.currentTime + 0.008, light = state === 'light', gap = light ? 0.04 : 0.05;
  if (now - lastNote < gap) return;
  const t = progress(); let midi;
  if (light) midi = 81 + SCALE[Math.floor(Math.random() * 5)] + (Math.random() < 0.4 ? 12 : 0);       // sparkling top
  else {
    midi = 55 + SCALE[hitCount % 5] + 12 * (Math.floor(hitCount / 5) % 3) + 12 * Math.floor(t * 2.4);
    while (midi > 96) midi -= 12;
  }
  const vel = light ? 0.35 : clamp(0.9 - t * 0.35 - Math.max(0, midi - 84) * 0.02, 0.35, 0.9);
  if (!light && now - lastNote > 0.28) thump(now, 0.7 - 0.4 * t);                                         // soft thud while hits are slow
  bell(now, midi, vel, clamp(px01 * 2 - 1, -0.7, 0.7)); lastNote = now;
}

// ============================================================
//  STATE
// ============================================================
let px, py, dx, dy, kmh, state = 'idle', lightT = 0, flash = 0, last = 0, hudAt = 0, shownLen = 0, started = false, burst = 0;
function reset() {
  const a = Math.random() * TAU, r = Math.random() * RR * 0.5, d = Math.random() * TAU;
  px = Math.cos(a) * r; py = Math.sin(a) * r; dx = Math.cos(d); dy = Math.sin(d);
  kmh = START_SPEED; state = started ? 'run' : 'idle'; lightT = 0; flash = 0; hitCount = 0; riserDone = false; parts.length = 0;
  hud.classList.remove('light'); numEl.style.transform = '';
  ctx.fillStyle = `rgb(${BG})`; ctx.fillRect(0, 0, W, H);
}
const pxSpeed = () => V0 * Math.pow(kmh / START_SPEED, SPEED_EXPONENT) * (state === 'light' ? LIGHT_SPEED : 1);

// small spark particles on each hit (cheap, capped)
const parts = [];
function spark(x, y, nx, ny, col, n) {
  for (let i = 0; i < n && parts.length < 90; i++) { const a = Math.atan2(-ny, -nx) + (Math.random() - 0.5) * 1.8, v = (0.25 + Math.random()) * R * 0.9; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, col }); }
}

// ============================================================
//  PHYSICS — exact time to the wall (no tunnelling at ANY speed)
//  Solve |p + d·v·t| = RR (quadratic) and take the positive root.
//  Move hit-to-hit inside the frame; on each hit: reflect (angle in = angle out) and speed × MULTIPLIER.
// ============================================================
const path = [];                                                     // trajectory vertices of this frame (for the trail)
function simulate(dt) {
  path.length = 0; path.push(px, py);
  let rem = dt, hits = 0, sparkBudget = 3;
  while (rem > 1e-9 && hits < MAX_HITS_FRAME) {
    const v = pxSpeed(), b = (px * dx + py * dy) * v, c = px * px + py * py - RR * RR, a = v * v;
    const tHit = (-b + Math.sqrt(Math.max(0, b * b - a * c))) / a;
    if (tHit >= rem) { px += dx * v * rem; py += dy * v * rem; rem = 0; break; }
    px += dx * v * tHit; py += dy * v * tHit; rem -= tHit;
    const L = Math.hypot(px, py) || 1, nx = px / L, ny = py / L;
    px = nx * RR; py = ny * RR;                                      // snap exactly onto the wall (no error build-up)
    const dot = dx * nx + dy * ny;
    dx -= 2 * dot * nx; dy -= 2 * dot * ny;                          // reflection law
    const n = Math.hypot(dx, dy) || 1; dx /= n; dy /= n;
    if (state === 'run') kmh = Math.min(MAX_SPEED, kmh * MULTIPLIER);
    hits++; flash = Math.min(1, flash + (state === 'light' ? 0.08 : 0.4));
    path.push(px, py);
    hitSound((px / RR + 1) / 2);
    if (sparkBudget > 0 && (state === 'run' || Math.random() < 0.15)) { sparkBudget--; spark(CX + px, CY + py, nx, ny, state === 'light' ? '#fff' : colorAt(progress()), state === 'light' ? 2 : 5); }
    if (state === 'run' && kmh >= MAX_SPEED) { enterLight(); }
  }
  path.push(px, py);
}
function enterLight() {
  state = 'light'; lightT = 0; hud.classList.add('light'); flash = 1; burst = 1;
  if (ac && ac.state === 'running') lightChord(ac.currentTime + 0.02);
}

// ============================================================
//  DRAWING
// ============================================================
function drawArena(col, t, now) {
  ctx.shadowBlur = 0; ctx.lineCap = 'round'; ctx.strokeStyle = col; ctx.beginPath(); ctx.arc(CX, CY, R, 0, TAU);
  ctx.globalAlpha = 0.07 + 0.1 * flash; ctx.lineWidth = 9 * dpr; ctx.stroke();                 // soft halo (cheap, no shadowBlur)
  ctx.globalAlpha = 0.22 + 0.3 * flash; ctx.lineWidth = 3.5 * dpr; ctx.stroke();
  ctx.globalAlpha = 0.95; ctx.lineWidth = 1.5 * dpr; ctx.stroke();
  // fine rotating tick ring just outside the arena
  ctx.globalAlpha = 0.16 + 0.1 * flash; ctx.lineWidth = 1.2 * dpr; ctx.beginPath();
  const rot = now * 0.05, n = 120, r0 = R + 7 * dpr;
  for (let i = 0; i < n; i++) { const a = rot + i * TAU / n, r1 = r0 + (i % 10 === 0 ? 9 : 4) * dpr, ca = Math.cos(a), sa = Math.sin(a); ctx.moveTo(CX + ca * r0, CY + sa * r0); ctx.lineTo(CX + ca * r1, CY + sa * r1); }
  ctx.stroke(); ctx.globalAlpha = 1;
}
function drawBall(col, thin) {
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.shadowColor = col; ctx.shadowBlur = GLOW * dpr * (thin ? 0.8 : 1);
  ctx.strokeStyle = col; ctx.lineWidth = thin ? Math.max(1.2 * dpr, ballR * 0.16) : ballR * 1.3; ctx.globalAlpha = thin ? 0.95 : 0.85;
  ctx.beginPath(); ctx.moveTo(CX + path[0], CY + path[1]);                                    // whole frame trail = ONE path, ONE stroke
  for (let i = 2; i < path.length; i += 2) ctx.lineTo(CX + path[i], CY + path[i + 1]);
  ctx.stroke();
  ctx.globalAlpha = 1; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(CX + px, CY + py, ballR * (thin ? 0.9 : 1), 0, TAU); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(CX + px, CY + py, ballR * 0.45, 0, TAU); ctx.fill();
}
function drawParts(dt) {
  if (!parts.length) return; ctx.globalCompositeOperation = 'lighter'; ctx.shadowBlur = 0;
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt * 2.6; if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96;
    ctx.globalAlpha = p.life * 0.9; ctx.fillStyle = p.col; const s = (1.2 + 1.6 * p.life) * dpr; ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

// ---- center counter (DOM, so digits stay sharp and never smear into the trail) ----
function fmt(n) { return String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function fitNumber() {
  const len = numEl.textContent.length; shownLen = len;
  numEl.style.fontSize = Math.min(R / dpr * 0.5, (R / dpr) * 1.5 / (len * 0.6)) + 'px';
}
function updateHud(col, now) {
  if (now - hudAt < 50 && state === 'run') return; hudAt = now;
  const s = fmt(kmh); if (numEl.textContent !== s) { numEl.textContent = s; if (s.length !== shownLen) fitNumber(); }
  numEl.style.color = col; numEl.style.textShadow = `0 0 10px ${col}, 0 0 30px ${col}`;
}

// ============================================================
//  LOOP
// ============================================================
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.033, Math.max(0.001, (ts - last) / 1000)), now = ts / 1000; last = ts;
  ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  ctx.fillStyle = `rgba(${BG},${state === 'light' ? LIGHT_FADE : TRAIL_FADE})`; ctx.fillRect(0, 0, W, H);   // translucent fill = motion-blur trail
  flash *= Math.pow(0.02, dt);
  const t = progress(), col = colorAt(t);
  if (state === 'run') {
    simulate(dt);
    if (!riserDone && t > 0.9) { riserDone = true; if (ac && ac.state === 'running') riser(ac.currentTime + 0.02, 2.2); }
    drawArena(colorAt(t * 0.9), t, now); drawBall(colorAt(progress()), false);
  } else if (state === 'light') {
    lightT += dt;
    simulate(dt);                                                    // the ball keeps bouncing — now at insane speed
    drawArena('#fff', 1, now); drawBall('#fff', true);               // thin white phantom trail
    if (burst > 0.01) { ctx.globalAlpha = burst * 0.5; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; burst *= Math.pow(0.002, dt); }
    if (lightT >= RESTART_DELAY) reset();
  } else {
    drawArena(colorAt(0), 0, now);
  }
  drawParts(dt);
  updateHud(state === 'light' ? '#fff' : col, ts);
}

function begin() {
  if (started) return; started = true;
  initAudio();
  try { const el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el); } catch (e) {}
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
  startEl.classList.add('hide'); reset();
}
startEl.addEventListener('click', begin);
startEl.addEventListener('touchend', e => { e.preventDefault(); begin(); }, { passive: false });
document.addEventListener('visibilitychange', () => { if (!document.hidden && ac && ac.state !== 'running') ac.resume(); });
addEventListener('pointerdown', () => { if (ac && ac.state !== 'running') ac.resume(); });
addEventListener('resize', () => { resize(); reset(); });
resize(); reset(); requestAnimationFrame(frame);
window.__sb = { get kmh() { return kmh; }, get state() { return state; }, get hits() { return hitCount; }, start: begin };
})();
</script>
</body>
</html>
