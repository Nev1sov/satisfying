<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050a1c">
<title>Ring Escape</title>
<style>
html,body{margin:0;height:100%;background:#050a1c;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
canvas{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:block}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#0c1840,#050a1c 70%);color:#dff6ff;font-family:-apple-system,"SF Pro Display",Helvetica,Arial,sans-serif;z-index:5;text-align:center}
#start h1{font-size:44px;letter-spacing:.14em;margin:0 0 10px;font-weight:800}
#start p{margin:0 0 34px;color:#7e9bc4;font-size:17px;letter-spacing:.06em}
#go{font:700 22px -apple-system,Helvetica,Arial,sans-serif;letter-spacing:.14em;color:#06122e;background:#7fe8ff;border:0;border-radius:40px;padding:18px 54px}
#start small{margin-top:26px;color:#53688c;font-size:13px;max-width:260px;line-height:1.5}
</style>
</head>
<body>
<div id="start">
  <h1>RING ESCAPE</h1>
  <p>ONE BALL · ONE HOLE · INFINITE BALLS</p>
  <button id="go">TAP TO START</button>
  <small>Turn the sound on, then screen-record. The clip loops by itself.</small>
</div>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
/* ====================== constants ====================== */
const W=1080,H=1920,CX=540,CY=880,R=395;
const GRAV=1050, REST_WALL=0.97, REST_BALL=0.88;
const T_PLAY=38, T_TOTAL=44.5, CAP=460;
const OMEGA0=1.3, BASIN=1500;
const SUB=1/180;

const cv=document.getElementById('c'), cx=cv.getContext('2d');
let sc=1, dpr=1, bgc=null;

/* ====================== RNG ====================== */
let seed=12345;
function rnd(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }
function rr(a,b){ return a+(rnd()-.5+.5)*(b-a); }

/* ====================== state ====================== */
let S=null, T=0, acc=0, timeScale=1, slowUntil=0;
let started=false, lastNow=0;
function rFor(c){ return Math.max(9,Math.min(18,18-1.7*Math.log(c))); }
function hueFor(i){ const pal=[188,320,48,142,265,12]; return pal[i%pal.length]; }
function reset(sd){
  seed=sd||12345;
  S={ t:0, rot:-3.1, omega:OMEGA0, gw:0.34, gwT:0.34,
      balls:[], created:1, esc:0, nid:0,
      fx:[], flt:[], banners:[], escRate:0, ms:{}, endShown:false, endAt:0, finalCount:0, firstEsc:false, bump:0 };
  const b=mk(CX+rr(-30,30),CY+rr(-160,-100),rr(-70,70),rr(-100,100),18);
  S.balls.push(b);
  S.banners.push({txt:'WILL THE BALL ESCAPE?',t0:0.2,dur:2.6,size:72,col:'#ffffff'});
  T=0; acc=0; timeScale=1; slowUntil=0;
  if(A) A.riser();
}
function mk(x,y,vx,vy,r){ const id=S.nid++; return {x,y,vx,vy,r,m:r*r,id,h:hueFor(id),out:false}; }
function wrapA(a){ while(a>Math.PI)a-=2*Math.PI; while(a<-Math.PI)a+=2*Math.PI; return a; }
function eTarget(t){ // target number of escapes at time t
  const cr=Math.exp(Math.log(430)*Math.min(t,30)/30);
  return Math.max(0,(cr-1)/2);
}

/* ====================== simulation ====================== */
const GCELL=40, GN=26, GOX=CX-R-60, GOY=CY-R-60;
const gHead=new Int32Array(GN*GN), gNext=new Int32Array(4000);
function step(dt){
  S.t+=dt;
  const gap=S.gw;
  // gap controller (paced by wall-clock T)
  const tgt=eTarget(T+1.2);
  let want=0.26+0.55*(tgt-S.esc);
  if(T>=31) want=0.95;
  if(T<1.6) want=0.30;
  want=Math.max(0.22,Math.min(1.8,want));
  S.gwT=want;
  S.gw+= (S.gwT-S.gw)*Math.min(1,dt*(S.gwT<S.gw?5:2.2));
  S.omega=OMEGA0+Math.min(0.5,S.created/900);
  if(T>=30){ // pour phase: the ring swings so the gap hangs near the bottom
    const des=Math.PI/2+0.5*Math.sin(T*0.9);
    const err=wrapA(des-S.rot); const wgt=Math.min(1,(T-30)/1.5);
    S.omega=S.omega*(1-wgt)+Math.max(-2.2,Math.min(2.2,err*2.2))*wgt;
  }
  S.rot+=S.omega*dt;
  S.escRate*=Math.exp(-dt/0.7);

  const bs=S.balls;
  const n=bs.length;
  for(let i=0;i<n;i++){
    const b=bs[i];
    b.vy+=GRAV*dt; b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.out) continue;
    const dx=b.x-CX, dy=b.y-CY; const d=Math.sqrt(dx*dx+dy*dy)||1;
    if(d+b.r>R){
      const delta=wrapA(Math.atan2(dy,dx)-S.rot);
      const inGap=Math.abs(delta)*R < S.gw*R/2 - b.r*0.55;
      if(inGap){
        if(d>R+b.r*0.8){ b.out=true; doEscape(b); }
      } else if(d<R+b.r*0.6){
        const nx=dx/d, ny=dy/d;
        b.x=CX+nx*(R-b.r); b.y=CY+ny*(R-b.r);
        const wvx=-dy*S.omega, wvy=dx*S.omega;
        let rvx=b.vx-wvx, rvy=b.vy-wvy;
        const vn=rvx*nx+rvy*ny;
        if(vn>0){
          rvx-=(1+REST_WALL)*vn*nx; rvy-=(1+REST_WALL)*vn*ny;
          // little tangential drag so balls get carried upward by the wall
          const vt=rvx*(-ny)+rvy*nx;
          rvx-=(-ny)*vt*0.012; rvy-=nx*vt*0.012;
          if(A&&vn>150) A.hit(vn,Math.atan2(dy,dx),b);
          if(vn>260&&S.created<40) S.fx.push({k:'tick',x:CX+nx*R,y:CY+ny*R,t:0,dur:0.35,r:b.r,h:b.h});
        }
        b.vx=rvx+wvx; b.vy=rvy+wvy;
      }
    }
    // gap end caps
    if(!b.out && d>R-70){
      for(let s=-1;s<=1;s+=2){
        const a=S.rot+s*S.gw/2;
        const px=CX+Math.cos(a)*R, py=CY+Math.sin(a)*R;
        const ex=b.x-px, ey=b.y-py; const dd2=ex*ex+ey*ey; const rr2=b.r+5;
        if(dd2<rr2*rr2){
          const dd=Math.sqrt(dd2)||1, nx=ex/dd, ny=ey/dd;
          b.x=px+nx*rr2; b.y=py+ny*rr2;
          const vn=b.vx*nx+b.vy*ny;
          if(vn<0){ b.vx-=1.9*vn*nx; b.vy-=1.9*vn*ny; if(A&&vn<-200) A.hit(-vn,a,b); }
        }
      }
    }
  }
  // ball-ball (inside only)
  gHead.fill(-1);
  for(let i=0;i<n;i++){
    const b=bs[i]; if(b.out) continue;
    let ix=((b.x-GOX)/GCELL)|0, iy=((b.y-GOY)/GCELL)|0;
    if(ix<0)ix=0; if(iy<0)iy=0; if(ix>=GN)ix=GN-1; if(iy>=GN)iy=GN-1;
    const c=iy*GN+ix; gNext[i]=gHead[c]; gHead[c]=i; b._c=c; b._ix=ix; b._iy=iy;
  }
  for(let i=0;i<n;i++){
    const a=bs[i]; if(a.out) continue;
    for(let oy=-1;oy<=1;oy++){ const yy=a._iy+oy; if(yy<0||yy>=GN) continue;
      for(let ox=-1;ox<=1;ox++){ const xx=a._ix+ox; if(xx<0||xx>=GN) continue;
        let j=gHead[yy*GN+xx];
        while(j!==-1){
          if(j>i){
            const b=bs[j];
            const ex=b.x-a.x, ey=b.y-a.y, rs=a.r+b.r; const d2=ex*ex+ey*ey;
            if(d2<rs*rs && d2>0.0001){
              const d=Math.sqrt(d2), nx=ex/d, ny=ey/d;
              const ov=rs-d; const mt=a.m+b.m;
              a.x-=nx*ov*b.m/mt; a.y-=ny*ov*b.m/mt; b.x+=nx*ov*a.m/mt; b.y+=ny*ov*a.m/mt;
              const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
              if(rv<0){
                const jn=-(1+REST_BALL)*rv/(1/a.m+1/b.m);
                a.vx-=jn*nx/a.m; a.vy-=jn*ny/a.m; b.vx+=jn*nx/b.m; b.vy+=jn*ny/b.m;
                if(A&&rv<-420&&S.created<60) A.tick(-rv);
              }
            }
          }
          j=gNext[j];
        }
      }
    }
  }
  // landing in the counter basin
  for(let i=bs.length-1;i>=0;i--){ const b=bs[i];
    if(b.out&&b.y>BASIN&&b.x>90&&b.x<W-90){ if(S.fx.length<80) S.fx.push({k:'splash',x:b.x,y:BASIN,t:0,dur:0.4,h:b.h,r:b.r}); bs[i]=bs[bs.length-1]; bs.pop(); } }
  // remove far balls
  for(let i=bs.length-1;i>=0;i--){ const b=bs[i]; if(b.out&&(b.y>H+80||b.x<-80||b.x>W+80)){ bs[i]=bs[bs.length-1]; bs.pop(); } }
  // fx
  for(let i=S.fx.length-1;i>=0;i--){ const f=S.fx[i]; f.t+=dt; if(f.t>f.dur) S.fx.splice(i,1); }
  for(let i=S.flt.length-1;i>=0;i--){ const f=S.flt[i]; f.t+=dt; if(f.t>f.dur) S.flt.splice(i,1); }
}
function insideCount(){ let c=0; for(const b of S.balls) if(!b.out) c++; return c; }
function doEscape(b){
  S.esc++; S.escRate+=1/0.7; S.created+=2;
  const calm=S.escRate<5;
  if(calm){ S.fx.push({k:'ring',x:b.x,y:b.y,t:0,dur:0.7,h:b.h,r:60});
    S.flt.push({txt:'+2',x:Math.max(120,Math.min(W-120,b.x)),y:b.y+10,t:0,dur:0.9,h:b.h}); }
  if(!S.firstEsc){
    S.firstEsc=true; slowUntil=T+1.1;
    S.banners.push({txt:'ESCAPED!  +2 BALLS',t0:T,dur:2.2,size:72,col:'#7fe8ff'});
  }
  const inside=insideCount();
  if(inside+2<=CAP){
    const r=rFor(S.created);
    for(let k=0;k<2;k++){
      const a=rnd()*Math.PI*2, sp=220+rnd()*260, rad=rnd()*60;
      const nb=mk(CX+Math.cos(a)*rad,CY+Math.sin(a)*rad-40,Math.cos(a)*sp,Math.sin(a)*sp-120,r);
      nb.h=hueFor(S.nid+k); S.balls.push(nb);
    }
    if(calm) S.fx.push({k:'spawn',x:CX,y:CY-40,t:0,dur:0.6,h:b.h,r:40});
  }
  if(A) A.escape(S.esc,S.escRate);
  const marks=[10,25,50,100,250,500,1000];
  for(const m of marks){ if(S.created>=m&&!S.ms[m]){ S.ms[m]=1; S.banners.push({txt:m.toLocaleString('en-US')+' BALLS!',t0:T,dur:1.5,size:96,col:'#ffd45e'}); if(A&&m>=25) A.milestone(m); } }
}

/* ====================== audio ====================== */
let A=null, ctx=null;
function buildAudio(){
  const AC=window.AudioContext||window.webkitAudioContext; ctx=new AC();
  const master=ctx.createGain(); master.gain.value=0.9;
  const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=4; comp.attack.value=0.004; comp.release.value=0.2;
  master.connect(comp); comp.connect(ctx.destination);
  // reverb
  const irLen=ctx.sampleRate*3.0|0, ir=ctx.createBuffer(2,irLen,ctx.sampleRate);
  for(let c=0;c<2;c++){ const d=ir.getChannelData(c); for(let i=0;i<irLen;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/irLen,2.6); } }
  const conv=ctx.createConvolver(); conv.buffer=ir; const wet=ctx.createGain(); wet.gain.value=0.5; conv.connect(wet); wet.connect(master);
  const musicBus=ctx.createGain(); musicBus.gain.value=0.7;
  const mLP=ctx.createBiquadFilter(); mLP.type='lowpass'; mLP.frequency.value=2200; mLP.Q.value=0.4;
  musicBus.connect(mLP); mLP.connect(master);
  const mSend=ctx.createGain(); mSend.gain.value=0.45; mLP.connect(mSend); mSend.connect(conv);
  // arp delay
  const dly=ctx.createDelay(1); dly.delayTime.value=0.4; const fb=ctx.createGain(); fb.gain.value=0.38;
  const dlp=ctx.createBiquadFilter(); dlp.type='lowpass'; dlp.frequency.value=2400;
  dly.connect(dlp); dlp.connect(fb); fb.connect(dly); dlp.connect(master); dlp.connect(conv);
  const sfx=ctx.createGain(); sfx.gain.value=0.9; sfx.connect(master); const sSend=ctx.createGain(); sSend.gain.value=0.35; sfx.connect(sSend); sSend.connect(conv);
  // noise
  const nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate); { const d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  function noise(t,dur,type,f1,f2,vol,dest,q){
    const s=ctx.createBufferSource(); s.buffer=nb; s.loop=true;
    const f=ctx.createBiquadFilter(); f.type=type; f.Q.value=q||0.8; f.frequency.setValueAtTime(f1,t); if(f2) f.frequency.exponentialRampToValueAtTime(f2,t+dur);
    const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+Math.min(0.02,dur*0.3)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(dest||sfx); s.start(t,Math.random()); s.stop(t+dur+0.05);
  }
  function tone(t,f,dur,type,vol,dest,att,f2){
    const o=ctx.createOscillator(); o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+(att||0.005)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(dest||sfx); o.start(t); o.stop(t+dur+0.05); return {o,g};
  }
  const mf=m=>440*Math.pow(2,(m-69)/12);
  // continuous water-ish pour
  const ps=ctx.createBufferSource(); ps.buffer=nb; ps.loop=true;
  const pbp=ctx.createBiquadFilter(); pbp.type='bandpass'; pbp.frequency.value=1700; pbp.Q.value=0.6;
  const phi=ctx.createBiquadFilter(); phi.type='highpass'; phi.frequency.value=700;
  const pg=ctx.createGain(); pg.gain.value=0; ps.connect(pbp); pbp.connect(phi); phi.connect(pg); pg.connect(sfx); ps.start();
  // ring hum
  const hum=ctx.createOscillator(); hum.type='sine'; hum.frequency.value=55; const hg=ctx.createGain(); hg.gain.value=0.0; hum.connect(hg); hg.connect(musicBus); hum.start();
  hg.gain.linearRampToValueAtTime(0.0,ctx.currentTime+0.1);

  const CH=[
    {b:45,t:[57,60,64,69,72]},
    {b:41,t:[53,57,60,65,69]},
    {b:48,t:[55,60,64,67,72]},
    {b:43,t:[55,59,62,67,71]}
  ];
  const PENT=[57,60,62,64,67,69,72,74,76,79,81,84];
  const BPM=84, STEP=60/BPM/2;
  let nextT=0, stepIdx=0, intensity=0.1, lastHit=0, lastTick=0, lastBub=0;
  const ARP=[0,2,1,3,2,4,3,2, 1,3,2,4,3,2,1,0];
  function chordPad(t,ch,dur){
    ch.t.slice(0,4).forEach((m,i)=>{
      for(let k=-1;k<=1;k+=2){
        const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=mf(m-12); o.detune.value=k*7+i*2;
        const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(380,t); f.frequency.linearRampToValueAtTime(700+intensity*900,t+dur*0.5); f.frequency.linearRampToValueAtTime(380,t+dur);
        const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.028,t+1.6); g.gain.setValueAtTime(0.028,t+dur-1.2); g.gain.linearRampToValueAtTime(0.0001,t+dur+1.4);
        o.connect(f); f.connect(g); g.connect(musicBus); o.start(t); o.stop(t+dur+1.6);
      }
    });
    // sub bass
    tone(t,mf(ch.b),dur*0.98,'sine',0.20,musicBus,0.08);
    tone(t,mf(ch.b+12),dur*0.5,'triangle',0.045,musicBus,0.1);
  }
  function sched(){
    const now=ctx.currentTime;
    if(nextT<now) nextT=now+0.05;
    while(nextT<now+0.3){
      const t=nextT, st=stepIdx, ch=CH[((st/16)|0)%4];
      if(st%16===0) chordPad(t,ch,STEP*16);
      // arp pluck
      const dens=intensity<0.18?2:1;
      if(st%dens===0){
        const idx=ARP[st%16]; const m=ch.t[idx]+(intensity>0.55&&st%4===3?12:0);
        const v=0.075+intensity*0.05;
        const o=tone(t,mf(m),0.55,'triangle',v,null,0.004);
        o.g.disconnect(); o.g.connect(musicBus); o.g.connect(dly);
      }
      // bell melody on the offbeat
      if(intensity>0.3&&(st%8===6||(intensity>0.6&&st%8===2))){
        const m=PENT[5+((st*7+((st/16)|0)*3)%6)];
        const o=tone(t,mf(m),1.4,'sine',0.06+intensity*0.03,null,0.004);
        o.g.disconnect(); o.g.connect(musicBus); o.g.connect(dly);
        const o2=tone(t,mf(m)*2.01,0.5,'sine',0.018,null,0.003); o2.g.disconnect(); o2.g.connect(musicBus);
      }
      // drums
      if(intensity>0.22&&st%4===0){ tone(t,130,0.28,'sine',0.42,musicBus,0.003,42); }
      if(intensity>0.45&&st%2===1){ noise(t,0.05,'highpass',7000,7000,0.055,musicBus,0.7); }
      if(intensity>0.65&&st%8===4){ noise(t,0.18,'bandpass',1800,1400,0.11,musicBus,0.9); tone(t,210,0.12,'triangle',0.06,musicBus,0.002,120); }
      nextT+=STEP; stepIdx++;
    }
    // intensity follows ball count
    const c=S?S.created:1;
    const target=Math.min(1,0.08+Math.log(c)/Math.log(420)*0.95);
    intensity+=(target-intensity)*0.12;
    mLP.frequency.value=1500+intensity*3200;
    // pour
    const rate=S?S.escRate:0;
    pg.gain.value+= (Math.min(0.2,rate*0.0065)-pg.gain.value)*0.2;
    pbp.frequency.value=1300+Math.min(2200,rate*60);
    sSend.gain.value=0.25+Math.min(0.2,rate*0.01);
  }
  setInterval(sched,60);
  const api={
    hit(vn,ang,b){
      const t=ctx.currentTime; if(t-lastHit<0.045) return; lastHit=t;
      const idx=((ang/(Math.PI*2)+1)*PENT.length*2|0)%PENT.length;
      const m=PENT[idx]+12;
      const crowd=1/Math.sqrt(1+S.created/18);
      const v=Math.min(1,vn/900)*0.30*crowd+0.02;
      const o=tone(t,mf(m),0.45,'triangle',v,null,0.003);
      o.g.disconnect(); o.g.connect(sfx); o.g.connect(dly);
      tone(t,mf(m)*2,0.15,'sine',v*0.25,sfx,0.002);
    },
    tick(v){ const t=ctx.currentTime; if(t-lastTick<0.06) return; lastTick=t; noise(t,0.03,'bandpass',3200,2400,Math.min(0.06,v/9000),sfx,2); },
    escape(n,rate){
      const t=ctx.currentTime;
      if(n<=6){
        const seq=[69,72,76,81,84,88];
        for(let i=0;i<4;i++){ const o=tone(t+i*0.065,mf(seq[Math.min(5,i+(n>3?1:0))]),0.7,'sine',0.17,null,0.004); o.g.disconnect(); o.g.connect(sfx); o.g.connect(dly); }
        noise(t,0.5,'bandpass',500,3800,0.14,sfx,1.2);
        tone(t,300,0.4,'sine',0.35,sfx,0.01,90); // spawn bloop
      } else {
        if(t-lastBub>0.04){ lastBub=t; const f=800+Math.random()*1400; tone(t,f,0.12,'sine',Math.max(0.025,0.11/(1+rate*0.4)),sfx,0.004,f*1.7); }
        if(rate<5) tone(t,260,0.25,'sine',0.14,sfx,0.01,110);
      }
    },
    milestone(m){
      const t=ctx.currentTime;
      noise(t,0.9,'bandpass',300,5000,0.22,sfx,1.0);
      [57,64,69,72,76].forEach((n,i)=>{ const o=tone(t+0.35,mf(n+12),1.8,'sine',0.11,null,0.01); o.g.disconnect(); o.g.connect(sfx); o.g.connect(dly); });
      tone(t+0.35,mf(33),1.6,'sine',0.4,sfx,0.01,mf(33)*0.98);
    },
    riser(){
      const t=ctx.currentTime;
      noise(t,2.6,'bandpass',200,3500,0.14,sfx,1.4);
      tone(t,mf(57),2.8,'sine',0.14,musicBus,1.4,mf(69));
    },
    end(){
      const t=ctx.currentTime;
      noise(t,0.6,'lowpass',2500,300,0.35,sfx,0.6);
      [45,57,64,67,71,76].forEach((n,i)=>{ const o=tone(t+0.05,mf(n),4,'sine',0.12,null,0.02); o.g.disconnect(); o.g.connect(sfx); });
      tone(t,mf(33),3,'sine',0.5,sfx,0.01,mf(33));
      pg.gain.value*=0.6;
      musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(musicBus.gain.value,t); musicBus.gain.linearRampToValueAtTime(0.4,t+1.5);
    },
    restart(){ const t=ctx.currentTime; musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(musicBus.gain.value,t); musicBus.gain.linearRampToValueAtTime(0.7,t+1.2); stepIdx=0; },
    resume(){ if(ctx.state!=='running') ctx.resume(); }
  };
  return api;
}

/* ====================== drawing ====================== */
function layout(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  const iw=window.innerWidth, ih=window.innerHeight;
  sc=Math.min(iw/W,ih/H);
  const cw=Math.round(W*sc), ch=Math.round(H*sc);
  cv.style.width=cw+'px'; cv.style.height=ch+'px';
  cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr);
  makeBg();
}
function makeBg(){
  bgc=document.createElement('canvas'); bgc.width=cv.width; bgc.height=cv.height;
  const g=bgc.getContext('2d'); const k=cv.width/W; g.setTransform(k,0,0,k,0,0);
  const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#060c24'); gr.addColorStop(0.5,'#0a1436'); gr.addColorStop(1,'#050a1c');
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  g.strokeStyle='rgba(120,170,255,0.055)'; g.lineWidth=1.2;
  for(let x=0;x<=W;x+=60){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke(); }
  for(let y=0;y<=H;y+=60){ g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
  g.strokeStyle='rgba(120,200,255,0.07)'; g.lineWidth=2;
  for(const r of [100,200,300]){ g.beginPath(); g.arc(CX,CY,r,0,Math.PI*2); g.stroke(); }
  g.beginPath(); g.moveTo(CX-14,CY); g.lineTo(CX+14,CY); g.moveTo(CX,CY-14); g.lineTo(CX,CY+14); g.stroke();
  // vignette
  const v=g.createRadialGradient(CX,H/2,H*0.35,CX,H/2,H*0.75); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,0.45)');
  g.fillStyle=v; g.fillRect(0,0,W,H);
}
const FONT='-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif';
function txt(s,x,y,size,col,align,weight,alpha){
  cx.font=(weight||'800')+' '+size+'px '+FONT; cx.textAlign=align||'center'; cx.textBaseline='middle';
  cx.globalAlpha=alpha==null?1:alpha; cx.fillStyle=col; cx.fillText(s,x,y); cx.globalAlpha=1;
}
function ease(t){ return 1-Math.pow(1-Math.min(1,Math.max(0,t)),3); }
function fmtTime(t){ t=Math.min(t,T_PLAY); const s=Math.floor(t); const ms=Math.floor((t-s)*10); return (s<10?'0':'')+s+'.'+ms+' s'; }

function draw(){
  const k=cv.width/W;
  cx.setTransform(1,0,0,1,0,0); cx.drawImage(bgc,0,0);
  cx.setTransform(k,0,0,k,0,0);
  // tiny camera bump
  let ox=0,oy=0; if(S.bump>0){ ox=(Math.random()-.5)*S.bump*6; oy=(Math.random()-.5)*S.bump*6; }
  cx.save(); cx.translate(ox,oy);

  // ring ticks
  cx.lineCap='butt';
  for(let i=0;i<72;i++){
    const a=S.rot+i*Math.PI/36, long=i%6===0;
    cx.strokeStyle=long?'rgba(150,215,255,0.55)':'rgba(120,180,240,0.28)'; cx.lineWidth=long?3:2;
    const r1=R+16, r2=R+(long?34:26);
    cx.beginPath(); cx.moveTo(CX+Math.cos(a)*r1,CY+Math.sin(a)*r1); cx.lineTo(CX+Math.cos(a)*r2,CY+Math.sin(a)*r2); cx.stroke();
  }
  // ring (soft halo + core), gap
  const g0=S.rot+S.gw/2, g1=S.rot-S.gw/2+Math.PI*2;
  cx.lineCap='round';
  cx.strokeStyle='rgba(127,232,255,0.10)'; cx.lineWidth=22; cx.beginPath(); cx.arc(CX,CY,R,g0,g1); cx.stroke();
  cx.strokeStyle='#7fe8ff'; cx.lineWidth=8; cx.beginPath(); cx.arc(CX,CY,R,g0,g1); cx.stroke();
  cx.strokeStyle='rgba(255,255,255,0.55)'; cx.lineWidth=2; cx.beginPath(); cx.arc(CX,CY,R,g0,g1); cx.stroke();
  // gap end markers + dashed path of the gap
  cx.fillStyle='#ffffff';
  for(let s=-1;s<=1;s+=2){ const a=S.rot+s*S.gw/2; cx.beginPath(); cx.arc(CX+Math.cos(a)*R,CY+Math.sin(a)*R,6,0,7); cx.fill(); }
  cx.strokeStyle='rgba(255,212,94,0.55)'; cx.lineWidth=3; cx.setLineDash([8,10]);
  cx.beginPath(); cx.arc(CX,CY,R+52,S.rot-S.gw/2,S.rot+S.gw/2); cx.stroke(); cx.setLineDash([]);
  // gap label
  if(T<30){ const a=S.rot, lx=CX+Math.cos(a)*(R+92), ly=CY+Math.sin(a)*(R+92);
    txt('GAP '+Math.round(S.gw*180/Math.PI)+'°',Math.max(110,Math.min(W-110,lx)),Math.max(300,Math.min(1480,ly)),26,'#ffd45e','center','700',0.9); }

  { const lv=Math.min(1,S.escRate/18); cx.strokeStyle='rgba(127,232,255,'+(0.25+lv*0.5)+')'; cx.lineWidth=3; cx.beginPath(); cx.moveTo(90,BASIN); cx.lineTo(W-90,BASIN); cx.stroke(); }
  // fx under balls
  for(const f of S.fx){
    const p=f.t/f.dur;
    if(f.k==='ring'||f.k==='spawn'){
      cx.strokeStyle='hsla('+f.h+',95%,68%,'+(1-p)*0.7+')'; cx.lineWidth=4*(1-p)+1;
      cx.beginPath(); cx.arc(f.x,f.y,f.r*(0.3+ease(p)*1.6),0,7); cx.stroke();
    } else if(f.k==='splash'){
      cx.strokeStyle='hsla('+f.h+',95%,72%,'+(1-p)*0.85+')'; cx.lineWidth=3;
      cx.beginPath(); cx.ellipse(f.x,f.y,f.r*(1+p*2.2),f.r*(0.3+p*0.5),0,0,7); cx.stroke();
    } else if(f.k==='tick'){
      cx.strokeStyle='hsla('+f.h+',95%,75%,'+(1-p)*0.8+')'; cx.lineWidth=3;
      cx.beginPath(); cx.arc(f.x,f.y,f.r+4+ease(p)*18,0,7); cx.stroke();
    }
  }
  // balls
  const bs=S.balls; const streak=bs.length<160;
  for(let i=0;i<bs.length;i++){
    const b=bs[i];
    const sp=Math.hypot(b.vx,b.vy);
    if(streak&&sp>260){
      cx.strokeStyle='hsla('+b.h+',95%,65%,0.30)'; cx.lineWidth=b.r*1.5; cx.lineCap='round';
      cx.beginPath(); cx.moveTo(b.x,b.y); cx.lineTo(b.x-b.vx*0.032,b.y-b.vy*0.032); cx.stroke();
    }
    cx.fillStyle='hsl('+b.h+',92%,'+(b.out?58:62)+'%)';
    cx.beginPath(); cx.arc(b.x,b.y,b.r,0,7); cx.fill();
    cx.strokeStyle='hsla('+b.h+',100%,86%,0.95)'; cx.lineWidth=Math.max(1.5,b.r*0.14);
    cx.beginPath(); cx.arc(b.x,b.y,b.r-0.7,0,7); cx.stroke();
  }
  // floaters
  for(const f of S.flt){
    const p=f.t/f.dur; txt(f.txt,f.x,f.y-ease(p)*60,54,'hsl('+f.h+',95%,75%)','center','800',1-p);
  }
  cx.restore();

  drawHud();
}

function drawHud(){
  const t=T;
  // header
  const ha=ease(t/0.5);
  cx.save(); cx.globalAlpha=ha;
  cx.font='800 70px '+FONT; const w1=cx.measureText('ESCAPE = ').width, w2=cx.measureText('2 NEW BALLS').width, x0=CX-(w1+w2)/2;
  txt('ESCAPE = ',x0,150,70,'#ffffff','left','800'); txt('2 NEW BALLS',x0+w1,150,70,'#7fe8ff','left','800');
  cx.restore();
  const pulse=0.65+0.35*Math.sin(t*4);
  txt('GUESS THE FINAL NUMBER OF BALLS',CX,238,38,'#ffd45e','center','700',ha*(t<T_PLAY?pulse:0.8));
  // counters panel
  const py=1545;
  cx.strokeStyle='rgba(127,232,255,0.35)'; cx.lineWidth=2; cx.fillStyle='rgba(8,16,44,0.78)';
  rr2(80,py-20,W-160,300,26); cx.fill(); cx.stroke();
  const shown=S.endShown?S.finalCount:S.created;
  txt('BALLS',CX-200,py+28,34,'#7e9bc4','center','700');
  txt(shown.toLocaleString('en-US'),CX-200,py+130,150,'#ffffff','center','800');
  cx.strokeStyle='rgba(127,232,255,0.2)'; cx.beginPath(); cx.moveTo(CX+110,py+10); cx.lineTo(CX+110,py+260); cx.stroke();
  txt('ESCAPED',CX+300,py+28,30,'#7e9bc4','center','700');
  txt(String(S.esc),CX+300,py+90,66,'#7fe8ff','center','800');
  txt('TIME',CX+300,py+170,30,'#7e9bc4','center','700');
  txt(fmtTime(t),CX+300,py+226,54,'#ffd45e','center','800');
  // timeline bar
  cx.fillStyle='rgba(127,232,255,0.15)'; cx.fillRect(80,py+300,W-160,6);
  cx.fillStyle='#7fe8ff'; cx.fillRect(80,py+300,(W-160)*Math.min(1,t/T_PLAY),6);

  // banners
  for(const b of S.banners){
    const p=(t-b.t0)/b.dur; if(p<0||p>1) continue;
    const a=p<0.12?p/0.12:(p>0.8?(1-p)/0.2:1);
    const s=1+0.25*(1-ease(Math.min(1,p*5)));
    cx.save(); cx.translate(CX,1418); cx.scale(s,s); txt(b.txt,0,0,b.size,b.col,'center','800',a); cx.restore();
  }
  // end card
  if(S.endShown){
    const e=Math.min(1,(t-S.endAt)/0.6);
    cx.fillStyle='rgba(4,8,24,'+(0.9*e)+')'; cx.fillRect(0,0,W,H);
    const cnt=Math.round(S.finalCount*ease((t-S.endAt)/1.8));
    cx.save(); cx.globalAlpha=e;
    txt('TOTAL BALLS',CX,640,64,'#9fb6d8','center','800');
    txt(cnt.toLocaleString('en-US'),CX,830,220,'#7fe8ff','center','800');
    txt('DID YOU GUESS RIGHT?',CX,1060,62,'#ffffff','center','800');
    txt('COMMENT YOUR GUESS',CX,1160,48,'#ffd45e','center','700');
    const q=Math.max(0,Math.min(1,(t-S.endAt-1.5)/0.5));
    txt('FOLLOW FOR MORE EXPERIMENTS',CX,1330,44,'#ffffff','center','700',q);
    cx.restore();
  }
}
function rr2(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }

/* ====================== loop ====================== */
function advance(dt){
  T+=dt;
  // time scale (slow-mo at first escape)
  const target=T<slowUntil?0.3:1; timeScale+=(target-timeScale)*Math.min(1,dt*8);
  acc+=dt*timeScale; let n=0;
  while(acc>=SUB&&n<10){ step(SUB); acc-=SUB; n++; } if(n>=10) acc=0;
  if(S.bump>0) S.bump=Math.max(0,S.bump-dt*3);
  if(!S.endShown&&T>=T_PLAY){ S.endShown=true; S.endAt=T; S.finalCount=S.created; if(A) A.end(); }
  if(T>=T_TOTAL){ reset(12345); if(A) A.restart(); }
  S.banners=S.banners.filter(b=>T-b.t0<b.dur+0.1);
}
function frame(now){
  requestAnimationFrame(frame);
  if(!started){ lastNow=now; return; }
  const dt=Math.min(0.05,(now-lastNow)/1000); lastNow=now;
  advance(dt); draw();
}

/* ====================== start ====================== */
layout(); window.addEventListener('resize',layout); window.addEventListener('orientationchange',()=>setTimeout(layout,200));
reset(12345); draw();
document.getElementById('go').addEventListener('click',function(){
  try{ A=buildAudio(); A.resume(); }catch(e){ A=null; }
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(()=>{}); }catch(e){}
  try{ const el=document.documentElement; (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el); }catch(e){}
  document.getElementById('start').style.display='none';
  reset(12345); started=true; lastNow=performance.now();
});
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&A) A.resume(); });
requestAnimationFrame(frame);
window.__rg={ S:()=>S, T:()=>T, adv:advance, reset, stats:()=>({t:T,created:S.created,esc:S.esc,inside:insideCount(),n:S.balls.length,gw:S.gw}) };
})();
</script>
