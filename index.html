<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050711">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Heartbeat Visualization</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#050711;touch-action:manipulation;user-select:none;font-family:Inter,"Avenir Next",system-ui,Arial,sans-serif}
  #stage{position:fixed;inset:0;display:grid;place-items:center;background:#050711}
  canvas{display:block;width:min(100vw,56.25vh);height:min(177.7778vw,100vh);max-width:100vw;max-height:100vh}
  #start{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px;text-align:center;color:#f6f8ff;background:radial-gradient(ellipse at 50% 42%,#111a32 0%,#070a16 52%,#03040a 100%);transition:opacity .4s}
  #start.hide{opacity:0;pointer-events:none}
  #start h1{font-size:clamp(30px,8vw,54px);font-weight:900;letter-spacing:.07em;line-height:1.05}
  #start h1 span{color:#6bdcff}
  #start p{max-width:330px;color:#9ca9c4;font-size:14px;line-height:1.55}
  #go{border:0;border-radius:16px;padding:17px 38px;background:#70dcff;color:#03101b;font-size:18px;font-weight:900;letter-spacing:.12em;box-shadow:0 0 28px #43caff55;animation:beat 1.3s ease-in-out infinite}
  @keyframes beat{50%{transform:scale(1.055)}}
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="540" height="960"></canvas></div>
<div id="start"><h1>HEARTBEAT<br><span>VISUALIZATION</span></h1><p>Four states. One heartbeat. Watch how the rhythm changes.</p><button id="go">TAP TO START</button><p>Turn your sound on for the full experience.</p></div>
<script>
(()=>{
'use strict';
const W=540,H=960,TAU=Math.PI*2,PHASE_LEN=8;
const canvas=document.getElementById('cv'),ctx=canvas.getContext('2d',{alpha:false});
let dpr=1,scale=1,last=0,elapsed=0,started=false,audio=null;
const phases=[
 {name:'SLEEPING',bpm:55,color:'#55baff',rgb:[85,186,255],glow:'rgba(65,160,255,.24)',amp:1.0},
 {name:'RUNNING',bpm:150,color:'#ff405d',rgb:[255,64,93],glow:'rgba(255,45,75,.25)',amp:1.12},
 {name:'SCARED',bpm:180,color:'#f5fbff',rgb:[245,251,255],glow:'rgba(220,245,255,.28)',amp:1.35},
 {name:'IN SPACE',bpm:65,color:'#b58aff',rgb:[181,138,255],glow:'rgba(160,100,255,.25)',amp:1.0}
];
let phaseIndex=0,phaseTime=0,beatPhase=0,beatCount=0,flash=0,shake=0;
const ECG_N=540,ecg=new Float32Array(ECG_N),stars=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,z:.3+Math.random()*1.2,p:Math.random()*TAU}));
let ecgHead=0,ecgAccumulator=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function resize(){
 const vw=innerWidth,vh=innerHeight;scale=Math.min(vw/W,vh/H);dpr=Math.min(devicePixelRatio||1,2);
 canvas.style.width=(W*scale)+'px';canvas.style.height=(H*scale)+'px';
 canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize);addEventListener('orientationchange',resize);resize();

// Heartbeat envelope: sharp contraction followed by a softer recovery.
function pulseEnvelope(p){
 const x=((p%1)+1)%1;
 const main=Math.exp(-Math.pow((x-.055)/.035,2));
 const after=.28*Math.exp(-Math.pow((x-.16)/.075,2));
 return clamp(main+after,0,1.25);
}
function ecgShape(p){
 // P-Q-R-S-T waveform in one normalized heartbeat cycle.
 const x=((p%1)+1)%1;
 const gauss=(c,w,a)=>a*Math.exp(-Math.pow((x-c)/w,2));
 return gauss(.18,.035,.12)-gauss(.285,.014,.18)+gauss(.315,.012,1.0)-gauss(.345,.018,.28)+gauss(.53,.075,.27);
}
function currentPhase(){return phases[phaseIndex];}
function setPhase(i){
 phaseIndex=i;phaseTime=0;
 if(i===2){flash=.9;shake=1.0;playScare();}
 if(i===1)shake=.35;
}

// Web Audio: low double-thump, short high-frequency scare accent, and space drone.
function initAudio(){
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 const ac=new AC();const master=ac.createGain();master.gain.value=.72;
 const comp=ac.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=18;comp.ratio.value=5;comp.attack.value=.004;comp.release.value=.22;
 master.connect(comp);comp.connect(ac.destination);
 const droneOsc=ac.createOscillator(),droneFilter=ac.createBiquadFilter(),droneGain=ac.createGain();
 droneOsc.type='sine';droneOsc.frequency.value=48;droneFilter.type='lowpass';droneFilter.frequency.value=180;droneGain.gain.value=.0001;
 droneOsc.connect(droneFilter);droneFilter.connect(droneGain);droneGain.connect(master);droneOsc.start();
 audio={ac,master,droneGain,droneOsc};
 if(ac.state==='suspended')ac.resume();
}
function thump(freq,dur,vol,when){
 if(!audio||audio.ac.state!=='running')return;
 const ac=audio.ac,t=when??ac.currentTime;
 const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();
 o.type='sine';o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(28,freq*.42),t+dur);
 f.type='lowpass';f.frequency.value=150;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(f);f.connect(g);g.connect(audio.master);o.start(t);o.stop(t+dur+.02);
}
function playBeat(){
 if(!audio||audio.ac.state!=='running')return;
 const p=currentPhase(),t=audio.ac.currentTime;
 const base=p.name==='SLEEPING'?62:p.name==='RUNNING'?78:p.name==='SCARED'?92:58;
 thump(base,.22,.65,t);thump(base*1.22,.16,.24,t+.105);
}
function playScare(){
 if(!audio||audio.ac.state!=='running')return;
 const ac=audio.ac,t=ac.currentTime;
 const n=ac.createBufferSource(),buf=ac.createBuffer(1,Math.floor(ac.sampleRate*.32),ac.sampleRate),data=buf.getChannelData(0);
 for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);
 n.buffer=buf;const hp=ac.createBiquadFilter(),g=ac.createGain();hp.type='highpass';hp.frequency.value=1800;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.3);n.connect(hp);hp.connect(g);g.connect(audio.master);n.start(t);n.stop(t+.32);
}
function updateAudio(){
 if(!audio)return;const p=currentPhase(),t=audio.ac.currentTime;
 const target=p.name==='IN SPACE'?.095:.0001;
 audio.droneGain.gain.setTargetAtTime(target,t,.5);
 audio.droneOsc.frequency.setTargetAtTime(p.name==='IN SPACE'?42:48,t,.5);
}

function addEcgSample(){
 const p=currentPhase();let wave=ecgShape(beatPhase)*p.amp;
 if(p.name==='SCARED')wave+=((Math.random()-.5)*.24)+(Math.sin(elapsed*39)*.06);
 else wave+=(Math.random()-.5)*.012;
 ecg[ecgHead]=wave;ecgHead=(ecgHead+1)%ECG_N;
}
function update(dt){
 elapsed+=dt;phaseTime+=dt;
 if(phaseTime>=PHASE_LEN){setPhase((phaseIndex+1)%phases.length);}
 const p=currentPhase();beatPhase+=dt*(p.bpm/60);
 while(beatPhase>=1){beatPhase-=1;beatCount++;playBeat();if(p.name==='SCARED')flash=Math.max(flash,.32);}
 ecgAccumulator+=dt;while(ecgAccumulator>=1/60){ecgAccumulator-=1/60;addEcgSample();}
 flash=Math.max(0,flash-dt*2.8);shake=Math.max(0,shake-dt*(p.name==='RUNNING'?1.8:3.5));
 for(const s of stars){s.y+=dt*9*s.z;if(s.y>H+4){s.y=-4;s.x=Math.random()*W;}s.x+=Math.sin(elapsed*.35+s.p)*dt*3;}
 updateAudio();
}
function roundedRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function text(str,x,y,size,color,align='center',weight=800){ctx.font=`${weight} ${size}px Inter,system-ui,Arial,sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=color;ctx.fillText(str,x,y);}
function drawBackground(p){
 const grad=ctx.createLinearGradient(0,0,W,H);grad.addColorStop(0,'#070b18');grad.addColorStop(.55,'#080b17');grad.addColorStop(1,'#03050c');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
 if(p.name==='IN SPACE'){
  ctx.save();for(const s of stars){ctx.globalAlpha=.25+.5*(.5+.5*Math.sin(elapsed*1.7+s.p));ctx.fillStyle='#d9caff';ctx.beginPath();ctx.arc(s.x,s.y,s.z,0,TAU);ctx.fill();}ctx.restore();
 }
 const v=ctx.createRadialGradient(W/2,470,30,W/2,470,440);v.addColorStop(0,p.glow);v.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
function drawHeart(p){
 const env=pulseEnvelope(beatPhase),base=105,rad=base*(1+.13*env*p.amp);
 const x=W/2,y=455;
 ctx.save();ctx.translate(x,y);ctx.scale(rad/100,rad/100);
 // Soft halo and a clean circular core.
 const halo=ctx.createRadialGradient(0,0,48,0,0,150);halo.addColorStop(0,p.glow);halo.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=halo;ctx.beginPath();ctx.arc(0,0,150,0,TAU);ctx.fill();
 ctx.shadowColor=p.color;ctx.shadowBlur=24;
 const fill=ctx.createRadialGradient(-28,-34,5,0,0,105);fill.addColorStop(0,'#ffffff');fill.addColorStop(.16,p.color);fill.addColorStop(1,'#171c36');
 ctx.fillStyle=fill;ctx.beginPath();ctx.arc(0,0,83,0,TAU);ctx.fill();ctx.shadowBlur=0;
 ctx.lineWidth=2.5;ctx.strokeStyle='rgba(255,255,255,.82)';ctx.beginPath();ctx.arc(0,0,83,0,TAU);ctx.stroke();
 // ECG pulse symbol inside the core.
 ctx.beginPath();ctx.moveTo(-52,2);ctx.lineTo(-25,2);ctx.lineTo(-12,-18);ctx.lineTo(1,25);ctx.lineTo(17,-13);ctx.lineTo(28,2);ctx.lineTo(52,2);
 ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=4;ctx.lineJoin='round';ctx.lineCap='round';ctx.shadowColor='#fff';ctx.shadowBlur=8;ctx.stroke();ctx.shadowBlur=0;
 ctx.restore();
 // Orbiting space particles.
 if(p.name==='IN SPACE'){
  for(let i=0;i<18;i++){const a=elapsed*.32+i*TAU/18,r=142+10*Math.sin(elapsed+i);const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r*.72;ctx.fillStyle='rgba(211,190,255,.8)';ctx.shadowColor=p.color;ctx.shadowBlur=9;ctx.beginPath();ctx.arc(px,py,1.8+(i%3)*.6,0,TAU);ctx.fill();}
  ctx.shadowBlur=0;
 }
}
function drawEcg(p){
 const x0=28,x1=W-28,y=720,w=x1-x0,h=92;
 roundedRect(x0,y-h/2,w,h/1.05,17);ctx.fillStyle='rgba(12,20,37,.72)';ctx.fill();ctx.strokeStyle='rgba(160,180,220,.12)';ctx.lineWidth=1;ctx.stroke();
 // Fine monitor grid.
 ctx.save();ctx.beginPath();ctx.rect(x0+1,y-h/2+1,w-2,h-2);ctx.clip();ctx.strokeStyle='rgba(130,160,205,.09)';ctx.lineWidth=1;
 for(let x=x0;x<=x1;x+=18){ctx.beginPath();ctx.moveTo(x,y-h/2);ctx.lineTo(x,y+h/2);ctx.stroke();}
 for(let yy=y-h/2;yy<=y+h/2;yy+=18){ctx.beginPath();ctx.moveTo(x0,yy);ctx.lineTo(x1,yy);ctx.stroke();}
 // Trace: old samples scroll from left to right, newest point at right edge.
 ctx.beginPath();for(let i=0;i<ECG_N;i++){const idx=(ecgHead+i)%ECG_N;const xx=x0+(i/(ECG_N-1))*w;const yy=y-ecg[idx]*h*.39;if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);}
 ctx.strokeStyle=p.color;ctx.lineWidth=2.7;ctx.lineJoin='round';ctx.lineCap='round';ctx.shadowColor=p.color;ctx.shadowBlur=10;ctx.stroke();ctx.shadowBlur=0;
 // Bright moving sweep point.
 const sy=y-ecg[(ecgHead+ECG_N-1)%ECG_N]*h*.39;ctx.fillStyle='#fff';ctx.shadowColor=p.color;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(x1-2,sy,3.5,0,TAU);ctx.fill();ctx.shadowBlur=0;
 ctx.restore();
 text('LIVE ECG',x0+3,y-h/2-20,11,'#8492ad','left',700);
}
function drawHud(p){
 text('HEART RATE MONITOR',W/2,55,13,'#77849f','center',800);
 text('BPM',W/2,123,17,'#9eabc4','center',800);
 text(String(p.bpm),W/2,205,76,'#f6f8ff','center',900);
 ctx.save();ctx.font='800 19px Inter,system-ui,Arial';const tw=ctx.measureText(p.name).width+42;roundedRect(W/2-tw/2,265,tw,38,19);ctx.fillStyle='rgba(255,255,255,.055)';ctx.fill();ctx.strokeStyle=p.color;ctx.globalAlpha=.8;ctx.lineWidth=1.2;ctx.stroke();ctx.restore();
 text(p.name,W/2,284,14,p.color,'center',900);
 text('HEART ACTIVITY',W/2,600,12,'#8996b0','center',800);
 text('STATE '+String(phaseIndex+1).padStart(2,'0')+' / 04',W/2,830,12,'#68758f','center',700);
 const bx=70,by=875,bw=W-140;ctx.fillStyle='rgba(255,255,255,.1)';roundedRect(bx,by,bw,4,2);ctx.fill();ctx.fillStyle=p.color;roundedRect(bx,by,bw*clamp(phaseTime/PHASE_LEN,0,1),4,2);ctx.fill();
 text('SLEEPING',bx,902,10,'#68758f','left',700);text('IN SPACE',W-bx,902,10,'#68758f','right',700);
}
function render(){
 const p=currentPhase();ctx.save();
 if(p.name==='RUNNING'&&shake>0){const s=shake*3;ctx.translate((Math.random()-.5)*s,(Math.random()-.5)*s);}
 drawBackground(p);drawHud(p);drawHeart(p);drawEcg(p);
 if(p.name==='SCARED'&&flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.32})`;ctx.fillRect(0,0,W,H);}
 ctx.restore();
}
function frame(ts){requestAnimationFrame(frame);if(!started){ctx.fillStyle='#050711';ctx.fillRect(0,0,W,H);return;}const dt=last?clamp((ts-last)/1000,0,.05):0;last=ts;update(dt);render();}
function begin(){if(started)return;started=true;try{initAudio();}catch(e){console.warn('Audio unavailable:',e);}document.getElementById('start').classList.add('hide');setPhase(0);last=0;}
document.getElementById('go').addEventListener('click',begin,{passive:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&audio&&audio.ac.state==='suspended')audio.ac.resume();});
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
