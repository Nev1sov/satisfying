<!DOCTYPE html>

<style>

</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="start"><h1>THE <span>π</span> BLOCKS</h1><p>Two blocks and a wall. Count the hits. The number is not random…</p><button id="go">TAP TO START</button><p style="font-size:12px">Start screen recording first, then tap START.<br>Turn the silent switch off for sound.</p></div>
<script>
(() => {
'use strict';
/* ================= SETTINGS ================= */
// m = mass of the BIG block (small = 1 kg). Hits = digits of π: 1→3, 100→31, 1e4→314, 1e6→3141, 1e8→31415
// w = block width, rmax = max counting speed (hits/s) in that round. Lower rmax = longer, calmer round.

  { m: 1e2, label: '100× HEAVIER',         short: '×100',  kg: '100 kg',         w: 104, rmax: 60 },
  { m: 1e4, label: '10,000× HEAVIER',      short: '×10K',  kg: '10,000 kg',      w: 148, rmax: 220 },
  { m: 1e6, label: '1,000,000× HEAVIER',   short: '×1M',   kg: '1,000,000 kg',   w: 192, rmax: 1400 },
  { m: 1e8, label: '100,000,000× HEAVIER', short: '×100M', kg: '100,000,000 kg', w: 236, rmax: 6000 },
];
const LIT = [1, 3, 4, 5, 6];       // characters of "3.14159…" that light up after each round
// Cinematic collision camera: real viewport movement, not world-distance stretching.
const CAM_ZOOM_BASE = 1;
// Predictive camera: only cut in when another collision is scheduled within this window.
const CAM_LOOKAHEAD = 1.0;
const CAM_RELEASE = 0.24;
const INTRO = 2.6, SETUP = 0.8, TAIL = 1.2, RESULT = 1.1, END_HOLD = 6;
const V0 = 230, START_GAP = 170, APPROACH = 276;
const TXT = { TITLE: '2 BLOCKS + 1 WALL = π ?!', H1: '2 BLOCKS. 1 WALL.', H2: 'COUNT EVERY HIT', H3: 'THE RESULT WILL SHOCK YOU 🤯', ASK: 'GUESS THE NEXT NUMBER 👇', END1: 'THE HITS SPELL π!', END2: 'DID YOU SEE IT COMING? 🤯', CTA: 'SUBSCRIBE FOR MORE!' };
/* ============================================ */

const $ = id => document.getElementById(id), clamp = (v, a, b) => Math.min(b, Math.max(a, v)), TAU = Math.PI * 2, W = 1080, H = 1920;
const FF = '"Avenir Next","Helvetica Neue",Inter,"Segoe UI",Arial,sans-serif', FLOOR = 1290, WALLX = 100, SW = 64, HUES = [150, 48, 24, 338, 285], CY = '#35c8ff', YL = '#ffe14a';

  const v = g.createRadialGradient(W / 2, 960, 500, W / 2, 960, 1250); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)'); g.fillStyle = v; g.fillRect(0, 0, W, H); bg = c;
}
let rz; const onR = () => { clearTimeout(rz); rz = setTimeout(layout, 100); }; addEventListener('resize', onR); addEventListener('orientationchange', onR);

/* ---------- exact collision simulation ---------- */
function simulate(M) {

/* ---------- audio: wooden wall knock, crisp mechanical click on block impacts, and speed-up whirr ---------- */
let ac, master, rev, noise, toneO, tone2, toneG, rumO, rumG, tokens = 6, tokT = 0; const SC = [0, 2, 4, 7, 9], mtof = m => 440 * Math.pow(2, (m - 69) / 12);

function clk(t, vol, f) {
  const s = ac.createBufferSource(); s.buffer = noise; const b = ac.createBiquadFilter(), g = ac.createGain(); b.type = 'bandpass'; b.frequency.value = f; b.Q.value = 1.4;

}
function bell(f, t, v) { osc('triangle', f, f, t, 0.6, v, 1); osc('sine', f * 2.01, f * 2.01, t, 0.3, v * 0.4, 1); osc('sine', f * 3.5, f * 3.5, t, 0.15, v * 0.2, 1); clk(t, 0.07, 4200); }

  const s = ac.createBufferSource(); s.buffer = noise; s.loop = true; const b = ac.createBiquadFilter(), g = ac.createGain(); b.type = 'bandpass'; b.Q.value = 1.2; b.frequency.setValueAtTime(f0, t); b.frequency.exponentialRampToValueAtTime(f1, t + len);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + len * 0.9); g.gain.linearRampToValueAtTime(0.0001, t + len + 0.03); s.connect(b); b.connect(g); g.connect(master); s.start(t); s.stop(t + len + 0.1);

  const src = ac.createBufferSource(), hp = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = noise;
  hp.type = 'bandpass'; hp.frequency.setValueAtTime(3200 + Math.random() * 900, t); hp.Q.value = 2.8;
  g.gain.setValueAtTime(0.0001, t);

  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.026);

  snap.type = 'triangle'; snap.frequency.setValueAtTime(1750 + Math.random() * 250, t);
  snap.frequency.exponentialRampToValueAtTime(720 + Math.random() * 100, t + 0.024);
  sg.gain.setValueAtTime(0.0001, t); sg.gain.exponentialRampToValueAtTime(0.11 * intensity, t + 0.001);
  sg.gain.exponentialRampToValueAtTime(0.0001, t + 0.032);

  body.type = 'sine'; body.frequency.setValueAtTime(235, t);
  body.frequency.exponentialRampToValueAtTime(115, t + 0.045);
  bg.gain.setValueAtTime(0.0001, t); bg.gain.exponentialRampToValueAtTime(0.075 * intensity, t + 0.002);

function sfx(wall, rate) {

  for (let i = 0; i < n; i++) bell(mtof(57 + SC[i % 5] + 12 * Math.floor(i / 5) + 12), t + 0.05 + i * 0.12, 0.2);

/* ---------- game state ---------- */
let S = null, last = 0;
function loadRound(r) {

function startRun() {

    camX: W / 2, camY: 960, camZ: CAM_ZOOM_BASE, camTargetX: W / 2, camTargetY: 960, camTargetZ: CAM_ZOOM_BASE, camHold: 0 };

}
const setPhase = p => { S.phase = p; S.pt = 0; };

function hit(i, bud) {
  const e = S.ev[i], wall = e.type === 'w'; S.count++; const cx = wall ? WALLX : WALLX + SW + e.p2, cy = FLOOR - SW / 2, lo = S.rate < 30;

    if (S.phase === 'run' && nextGap <= CAM_LOOKAHEAD) {

      S.camTargetY = FLOOR - Math.max(95, S.cfg.w * 0.72);

      S.camHold = Math.max(S.camHold, nextGap + CAM_RELEASE);

  // scheduled collision is close. This prevents the camera dropping out
