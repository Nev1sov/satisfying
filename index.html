<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#02030a">
<title>Light vs. The Solar System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#02030a;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;font-family:"Avenir Next","Helvetica Neue",Inter,system-ui,Arial,sans-serif}
#wrap{position:fixed;inset:0;display:grid;place-items:center}canvas{display:block}
#start{position:fixed;inset:0;z-index:10;background:#02030a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:28px;text-align:center;color:#f3efe6;transition:opacity .4s}
#start.hide{opacity:0;pointer-events:none}
#start h1{font-size:clamp(28px,7.5vw,48px);font-weight:800;letter-spacing:.04em;line-height:1.15}
#start h1 span{color:#f2c46d}
#start p{font-size:14px;color:#8d97b3;max-width:330px;line-height:1.55}
#go{padding:16px 42px;font-size:18px;font-weight:800;letter-spacing:.14em;color:#1a1204;background:#f2c46d;border:none;border-radius:40px}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="start"><h1>LIGHT vs.<br><span>THE SOLAR SYSTEM</span></h1><p>Start your screen recording first, then tap the button.<br>Turn the silent switch off for sound.</p><button id="go">TAP TO START</button></div>
<script>
(() => {
'use strict';
/* ================= SETTINGS ================= */
// km = real distance. dur = seconds on screen for the flight. hold = pause after arrival.
const LEGS = [
  { n: 'MOON',    sh: '1.3 s',  km: 384400,  note: 'Average distance',  dur: 3.6, hold: 1.4, r: 58,  tips: [[.45, 'Even the Moon is over a second away']] },
  { n: 'MARS',    sh: '3 min',  km: 54.6e6,  note: 'Closest approach',  dur: 6,   hold: 1.4, r: 78,  tips: [[.5, 'Still think light is instant?']] },
  { n: 'SUN',     sh: '8 min',  km: 149.6e6, note: 'Average distance',  dur: 7,   hold: 1.6, r: 150, tips: [[.5, 'You see the Sun as it was 8 minutes ago']] },
  { n: 'NEPTUNE', sh: '4 hr',   km: 4.495e9, note: 'Average distance',  dur: 13,  hold: 2.2, r: 105, tips: [[.15, 'Still flying...'], [.45, 'Most people would have swiped by now 😅'], [.78, 'Almost there...']] },
];
const RECAP = 7;
/* ============================================ */
const W = 1080, H = 1920, C = 299792.458, MI = 0.621371, TAU = Math.PI * 2;
const $ = i => document.getElementById(i), cl = (v, a, b) => Math.min(b, Math.max(a, v)), E = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const FF = '"Avenir Next","Helvetica Neue",Inter,"Segoe UI",Arial,sans-serif', GOLD = '#f2c46d', INK = '#f3efe6', MUTE = '#8d97b3';
const EX = 170, ER = 105, TX = 905, Y = 700;
const cv = $('cv'), ctx = cv.getContext('2d'); let K = 1;
function layout() { const v = window.visualViewport, vw = v ? v.width : innerWidth, vh = v ? v.height : innerHeight, s = Math.min(vw / W, vh / H), d = Math.min(devicePixelRatio || 1, 2); cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; cv.width = Math.round(W * s * d); cv.height = Math.round(H * s * d); K = cv.width / W; }
addEventListener('resize', layout); addEventListener('orientationchange', layout);

/* timeline */
let T = 0.4; for (const L of LEGS) { L.t = L.km / C; L.s = T; L.e = T + L.dur; L.h = L.e + L.hold; T = L.h + 0.5; L.f = L.t / L.dur; }
const END = LEGS[3].h, PER = END + RECAP;

/* formatting */
const fmt = n => Math.round(n).toLocaleString('en-US'), p2 = n => String(n).padStart(2, '0');
function fmtT(s) { if (s < 60) return s.toFixed(2) + ' s'; if (s < 3600) return Math.floor(s / 60) + ' min ' + p2(Math.floor(s % 60)) + ' s'; return Math.floor(s / 3600) + ' hr ' + p2(Math.floor(s % 3600 / 60)) + ' min ' + p2(Math.floor(s % 60)) + ' s'; }
function fmtD(mi) { return mi >= 1e9 ? (mi / 1e9).toFixed(2) + ' billion miles' : mi >= 1e6 ? (mi / 1e6).toFixed(1) + ' million miles' : fmt(mi) + ' miles'; }

/* helpers */
function txt(s, x, y, sz, c, o = {}) { ctx.save(); ctx.font = `${o.w || 800} ${sz}px ${FF}`; ctx.textAlign = o.al || 'center'; ctx.textBaseline = 'middle'; let k = 1; if (o.mw) { const w = ctx.measureText(s).width; if (w > o.mw) k = o.mw / w; } ctx.translate(x, y); ctx.scale(k * (o.sc || 1), k * (o.sc || 1)); ctx.globalAlpha = o.a ?? 1; if (o.sh) { ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 20; } ctx.fillStyle = c; ctx.fillText(s, 0, 0); ctx.restore(); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function shade(r) { const g = ctx.createRadialGradient(-r * .4, -r * .4, r * .25, 0, 0, r * 1.05); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.55, 'rgba(0,0,0,.22)'); g.addColorStop(1, 'rgba(0,0,8,.82)'); ctx.fillStyle = g; ctx.fillRect(-r, -r, 2 * r, 2 * r); }
function disc(r, a, b) { const g = ctx.createRadialGradient(-r * .35, -r * .35, r * .1, 0, 0, r); g.addColorStop(0, a); g.addColorStop(1, b); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill(); }
function ell(x, y, rx, ry, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fill(); }
function atmos(r, c) { const g = ctx.createRadialGradient(0, 0, r * .96, 0, 0, r * 1.3); g.addColorStop(0, c); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 1.3, 0, TAU); ctx.fill(); }

/* ---------- planets ---------- */
const LAND = [[.2, -.3, .5, .3], [.6, .35, .4, .25], [1.1, -.1, .45, .35], [1.6, .4, .5, .22], [2.1, -.35, .4, .3], [2.6, .1, .55, .3], [3, -.2, .3, .25]];
function earth(t) {
  const r = ER; ctx.save(); atmos(r, 'rgba(120,180,255,.55)'); ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.clip();
  let g = ctx.createLinearGradient(0, -r, 0, r); g.addColorStop(0, '#2f78c9'); g.addColorStop(1, '#0b3270'); ctx.fillStyle = g; ctx.fillRect(-r, -r, 2 * r, 2 * r);
  const sp = 3.2 * r, off = t * 7;
  for (const [bx, by, rx, ry] of LAND) ell((((bx * r - off) % sp) + sp) % sp - 1.6 * r, by * r, rx * r, ry * r, '#4a9a55');
  for (let i = 0; i < 6; i++) ell((((i * .55 * r - off * 1.5) % sp) + sp) % sp - 1.6 * r, Math.sin(i * 2.3) * r * .6, r * .4, r * .07, 'rgba(255,255,255,.5)');
  shade(r); ctx.restore();
}
function moon() {
  const r = 58; ctx.save(); atmos(r, 'rgba(220,220,230,.18)'); disc(r, '#e6e4df', '#8d8b88');
  for (const [x, y, s] of [[-.3, -.2, .22], [.25, .3, .18], [.35, -.35, .12], [-.45, .35, .1], [0, 0, .08], [.1, -.55, .09]]) { ell(x * r, y * r, s * r, s * r, 'rgba(70,68,66,.35)'); ell(x * r - 1, y * r - 1, s * r * .8, s * r * .8, 'rgba(255,255,255,.1)'); }
  shade(r); ctx.restore();
}
function mars() {
  const r = 78; ctx.save(); atmos(r, 'rgba(230,130,80,.28)'); ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.clip(); disc(r, '#e08652', '#7d321a');
  for (const [x, y, a, b] of [[-.3, .1, .5, .22], [.3, -.15, .4, .2], [.1, .4, .45, .15], [-.5, -.35, .25, .13]]) ell(x * r, y * r, a * r, b * r, 'rgba(70,25,12,.32)');
  ell(0, -r * .95, r * .45, r * .17, 'rgba(255,255,255,.85)'); ell(0, r * .97, r * .3, r * .1, 'rgba(255,255,255,.6)'); shade(r); ctx.restore();
}
function sun(t) {
  const r = 150; ctx.save(); const pu = 1 + .04 * Math.sin(t * 2);
  let g = ctx.createRadialGradient(0, 0, r * .8, 0, 0, r * 2.4 * pu); g.addColorStop(0, 'rgba(255,190,80,.6)'); g.addColorStop(.4, 'rgba(255,120,30,.16)'); g.addColorStop(1, 'rgba(255,100,20,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 2.4 * pu, 0, TAU); ctx.fill();
  ctx.save(); ctx.rotate(t * .08); for (let i = 0; i < 14; i++) { ctx.rotate(TAU / 14); ctx.fillStyle = 'rgba(255,200,110,.07)'; ctx.beginPath(); ctx.moveTo(0, -r * .9); ctx.lineTo(-18, -r * (1.5 + .25 * Math.sin(t + i))); ctx.lineTo(18, -r * (1.5 + .25 * Math.sin(t + i))); ctx.fill(); } ctx.restore();
  disc(r, '#fffbe0', '#f59a1f');
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.clip(); for (let i = 0; i < 18; i++) { const a = i * 2.4 + t * .1, d = r * (.2 + .7 * ((i * .37) % 1)); ell(Math.cos(a) * d, Math.sin(a) * d, 16 + (i % 4) * 7, 10 + (i % 3) * 5, 'rgba(255,140,30,.22)'); } ctx.restore(); ctx.restore();
}
function nept() {
  const r = 105; ctx.save(); atmos(r, 'rgba(90,140,255,.4)'); ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.clip(); disc(r, '#5d8cff', '#13307d');
  [[-.6, .12, '#2a52c0'], [-.3, .08, '#7fa6ff'], [.1, .14, '#2a52c0'], [.45, .08, '#8fb2ff'], [.75, .1, '#1f40a0']].forEach(([y, h, c]) => { ctx.globalAlpha = .4; ctx.fillStyle = c; ctx.fillRect(-r, y * r, 2 * r, h * r); }); ctx.globalAlpha = 1;
  ell(-r * .2, r * .22, r * .22, r * .12, 'rgba(10,25,80,.55)'); shade(r); ctx.restore();
}
const DRAW = [moon, mars, sun, nept];

/* ---------- stars ---------- */
const stars = Array.from({ length: 170 }, () => ({ x: Math.random() * W, y: Math.random() * H, z: .2 + Math.random() * .8, p: Math.random() * 6 }));

/* ---------- audio: heavy flight sound + dark ambient score ---------- */
let ac, mg, rv, nb;
const rnd = (a, b) => a + Math.random() * (b - a);
function out(n, wet) { n.connect(mg); if (wet) { const g = ac.createGain(); g.gain.value = wet; n.connect(g); g.connect(rv); } }
function snd(f1, f2, d, g, ty = 'sine', wet = 0) { const o = ac.createOscillator(), v = ac.createGain(), n = ac.currentTime; o.type = ty; o.frequency.setValueAtTime(f1, n); o.frequency.exponentialRampToValueAtTime(f2, n + d); v.gain.setValueAtTime(0, n); v.gain.linearRampToValueAtTime(g, n + .02); v.gain.exponentialRampToValueAtTime(.0001, n + d); o.connect(v); out(v, wet); o.start(n); o.stop(n + d + .05); }
function noise(d, f1, f2, g, ty, q = 1, wet = .2) { const n = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), v = ac.createGain(); s.buffer = nb; s.loop = true; f.type = ty; f.Q.value = q; f.frequency.setValueAtTime(f1, n); f.frequency.exponentialRampToValueAtTime(f2, n + d); v.gain.setValueAtTime(0, n); v.gain.linearRampToValueAtTime(g, n + Math.min(.3, d / 3)); v.gain.setValueAtTime(g, n + Math.max(.3, d - .5)); v.gain.exponentialRampToValueAtTime(.0001, n + d); s.connect(f); f.connect(v); out(v, wet); s.start(n); s.stop(n + d + .05); }
function launch(d) { if (!ac) return; const n = ac.currentTime;
  snd(95, 26, 1.8, .95, 'sine', .3); noise(.7, 3500, 150, .5, 'lowpass');
  const o = ac.createOscillator(), ws = ac.createWaveShaper(), lp = ac.createBiquadFilter(), v = ac.createGain(), cr = new Float32Array(256); for (let i = 0; i < 256; i++) cr[i] = Math.tanh(4 * (i / 128 - 1)); ws.curve = cr;
  o.type = 'sawtooth'; o.frequency.setValueAtTime(40, n); o.frequency.exponentialRampToValueAtTime(135, n + d); lp.type = 'lowpass'; lp.Q.value = 6; lp.frequency.setValueAtTime(200, n); lp.frequency.exponentialRampToValueAtTime(2400, n + d);
  v.gain.setValueAtTime(0, n); v.gain.linearRampToValueAtTime(.34, n + .5); v.gain.setValueAtTime(.34, n + d - .3); v.gain.exponentialRampToValueAtTime(.0001, n + d + .5); o.connect(ws); ws.connect(lp); lp.connect(v); out(v, .25); o.start(n); o.stop(n + d + .6);
  noise(d + .3, 300, 4500, .32, 'bandpass', 1.2); noise(d + .3, 90, 160, .7, 'lowpass', 2, 0); snd(150, 1800, d, .07, 'triangle', .5); }
function impact() { if (!ac) return; snd(140, 24, 2.4, 1, 'sine', .3); snd(60, 28, 1.6, .55, 'sawtooth'); noise(2, 2600, 70, .6, 'lowpass', 1, .4); snd(1320, 660, 1.4, .08, 'triangle', .7); }
const CH = [[73.42, 110, 174.61], [77.78, 116.54, 196], [58.27, 87.31, 174.61], [55, 82.41, 138.59]], BL = [587.33, 622.25, 698.46, 880, 1046.5, 1174.66];
function pad(fs) { const n = ac.currentTime, v = ac.createGain(), lp = ac.createBiquadFilter(), l = ac.createOscillator(), lg = ac.createGain(); lp.type = 'lowpass'; lp.frequency.value = 650; lp.Q.value = 3; v.gain.setValueAtTime(0, n); v.gain.linearRampToValueAtTime(.055, n + 3.5); v.gain.linearRampToValueAtTime(.0001, n + 10); lp.connect(v); out(v, .7);
  fs.forEach(f => [-7, 7].forEach(dt => { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = dt; o.connect(lp); o.start(n); o.stop(n + 10.2); }));
  l.frequency.value = .15; lg.gain.value = 320; l.connect(lg); lg.connect(lp.frequency); l.start(n); l.stop(n + 10.2); }
function music() { let k = 0; (function a() { pad(CH[k++ % 4]); setTimeout(a, 7000); })();
  (function b() { const f = BL[(Math.random() * BL.length) | 0]; snd(f, f * .997, 4, .045, 'sine', .9); snd(f * 2, f * 2, 3, .012, 'sine', .9); setTimeout(b, rnd(1800, 4200)); })();
  (function c() { snd(62, 40, .9, .16, 'sine'); setTimeout(c, 3800); })(); }
function initAudio() { ac = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' }); try { navigator.audioSession.type = 'playback'; } catch (e) {}
  const cp = ac.createDynamicsCompressor(); cp.threshold.value = -14; cp.ratio.value = 5; mg = ac.createGain(); mg.gain.value = .9; mg.connect(cp); cp.connect(ac.destination);
  const L = (ac.sampleRate * 3.2) | 0, ir = ac.createBuffer(2, L, ac.sampleRate); for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < L; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / L, 2.5); } rv = ac.createConvolver(); rv.buffer = ir; rv.connect(mg);
  nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const nd = nb.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const so = ac.createOscillator(), sg = ac.createGain(); so.frequency.value = 36.71; sg.gain.value = .12; so.connect(sg); sg.connect(mg); so.start(); music(); }
const SL = Array.from({ length: 46 }, () => ({ x: Math.random() * W, y: 480 + Math.random() * 445, l: 200 + Math.random() * 600, s: .5 + Math.random() * .5 }));

/* ---------- main draw ---------- */
let running = false, t0 = 0, prev = -1, last = 0, ev = {};
function frame() {
  requestAnimationFrame(frame); const now = performance.now() / 1000, dt = Math.min(.05, now - last); last = now;
  ctx.setTransform(K, 0, 0, K, 0, 0); const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#02030a'); bg.addColorStop(1, '#0a1030'); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  if (!running) return;
  const t = (now - t0) % PER; if (t < prev) ev = {}; prev = t;
  let i = 0; LEGS.forEach((L, k) => { if (t >= L.s - .5) i = k; }); const L = LEGS[i], recap = t >= END;
  const fly = t >= L.s && t < L.e, p = t < L.s ? 0 : t < L.e ? (t - L.s) / L.dur : 1, hold = t >= L.e && !recap;
  if (t >= L.s && !ev['s' + i]) { ev['s' + i] = 1; launch(L.dur); }
  if (t >= L.e && !ev['e' + i]) { ev['e' + i] = 1; impact(); }
  /* stars */
  for (const q of SL) { q.x -= (fly ? 7000 : 0) * q.s * dt; if (q.x < -800) { q.x = W + 100; q.y = 480 + Math.random() * 445; } } const v = fly ? 2600 : 35; for (const s of stars) { s.x -= v * s.z * dt; if (s.x < -20) { s.x = W + 20; s.y = Math.random() * H; } const a = .25 + .55 * s.z * (.7 + .3 * Math.sin(now * 2 + s.p)); ctx.globalAlpha = a; ctx.fillStyle = '#fff'; if (fly && s.z > .3) ctx.fillRect(s.x, s.y, 170 * s.z, 1 + s.z); else { ctx.beginPath(); ctx.arc(s.x, s.y, 1 + 1.4 * s.z, 0, TAU); ctx.fill(); } } ctx.globalAlpha = 1;
  /* header */
  txt('SPEED OF LIGHT · 186,282 MILES PER SECOND', W / 2, 105, 31, MUTE, { mw: 980, w: 700 });
  LEGS.forEach((q, k) => { const x = 55 + k * 246, done = t >= q.e, act = k === i && !recap; ctx.fillStyle = done ? 'rgba(242,196,109,.12)' : 'rgba(255,255,255,.04)'; rr(x, 150, 232, 90, 22); ctx.fill(); ctx.strokeStyle = act ? GOLD : done ? 'rgba(242,196,109,.5)' : 'rgba(255,255,255,.14)'; ctx.lineWidth = act ? 3 : 1.5; ctx.stroke(); txt(q.n, x + 116, done ? 180 : 195, 28, done ? GOLD : act ? INK : MUTE, { w: 800 }); if (done) txt(q.sh, x + 116, 217, 24, INK, { w: 600 }); });
  /* hook / title */
  const hk = i === 0 ? cl((3.3 - t) / .4, 0, 1) : 0, ta = 1 - hk;
  if (hk > 0) { const pop = 1 + .06 * Math.pow(1 - cl(t / .3, 0, 1), 2); txt('LIGHT CIRCLES EARTH', W / 2, 340, 66, INK, { a: hk, mw: 980, sc: pop, sh: 1 }); txt('7½ TIMES PER SECOND', W / 2, 415, 66, INK, { a: hk, mw: 980, sc: pop, sh: 1 }); txt('SO HOW LONG TO REACH NEPTUNE? 🤯', W / 2, 510, 44, GOLD, { a: hk, mw: 980, sh: 1 }); }
  if (ta > 0) { txt('EARTH  →  ' + L.n, W / 2, 360, 84, INK, { a: ta, mw: 980, sh: 1 }); txt(L.note + ' · ' + fmtD(L.km * MI), W / 2, 435, 34, MUTE, { a: ta, mw: 980, w: 600 }); }
  /* path + cinematic camera */
  const px0 = EX + ER, px1 = TX - L.r, px = px0 + (px1 - px0) * p, sm = x => { x = cl(x, 0, 1); return x * x * (3 - 2 * x); };
  const env = fly ? sm(p / .07) * (1 - sm((p - .9) / .1)) : 0, a0 = hold ? t - L.e : 9;
  const z = 1 + 1.7 * env + .3 * Math.max(0, 1 - a0 * 3), cx = W / 2 + (px + 140 - W / 2) * env, shk = 10 * env + 16 * Math.max(0, 1 - a0 * 2.5), fi = E(cl((t - (L.s - .5)) / .5, 0, 1));
  ctx.save(); ctx.beginPath(); ctx.rect(0, 480, W, 445); ctx.clip();
  ctx.translate(W / 2 + (Math.random() - .5) * shk, Y + (Math.random() - .5) * shk); ctx.scale(z, z); ctx.translate(-cx, -Y);
  ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 2; ctx.setLineDash([3, 14]); ctx.beginPath(); ctx.moveTo(px0, Y); ctx.lineTo(px1, Y); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(px0, Y); ctx.lineTo(px, Y); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.28)'; for (let x = px0; x <= px1; x += 55) ctx.fillRect(x, Y + 14, 2, 14);
  ctx.save(); ctx.translate(EX, Y); earth(now); ctx.restore();
  ctx.save(); ctx.translate(TX, Y); ctx.globalAlpha = fi; const sc = .6 + .4 * fi; ctx.scale(sc, sc); DRAW[i](now); ctx.restore();
  if (t >= L.s - .1 && !hold) {
    const tl = (300 + 500 * env) * Math.min(1, p * 10); let g = ctx.createLinearGradient(px - tl, 0, px, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,.95)');
