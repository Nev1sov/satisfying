<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#04050f">
<title>Pick Your Color Race</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff; touch-action: none; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none; cursor: none;
    font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }
  #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: hidden; background: #04050f; --u: 1px; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  #hud { position: absolute; left: 0; right: 0; top: 8.2%; text-align: center; pointer-events: none; }
  #title {
    font-size: calc(var(--u) * 44); font-weight: 900; letter-spacing: .14em; white-space: nowrap;
    color: #fff; text-shadow: 0 0 calc(var(--u) * 26) rgba(130, 170, 255, .95), 0 0 calc(var(--u) * 60) rgba(130, 90, 255, .6);
    animation: breathe 2.4s ease-in-out infinite;
  }
  #count {
    margin-top: calc(var(--u) * 16); font-size: calc(var(--u) * 150); font-weight: 900; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: .02em;
    text-shadow: 0 0 calc(var(--u) * 30) rgba(255, 255, 255, .55), 0 0 calc(var(--u) * 80) var(--glow, rgba(120, 140, 255, .9));
    will-change: transform;
  }
  #label { margin-top: calc(var(--u) * 4); font-size: calc(var(--u) * 30); font-weight: 800; letter-spacing: .55em; opacity: .65; padding-left: .55em; }
  @keyframes breathe { 0%, 100% { opacity: .82; } 50% { opacity: 1; } }

  #end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 20); pointer-events: none; opacity: 0; transition: opacity .8s ease; }
  #end.show { opacity: 1; }
  #end { padding: 2.5% 0; background: radial-gradient(ellipse at center, rgba(3,4,20,.7), rgba(3,4,20,0) 72%); }
  #endBig { font-size: calc(var(--u) * 200); font-weight: 900; text-shadow: 0 0 calc(var(--u) * 60) rgba(255,255,255,.8), 0 0 calc(var(--u) * 140) var(--glow, #88f); font-variant-numeric: tabular-nums; }
  #endMid { font-size: calc(var(--u) * 52); font-weight: 900; letter-spacing: .5em; padding-left: .5em; opacity: .85; }
  #endSmall { font-size: calc(var(--u) * 60); font-weight: 900; letter-spacing: .14em; margin-top: calc(var(--u) * 50); padding: calc(var(--u) * 14) calc(var(--u) * 44); border-radius: 999px; background: rgba(255,255,255,.14); border: calc(var(--u) * 3) solid rgba(255,255,255,.55); box-shadow: 0 0 calc(var(--u) * 50) var(--glow, #88f); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; mix-blend-mode: screen; }

  #start {
    position: fixed; inset: 0; z-index: 50; cursor: default;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    padding: 24px; text-align: center;
    background: radial-gradient(ellipse at 50% 35%, rgba(60, 40, 160, .55), rgba(3, 4, 14, .94) 70%);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: opacity .5s ease;
  }
  #start.hide { opacity: 0; pointer-events: none; }
  .logo { font-size: 44px; font-weight: 900; letter-spacing: .12em; line-height: 1.05; text-shadow: 0 0 30px rgba(130,170,255,.95), 0 0 70px rgba(150,90,255,.7); }
  .grp { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .grp small { font-size: 11px; letter-spacing: .3em; opacity: .55; font-weight: 700; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chip {
    padding: 9px 15px; border-radius: 999px; font-size: 13px; font-weight: 800; letter-spacing: .08em; cursor: pointer;
    background: rgba(255,255,255,.08); border: 1.5px solid rgba(255,255,255,.2); color: #fff;
  }
  .chip.on { background: rgba(255,255,255,.92); color: #0a0a20; border-color: #fff; box-shadow: 0 0 22px rgba(160,180,255,.7); }
  #go {
    margin-top: 6px; padding: 18px 44px; border-radius: 18px; border: none; cursor: pointer;
    font-size: 20px; font-weight: 900; letter-spacing: .18em; color: #06091f;
    background: linear-gradient(180deg, #b6e3ff, #6aa8ff 55%, #9a7bff); box-shadow: 0 0 36px rgba(110,150,255,.8), 0 0 90px rgba(150,100,255,.45);
    animation: pulse 1.2s ease-in-out infinite alternate;
  }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }
  .tips { font-size: 12px; line-height: 1.7; opacity: .62; max-width: 330px; letter-spacing: .03em; }

  /* ---- Pick Your Color Race ---- */
  #title { animation: none; position: absolute; left: 0; right: 0; top: 4.2%; text-align: center; font-size: calc(var(--u) * 40); font-weight: 900; letter-spacing: .16em; opacity: 0; transition: opacity .5s; pointer-events: none; text-shadow: 0 0 calc(var(--u) * 24) rgba(130,170,255,.95); }
  #rank { position: absolute; left: 0; top: 8.6%; width: calc(var(--u) * 1000); height: calc(var(--u) * 70); opacity: 0; transition: opacity .5s; pointer-events: none; }
  .racing #title, .racing #rank { opacity: 1; }
  .rchip { position: absolute; left: 0; top: 0; height: 100%; display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 8); transition: transform .45s cubic-bezier(.3,1.4,.5,1); }
  .rchip i, .ichip i { display: block; width: calc(var(--u) * 26); height: calc(var(--u) * 26); border-radius: 50%; background: var(--c); box-shadow: 0 0 calc(var(--u) * 18) var(--c); flex: none; }
  .rchip b { font-size: calc(var(--u) * 25); font-weight: 900; letter-spacing: .04em; text-shadow: 0 0 calc(var(--u) * 10) rgba(0,0,0,.8); }
  .rchip.lead { filter: drop-shadow(0 0 calc(var(--u) * 14) var(--c)); }
  .rchip.lead b { color: var(--c); }
  .rchip:not(.lead) { opacity: .78; }
  #toast { position: absolute; left: 0; right: 0; top: 16%; text-align: center; font-size: calc(var(--u) * 52); font-weight: 900; letter-spacing: .06em; color: var(--c, #fff); opacity: 0; pointer-events: none; text-shadow: 0 0 calc(var(--u) * 30) var(--c), 0 calc(var(--u) * 4) 0 rgba(0,0,0,.6); }
  #toast.show { animation: toast 1.6s ease-out forwards; }
  @keyframes toast { 0% { opacity: 0; transform: scale(.6); } 12% { opacity: 1; transform: scale(1.12); } 22% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(calc(var(--u) * -30)); } }
  #intro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; pointer-events: none; opacity: 0; transition: opacity .35s; }
  #intro.show { opacity: 1; }
  #introBig { margin-top: 9%; font-size: calc(var(--u) * 78); font-weight: 900; letter-spacing: .06em; text-align: center; line-height: 1.05; text-shadow: 0 0 calc(var(--u) * 40) rgba(130,170,255,1), 0 0 calc(var(--u) * 90) rgba(150,90,255,.8); animation: breathe 1.4s ease-in-out infinite; }
  #introAsk { margin-top: calc(var(--u) * 14); font-size: calc(var(--u) * 40); font-weight: 900; letter-spacing: .08em; color: #ffe27a; text-shadow: 0 0 calc(var(--u) * 24) rgba(255,200,60,.9); text-align: center; }
  #introChips { margin-top: calc(var(--u) * 34); display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * 14); width: calc(var(--u) * 900); }
  .ichip { display: flex; align-items: center; gap: calc(var(--u) * 14); padding: calc(var(--u) * 14) calc(var(--u) * 28); border-radius: 999px; border: calc(var(--u) * 4) solid var(--c); background: rgba(10,12,40,.55); box-shadow: 0 0 calc(var(--u) * 30) var(--c); }
  .ichip i { width: calc(var(--u) * 38); height: calc(var(--u) * 38); }
  .ichip b { font-size: calc(var(--u) * 40); font-weight: 900; letter-spacing: .06em; }
  #cd { position: absolute; left: 0; right: 0; top: 56%; text-align: center; font-size: calc(var(--u) * 200); font-weight: 900; text-shadow: 0 0 calc(var(--u) * 60) rgba(255,255,255,.95), 0 0 calc(var(--u) * 140) rgba(120,150,255,.9); pointer-events: none; transform: translateY(-50%); }
  #cd.pop { animation: pop .65s ease-out; }
  @keyframes pop { 0% { transform: translateY(-50%) scale(.3); opacity: 0; } 35% { transform: translateY(-50%) scale(1.25); opacity: 1; } 100% { transform: translateY(-50%) scale(1); opacity: 1; } }
  #end { position: absolute; left: 0; right: 0; top: 20%; bottom: auto; justify-content: flex-start; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 14); opacity: 0; transition: opacity .7s; pointer-events: none; text-align: center; }
  #end.show { opacity: 1; }
  #end { padding: 2.5% 0; background: radial-gradient(ellipse at center, rgba(3,4,20,.7), rgba(3,4,20,0) 72%); }
  #endBig { font-size: calc(var(--u) * 84); font-weight: 900; letter-spacing: .03em; white-space: nowrap; text-shadow: 0 0 calc(var(--u) * 50) var(--c, #88f), 0 calc(var(--u) * 6) 0 rgba(0,0,0,.55); animation: breathe 1.2s ease-in-out infinite; }
  #endAsk { font-size: calc(var(--u) * 46); font-weight: 900; letter-spacing: .07em; color: #ffe27a; text-shadow: 0 0 calc(var(--u) * 24) rgba(255,200,60,.9); }
  #endCta { margin-top: calc(var(--u) * 12); font-size: calc(var(--u) * 44); font-weight: 900; letter-spacing: .14em; padding: calc(var(--u) * 12) calc(var(--u) * 40); border-radius: 999px; background: rgba(255,255,255,.14); border: calc(var(--u) * 3) solid rgba(255,255,255,.55); box-shadow: 0 0 calc(var(--u) * 50) var(--glow, #88f); }
</style>
</head>
<body>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="title"></div>
  <div id="rank"></div>
  <div id="toast"></div>
  <div id="intro"><div id="introBig">PICK YOUR<br>COLOR</div><div id="introAsk"></div><div id="introChips"></div></div>
  <div id="cd"></div>
  <div id="end"><div id="endBig"></div><div id="endAsk"></div><div id="endCta"></div></div>
  <div id="flash"></div>
</div>

<div id="start">
  <div class="logo">PICK YOUR<br>COLOR RACE</div>
  <div class="grp"><small>LENGTH</small><div class="chips" id="durChips"></div></div>
  <div class="grp"><small>RACERS</small><div class="chips" id="nChips"></div></div>
  <div class="grp"><small>COLORS</small><div class="chips" id="themeChips"></div></div>
  <button id="go">TAP TO START</button>
  <div class="tips">🔊 volume up · silent mode off<br>🎥 start the screen recording first, then tap<br>first 4 seconds = pick-your-color intro, keep it!</div>
</div>

<script>
(() => {
'use strict';

// ============================================================
//  CONFIG — URL examples: ?d=40&n=6&ask=COMMENT%20YOUR%20COLOR&end=FOLLOW%20FOR%20MORE&bpm=112
// ============================================================
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const Q = new URLSearchParams(location.search);
let saved = {};
try { saved = JSON.parse(localStorage.getItem('colorRace') || '{}') || {}; } catch (e) {}
const settings = { dur: +Q.get('d') || saved.dur || 35, n: +Q.get('n') || saved.n || 6, theme: (saved.theme === undefined ? -1 : saved.theme) };
function saveSettings() { try { localStorage.setItem('colorRace', JSON.stringify({ dur: settings.dur, n: settings.n, theme: settings.theme })); } catch (e) {} }
const CONFIG = {
  TITLE:   Q.get('title') || 'WHO WINS?',
  ASK:     Q.get('ask')   || 'COMMENT YOUR COLOR 👇',
  END_ASK: Q.get('endask')|| 'DID YOUR COLOR WIN?',
  END_TEXT:Q.get('end')   || 'FOLLOW FOR MORE',
  BPM:     clamp(+Q.get('bpm') || 112, 84, 140)
};
const PAL = [
  { name: 'RED', h: 355 }, { name: 'BLUE', h: 215 }, { name: 'YELLOW', h: 52 },
  { name: 'GREEN', h: 135 }, { name: 'PURPLE', h: 282 }, { name: 'ORANGE', h: 24 }
];
const THEMES = [
  { name: 'AURORA',  lo: 170, hi: 290, key: 9, mode: 'min', bg: ['#04061a', '#0a0430'], glow: 'rgba(130,100,255,.9)' },
  { name: 'SUNSET',  lo: 300, hi: 380, key: 2, mode: 'maj', bg: ['#14040f', '#260709'], glow: 'rgba(255,100,90,.9)' },
  { name: 'OCEAN',   lo: 165, hi: 240, key: 4, mode: 'min', bg: ['#010a14', '#03203a'], glow: 'rgba(40,200,255,.9)' },
  { name: 'NIGHT',   lo: 200, hi: 330, key: 0, mode: 'maj', bg: ['#05050f', '#0e0720'], glow: 'rgba(200,120,255,.85)' }
];
const PROG = { min: [[0, 'm'], [8, 'M'], [3, 'M'], [10, 'M']], maj: [[0, 'M'], [7, 'M'], [9, 'm'], [5, 'M']] };
const LW = 1000, DT = 1 / 180;

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

// ============================================================
//  DOM
// ============================================================
const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d', { alpha: false });
const rankEl = $('rank'), toastEl = $('toast'), introEl = $('intro'), endEl = $('end'), flashEl = $('flash'), titleEl = $('title');
titleEl.textContent = CONFIG.TITLE; $('introAsk').textContent = CONFIG.ASK; $('endAsk').textContent = CONFIG.END_ASK; $('endCta').textContent = CONFIG.END_TEXT;

function buildChips() {
  const mk = (id, items, isOn, onClick) => {
    const box = $(id); box.innerHTML = '';
    items.forEach((it, i) => { const c = document.createElement('div'); c.className = 'chip' + (isOn(i, it) ? ' on' : ''); c.textContent = it.label; c.onclick = () => { onClick(i, it); saveSettings(); buildChips(); }; box.appendChild(c); });
  };
  mk('durChips', [25, 35, 45].map(v => ({ label: v + 's', v })), (i, it) => Math.abs(settings.dur - it.v) < 6, (i, it) => { settings.dur = it.v; });
  mk('nChips', [4, 5, 6].map(v => ({ label: v + ' BALLS', v })), (i, it) => settings.n === it.v, (i, it) => { settings.n = it.v; });
  mk('themeChips', [{ label: 'AUTO' }].concat(THEMES.map(t => ({ label: t.name }))), (i) => settings.theme === i - 1, (i) => { settings.theme = i - 1; });
}
buildChips();

// ============================================================
//  LAYOUT
// ============================================================
let SW = 0, SH = 0, SC = 1, LH = 1900, dpr = 1, theme = THEMES[0];
const sprites = [];
function layout() {
  const vv = window.visualViewport;
  const vw = Math.floor(vv ? vv.width : innerWidth), vh = Math.floor(vv ? vv.height : innerHeight);
  SW = vw; SH = vh;
  if (vw / vh > 0.62) { SH = vh; SW = Math.round(vh * 9 / 16); }
  stage.style.width = SW + 'px'; stage.style.height = SH + 'px';
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(SW * dpr); cv.height = Math.round(SH * dpr);
  SC = SW / LW; LH = SH / SC;
  stage.style.setProperty('--u', SC + 'px');
}
function makeSprites() {
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'), h = i * 6;
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, `hsla(${h},100%,72%,1)`); gr.addColorStop(0.22, `hsla(${h},100%,58%,.6)`);
    gr.addColorStop(0.55, `hsla(${h},100%,50%,.16)`); gr.addColorStop(1, `hsla(${h},100%,50%,0)`);
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64); sprites.push(c);
  }
}
makeSprites();
const spr = h => sprites[Math.round((((h % 360) + 360) % 360) / 6) % 60];

// ============================================================
//  AUDIO
// ============================================================
let ac = null, master, melodyBus, drumBus, padBus, reverbIn, delayIn, noiseBuf;
const panBuses = [];
let voicesEnd = [];

function makeIR(sec, decay) {
  const len = Math.floor(ac.sampleRate * sec), b = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
  return b;
}
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  ac = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 20; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
  master = ac.createGain(); master.gain.value = 0.9; master.connect(comp); comp.connect(ac.destination);

  const conv = ac.createConvolver(); conv.buffer = makeIR(2.8, 2.6);
  reverbIn = ac.createGain(); reverbIn.connect(conv);
  const rvOut = ac.createGain(); rvOut.gain.value = 0.42; conv.connect(rvOut); rvOut.connect(master);

  const dly = ac.createDelay(1.5); dly.delayTime.value = (60 / CONFIG.BPM) * 0.75;
  const fb = ac.createGain(); fb.gain.value = 0.36;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
  delayIn = ac.createGain(); delayIn.connect(dly); dly.connect(lp); lp.connect(fb); fb.connect(dly);
  const dOut = ac.createGain(); dOut.gain.value = 0.34; lp.connect(dOut); dOut.connect(master);
  const dRv = ac.createGain(); dRv.gain.value = 0.3; lp.connect(dRv); dRv.connect(reverbIn);

  melodyBus = ac.createGain(); melodyBus.gain.value = 1;
  melodyBus.connect(master);
  const mr = ac.createGain(); mr.gain.value = 0.55; melodyBus.connect(mr); mr.connect(reverbIn);
  const md = ac.createGain(); md.gain.value = 0.32; melodyBus.connect(md); md.connect(delayIn);

  drumBus = ac.createGain(); drumBus.gain.value = 0.85; drumBus.connect(master);
  const dr = ac.createGain(); dr.gain.value = 0.12; drumBus.connect(dr); dr.connect(reverbIn);
  padBus = ac.createGain(); padBus.gain.value = 1; padBus.connect(master);
  const pr = ac.createGain(); pr.gain.value = 0.6; padBus.connect(pr); pr.connect(reverbIn);

  for (let i = 0; i < 5; i++) {
    if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = (i - 2) * 0.32; p.connect(melodyBus); panBuses.push(p); }
    else panBuses.push(melodyBus);
  }
  const n = ac.sampleRate * 2; noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  setInterval(scheduler, 25);
}
const panFor = x01 => panBuses[clamp(Math.floor(x01 * 5), 0, 4)];
function noiseSrc(t, dur) { const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05); return s; }

function pluck(t, midi, vel, x01) {
  const f = mtof(midi), dur = clamp(1.6 - (midi - 60) / 38, 0.55, 1.5);
  const o1 = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), g2 = ac.createGain();
  o1.type = 'sine'; o2.type = 'triangle'; o1.frequency.value = f; o2.frequency.value = f * 2;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05 + 0.3 * vel, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  g2.gain.value = 0.3; o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(panFor(x01));
  o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  voicesEnd.push(t + dur);
}
function mallet(t, midi, vel, x01) {
  const f = mtof(midi), dur = 1.5;
  const o1 = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), g2 = ac.createGain();
  o1.type = 'triangle'; o2.type = 'sine'; o1.frequency.value = f; o2.frequency.value = f * 4;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.1 + 0.4 * vel, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  g2.gain.setValueAtTime(0.16, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(panFor(x01));
  o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  voicesEnd.push(t + dur);
}
function kick(t, v) {
  const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine';
  o.frequency.setValueAtTime(155, t); o.frequency.exponentialRampToValueAtTime(46, t + 0.11);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.95 * v, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
  o.connect(g); g.connect(drumBus); o.start(t); o.stop(t + 0.4);
}

function onFinish(b) {

}
function onWin(b) {

  for (let k = 0; k < 9; k++) pluck(t + 0.05 + k * 0.06, ch.pool[Math.min(ch.pool.length - 1, 1 + k)], 0.85, (k % 5) / 4);
  [0, 7, 12].forEach((o, i) => mallet(t + 0.02, ch.root + 12 + o + (ch.third === 3 && i === 1 ? -4 : 0), 0.9, 0.5));

}

// ============================================================
//  EVENTS → VISUALS
// ============================================================
function addRipple(x, y, hue, big, life, maxR) { if (ripples.length < 80) ripples.push({ x, y, hue, age: 0, life: life || 0.7, big, maxR: maxR || 100 }); }
function sparks(x, y, hue, n, spd) {
  for (let i = 0; i < n && parts.length < 700; i++) { const a = Math.random() * 6.283, v = (0.3 + Math.random()) * spd; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, age: 0, life: 0.4 + Math.random() * 0.7, hue, s: 1.8 + Math.random() * 3 }); }
}
function showToast(text, hue) {
  toastEl.textContent = text; toastEl.style.setProperty('--c', `hsl(${hue},100%,66%)`);
  toastEl.classList.remove('show'); void toastEl.offsetWidth; toastEl.classList.add('show');
}
function processEvents(now) {
  for (let i = events.length - 1; i >= 0; i--) {
    const e = events[i]; if (e.t > now + 0.003) continue; events.splice(i, 1);
    switch (e.type) {

      case 'bump': sparks(e.x, e.y, e.hue, 3, 160); break;
      case 'kick': bgPulse = Math.max(bgPulse, e.v); break;
      case 'cd': $('cd').textContent = e.n; $('cd').classList.remove('pop'); void $('cd').offsetWidth; $('cd').classList.add('pop'); bgPulse = 0.7; break;
      case 'go':
        $('cd').textContent = 'GO!'; $('cd').classList.remove('pop'); void $('cd').offsetWidth; $('cd').classList.add('pop');
        introEl.classList.remove('show'); stage.classList.add('racing'); bgPulse = 1.4;
        setTimeout(() => { if ($('cd').textContent === 'GO!') $('cd').textContent = ''; }, 700); break;
      case 'lead': showToast(e.name + ' TAKES THE LEAD!', e.hue); bgPulse = 1; break;
      case 'fin': addRipple(e.b.x, W.Yfin, e.b.h, true, 0.9, 260); sparks(e.b.x, W.Yfin, e.b.h, 24, 500); break;
      case 'win':
        flashEl.style.transition = 'none'; flashEl.style.opacity = 0.85; void flashEl.offsetWidth; flashEl.style.transition = 'opacity 1.3s ease-out'; flashEl.style.opacity = 0;
        bgPulse = 1.6; countPulse = 1; toastEl.classList.remove('show');
        for (let k = 0; k < 4; k++) addRipple(e.b.x, W.Yfin, (e.b.h + k * 30) % 360, true, 1.1 + k * 0.1, 600);
        for (let k = 0; k < 170; k++) { const a = -Math.PI * (0.05 + 0.9 * Math.random()), v = 300 + Math.random() * 1000; parts.push({ x: e.b.x, y: W.Yfin, vx: Math.cos(a) * v, vy: Math.sin(a) * v, age: 0, life: 1.2 + Math.random() * 1.4, hue: PAL[k % N].h, s: 3 + Math.random() * 5 }); }
        break;
      case 'endcard': { const c = $('endBig'); c.textContent = e.b.name + ' WINS!'; c.style.color = `hsl(${e.b.h},100%,66%)`; c.style.setProperty('--c', `hsl(${e.b.h},100%,60%)`); endEl.classList.add('show'); break; }
    }
  }
}

// ============================================================
//  DRAW
// ============================================================
function drawTrack(t, k, top, bot) {
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  // section stripes & labels
  for (const s of W.secs) {
    if (s.y + SEC_H < top || s.y > bot) continue;
    const g = ctx.createLinearGradient(0, s.y, 0, s.y + SEC_H); g.addColorStop(0, `hsla(${s.hue},100%,55%,0.05)`); g.addColorStop(1, `hsla(${s.hue},100%,55%,0)`);
    ctx.fillStyle = g; ctx.fillRect(0, s.y, LW, SEC_H);
  }
  for (const s of W.segs) {
    if (Math.max(s.y1, s.y2) < top - 40 || Math.min(s.y1, s.y2) > bot + 40) continue;
    const l = s.lit; s.lit *= run.decay;
    for (const [w, a] of [[s.t * 2 + 14, 0.14 + 0.22 * l], [s.t * 2 + 4, 0.35 + 0.4 * l], [s.t * 2 - 8 > 3 ? s.t * 2 - 8 : 3, 0.95]]) {
      ctx.strokeStyle = w === 3 || w === s.t * 2 - 8 ? `hsla(${s.hue},100%,${82 + 12 * l}%,${a})` : `hsla(${s.hue},100%,${58 + 22 * l}%,${a})`; ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
    }

    if (c.y < top - 80 || c.y > bot + 80) continue;
    const l = c.lit; c.lit *= run.decay; if (c.cool > 0) c.cool -= run.dtf;
    const big = c.kind === 'bump';
    ctx.globalAlpha = (big ? 0.28 : 0.5) + 0.5 * l; const s = c.r * (big ? 2.5 : 2.6) * (1 + 0.5 * l); ctx.drawImage(spr(c.hue), c.x - s, c.y - s, s * 2, s * 2); ctx.globalAlpha = 1;
    ctx.fillStyle = `hsla(${c.hue},95%,${big ? 48 : 45}%,${(big ? 0.38 : 0.55) + 0.45 * l})`; ctx.beginPath(); ctx.arc(c.x, c.y, c.r * (0.84 + 0.2 * l), 0, 6.283); ctx.fill();
    ctx.strokeStyle = `hsla(${c.hue},100%,88%,${0.7 + 0.3 * l})`; ctx.lineWidth = big ? 4 : 2.5; ctx.stroke();
  }
}
function drawFinish() {
  const y = W.Yfin, cs = 30; ctx.globalCompositeOperation = 'source-over';
  for (let i = 0; i < LW / cs; i++) for (let j = 0; j < 2; j++) { ctx.fillStyle = (i + j) % 2 ? 'rgba(255,255,255,0.85)' : 'rgba(10,10,30,0.9)'; ctx.fillRect(i * cs, y - 30 + j * cs, cs, cs); }
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createLinearGradient(0, y - 120, 0, y + 80); g.addColorStop(0, 'rgba(255,220,100,0)'); g.addColorStop(0.55, 'rgba(255,220,100,0.35)'); g.addColorStop(1, 'rgba(255,220,100,0)');
  ctx.fillStyle = g; ctx.fillRect(0, y - 120, LW, 200);
  ctx.globalCompositeOperation = 'source-over'; ctx.font = '900 64px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,235,150,0.95)'; ctx.fillText('FINISH', LW / 2, y - 70);
}
function drawBall(b, isLead, now) {
  ctx.globalCompositeOperation = 'lighter';
  const tr = b.trail;
  for (let i = 1; i < tr.length; i++) { const a = i / tr.length; ctx.strokeStyle = `hsla(${b.h},100%,60%,${a * 0.5})`; ctx.lineWidth = b.r * 1.5 * a; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(tr[i - 1].x, tr[i - 1].y); ctx.lineTo(tr[i].x, tr[i].y); ctx.stroke(); }
  const rr = b.r * (1 + 0.12 * b.sq), s = rr * 3.4; ctx.globalAlpha = 0.9; ctx.drawImage(spr(b.h), b.x - s, b.y - s, s * 2, s * 2); ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  const g = ctx.createRadialGradient(b.x - rr * 0.3, b.y - rr * 0.35, rr * 0.08, b.x, b.y, rr);
  g.addColorStop(0, `hsl(${b.h},100%,86%)`); g.addColorStop(0.55, `hsl(${b.h},100%,58%)`); g.addColorStop(1, `hsl(${b.h},95%,40%)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, rr, 0, 6.283); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 3; ctx.stroke();
  if (isLead && !winner) { // name tag above the leader
    ctx.font = '900 30px sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(0,0,10,.75)'; ctx.fillStyle = `hsl(${b.h},100%,72%)`;
    ctx.strokeText(b.name, b.x, b.y - rr - 18); ctx.fillText(b.name, b.x, b.y - rr - 18);
  }
}
function drawCrown(x, y, w) {
  const h = w * 0.85; ctx.save(); ctx.translate(x, y); const g = ctx.createLinearGradient(0, -h * 1.2, 0, 0); g.addColorStop(0, '#fff3a0'); g.addColorStop(1, '#ffb400');
  ctx.shadowColor = 'rgba(255,200,40,.95)'; ctx.shadowBlur = 24; ctx.fillStyle = g; ctx.beginPath();
  ctx.moveTo(-w, 0); ctx.lineTo(-w, -h); ctx.lineTo(-w * 0.5, -h * 0.45); ctx.lineTo(0, -h * 1.25); ctx.lineTo(w * 0.5, -h * 0.45); ctx.lineTo(w, -h); ctx.lineTo(w, 0); ctx.closePath(); ctx.fill(); ctx.restore();
}
function draw(dt, now) {
  const raceT = Math.max(0, simPos - run.introLen), t = raceT;
  run.decay = Math.exp(-dt * 4.2); run.dtf = dt;
  // camera
  const sorted = rankSort(), lead = sorted[0];
  let avg = 0; racers.forEach(r => avg += r.y); avg /= racers.length;
  let tgtY, tgtZ = 1;
  if (simPos < run.introLen) tgtY = Y0 + 0.08 * LH;
  else if (winner) { tgtY = W.Yfin - 60; tgtZ = 1.12; }
  else {
    tgtY = lead.y * 0.45 + avg * 0.55 + 0.10 * LH;
    const near = clamp((lead.y - (W.Yfin - 1000)) / 700, 0, 1); tgtZ = 1 + 0.3 * near * near * (3 - 2 * near);
  }
  const kk = 1 - Math.pow(0.0005, dt); camY += (tgtY - camY) * kk; camZ += (tgtZ - camZ) * (1 - Math.pow(0.02, dt));
  const half = LH / 2 / camZ, minC = Math.min(half - 160, Y0 + 0.08 * LH), maxC = W.floorY + 80 - half; camY = clamp(camY, minC, Math.max(minC, maxC));

  // background
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const bgg = ctx.createLinearGradient(0, 0, 0, cv.height); bgg.addColorStop(0, theme.bg[0]); bgg.addColorStop(1, theme.bg[1]); ctx.fillStyle = bgg; ctx.fillRect(0, 0, cv.width, cv.height);
  const prog = clamp((camY - Y0) / (W.Yfin - Y0), 0, 1);
  ctx.globalCompositeOperation = 'lighter';
  if (bgPulse > 0.01) { const gg = ctx.createRadialGradient(cv.width / 2, cv.height * 0.5, 0, cv.width / 2, cv.height * 0.5, cv.height * 0.6); gg.addColorStop(0, `hsla(${hueRange(prog)},90%,55%,${0.16 * Math.min(bgPulse, 1.6)})`); gg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = gg; ctx.fillRect(0, 0, cv.width, cv.height); bgPulse *= Math.exp(-dt * 6); }
  for (const s of stars) { // parallax dust
    const sy = ((s.y - camY * s.z) % 2400 + 2400) % 2400 * (cv.height / dpr / SC / 2400) * 1.0, sx = s.x * SC * dpr;
    ctx.fillStyle = `hsla(${hueRange(s.h)},90%,75%,${0.12 + 0.3 * s.z})`; ctx.fillRect(sx, sy * SC * dpr, s.s * dpr * 1.4, s.s * dpr * 1.4);
  }
  // world
  ctx.setTransform(kz, 0, 0, kz, cv.width / 2 - LW / 2 * kz, cv.height / 2 - camY * kz);
  drawTrack(t, kz, top, bot); drawFinish();
  // side walls glow
  ctx.globalCompositeOperation = 'lighter'; for (const x of [0, LW]) { const g = ctx.createLinearGradient(x - 40, 0, x + 40, 0); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.5, `hsla(${hueRange(prog)},100%,60%,.45)`); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(x - 40, top, 80, bot - top); }
  // ripples
  for (let i = ripples.length - 1; i >= 0; i--) { const r = ripples[i]; r.age += dt; const u = r.age / r.life; if (u >= 1) { ripples.splice(i, 1); continue; } ctx.strokeStyle = `hsla(${r.hue},100%,70%,${(1 - u) * (r.big ? 0.9 : 0.5)})`; ctx.lineWidth = (r.big ? 7 : 3) * (1 - u) + 1; ctx.beginPath(); ctx.arc(r.x, r.y, 12 + u * r.maxR, 0, 6.283); ctx.stroke(); }
  // balls
  for (const b of racers) { if (simPos >= run.introLen && !b.fin || b.fin) { b.trail.push({ x: b.x, y: b.y }); if (b.trail.length > 14) b.trail.shift(); } }
  const intro = simPos < run.introLen;
  for (const b of racers.slice().reverse()) { if (intro) { b.y = Y0 + Math.sin(simPos * 3 + b.id) * 7; b.x = (b.id + 0.5) * LW / N; } drawBall(b, b === lead && !intro, now); }
  if (winner) { const w = winner; ctx.globalCompositeOperation = 'source-over'; drawCrown(w.x, w.y - w.r - 26 + Math.sin(simPos * 6) * 4, 30); }
  // particles
  ctx.globalCompositeOperation = 'lighter';
  for (let i = parts.length - 1; i >= 0; i--) { const q = parts[i]; q.age += dt; if (q.age >= q.life) { parts.splice(i, 1); continue; } q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 500 * dt; q.vx *= 0.985; ctx.globalAlpha = 1 - q.age / q.life; ctx.fillStyle = `hsl(${q.hue},100%,72%)`; ctx.fillRect(q.x, q.y, q.s, q.s); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  // screen-space overlays: off-screen arrows for balls that fell behind, and a progress rail
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!intro) {
    const topW = camY - half, sx = v => (v - 0) * SC;
    const vis0 = topW + 0.17 * LH / camZ;
    for (const b of racers) if (b.y < vis0 && !b.fin) {
      const x = clamp(b.x * SC, 30, SW - 30), y = SH * 0.205;
      ctx.fillStyle = `hsl(${b.h},100%,62%)`; ctx.beginPath(); ctx.moveTo(x, y - 16); ctx.lineTo(x - 15, y + 10); ctx.lineTo(x + 15, y + 10); ctx.closePath(); ctx.fill();
      ctx.font = '900 13px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText(b.name[0], x, y + 25);
    }
    const rx = SW - 7, ry0 = SH * 0.24, rh = SH * 0.58; ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(rx - 2, ry0, 4, rh);
    ctx.fillStyle = 'rgba(255,215,0,.9)'; ctx.fillRect(rx - 6, ry0 + rh - 2, 12, 3);
    for (const b of racers) { const py = ry0 + clamp((b.y - Y0) / (W.Yfin - Y0), 0, 1) * rh; ctx.fillStyle = `hsl(${b.h},100%,62%)`; ctx.beginPath(); ctx.arc(rx, py, 5, 0, 6.283); ctx.fill(); }
  }
  { const g = ctx.createLinearGradient(0, 0, 0, SH * 0.18); g.addColorStop(0, 'rgba(2,3,14,.82)'); g.addColorStop(1, 'rgba(2,3,14,0)'); ctx.globalAlpha = Math.min(1, !intro ? 1 : 0); ctx.fillStyle = g; ctx.fillRect(0, 0, SW, SH * 0.18); ctx.globalAlpha = 1; }
  // HUD ranking
  const order = rankSort(); const cw = LW / N;
  order.forEach((r, i) => { r.chip.style.width = (cw * SC) + 'px'; r.chip.style.transform = `translateX(${i * cw * SC}px)`; r.chip.classList.toggle('lead', i === 0); r.chip.dataset.rk = (r.fin ? '🏁' : '') + (i + 1); });
}
function drawIdle() { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#04050f'; ctx.fillRect(0, 0, cv.width, cv.height); }

// ============================================================
//  MAIN LOOP
// ============================================================
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0.001, (ts - lastDrawT) / 1000)); lastDrawT = ts;
  if (!run || !ac) { drawIdle(); return; }
  const now = ac.currentTime;
  voicesEnd = voicesEnd.filter(t => t > now);
  const nk = Math.round((now - run.t0) / run.grid); for (const [key] of buckets) if (nk - parseInt(key.slice(1), 10) > 6) buckets.delete(key);
  processEvents(now);
  const target = now - run.t0;
  if (target > 0) {
    let n = 0;
    while (simPos < target && n < 24) { if (simPos >= run.introLen) physicsStep(); else simPos += DT; n++; }
    if (simPos < target - 0.25) simPos = target;
  }
  // race energy (drives the groove) and the riser before the finish
  if (simPos >= run.introLen && !winner) {
    const lead = rankSort()[0], pr = clamp((lead.y - Y0) / (W.Yfin - Y0), 0, 1); run.energy = 0.2 + 0.8 * pr;
    if (!run.riser && pr > 0.86) { run.riser = true; riser(Math.max(now + 0.05, run.t0 + simPos), 1.7); }
  } else if (simPos < run.introLen) run.energy = 0.05 + 0.2 * (simPos / run.introLen);
  draw(dt, now);
  if (now > run.endT && !run.ended) { run.ended = true; startRun(); }
}

// ============================================================
//  START
// ============================================================
function begin() {
  try { initAudio(); } catch (e) { console.error(e); }
  try { const el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el); } catch (e) {}
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}

}
$('go').addEventListener('click', begin);
document.addEventListener('visibilitychange', () => { if (!document.hidden && ac && ac.state === 'suspended') ac.resume(); });
let rz = null; const onResize = () => { clearTimeout(rz); rz = setTimeout(layout, 120); };
addEventListener('resize', onResize); addEventListener('orientationchange', onResize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
theme = THEMES[settings.theme >= 0 ? settings.theme : 0];
layout(); requestAnimationFrame(frame);
window.__cr = { get run() { return run; }, get ac() { return ac; }, get winner() { return winner && winner.name; }, get fin() { return finishedCount; }, get simPos() { return simPos; }, get lead() { return racers.length ? rankSort()[0].y : 0; }, get Yfin() { return W && W.Yfin; }, get raceT() { return run ? simPos - run.introLen : 0; } };
})();
</script>
